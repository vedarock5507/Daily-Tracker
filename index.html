<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15171b">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>Daily Rhythm</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap');
*{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
body{margin:0;background:var(--bg);color:var(--text);font-family:'IBM Plex Sans', sans-serif;padding:22px 16px 60px;min-height:100vh;overscroll-behavior-y:contain;}
.wrap{max-width:520px;margin:0 auto;}
h1{font-family:'Space Grotesk', sans-serif;font-weight:700;font-size:1.4rem;letter-spacing:-0.01em;margin:0 0 2px;}
.sub{color:var(--muted);font-size:0.85rem;margin:0 0 20px;}

/* Liquid Glass bottom navigation — premium floating glass capsule */
body{padding-bottom:116px;}
.bottom-nav{
  position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom));
  transform:translateX(-50%);z-index:40;
  width:min(calc(100% - 28px),430px);
  display:grid;grid-template-columns:repeat(var(--nav-count,5),1fr);align-items:center;
  padding:7px;border-radius:30px;
  background:linear-gradient(145deg,rgba(39,42,49,.72),rgba(22,24,29,.68));
  border:1px solid rgba(255,255,255,.13);
  box-shadow:0 22px 50px rgba(0,0,0,.46),inset 0 1px 0 rgba(255,255,255,.15),inset 0 -1px 0 rgba(0,0,0,.3);
  backdrop-filter:blur(30px) saturate(155%);-webkit-backdrop-filter:blur(30px) saturate(155%);
  overflow:hidden;isolation:isolate;
}
.bottom-nav:before{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:0;border-radius:inherit;
  background:linear-gradient(115deg,rgba(255,255,255,.13),transparent 28%,rgba(255,255,255,.025) 68%,rgba(255,255,255,.08));
}
.bottom-nav:after{
  content:"";position:absolute;z-index:0;pointer-events:none;
  width:76px;height:66px;
  left:calc(7px + ((100% - 14px) / var(--nav-count,5)) * var(--nav-index,0) + (((100% - 14px) / var(--nav-count,5) - 76px) / 2));
  top:50%;transform:translateY(-50%);border-radius:23px;
  background:linear-gradient(145deg,rgba(255,255,255,.20),rgba(255,255,255,.055));
  border:1px solid rgba(255,255,255,.20);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.29),inset 0 -1px 0 rgba(0,0,0,.18),0 8px 22px rgba(0,0,0,.22);
  backdrop-filter:blur(17px) saturate(160%);-webkit-backdrop-filter:blur(17px) saturate(160%);
  transition:left .46s cubic-bezier(.22,1,.36,1),transform .18s ease;
}
.nav-btn{position:relative;z-index:1;background:transparent!important;border:0;color:rgba(240,237,230,.72);
  cursor:pointer;width:100%;height:66px;border-radius:23px;display:flex;align-items:center;justify-content:center;
  transition:color .28s ease,transform .18s cubic-bezier(.2,.8,.2,1);font-family:inherit;
}
.nav-btn.active{color:var(--gold);}
.nav-btn:active{transform:scale(.90);}
.nav-btn svg{width:28px;height:28px;stroke:currentColor;fill:none;stroke-width:1.85;stroke-linecap:round;stroke-linejoin:round;transition:transform .32s cubic-bezier(.2,1.4,.4,1),stroke-width .2s,filter .25s;}
.nav-btn.active svg{transform:scale(1.08);stroke-width:2.05;filter:drop-shadow(0 3px 8px rgba(224,170,74,.32));}
.nav-btn:not(.active):hover{color:rgba(240,237,230,.94);}
@media (prefers-reduced-motion:reduce){.bottom-nav:after,.nav-btn,.nav-btn svg{transition:none!important;}}

/* top-right settings icon, replacing the old Reminders tab */
.top-bar{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:2px;}
.settings-btn{background:var(--surface);border:1px solid var(--line);color:var(--muted);width:36px;height:36px;
  border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1rem;cursor:pointer;flex-shrink:0;}
.settings-btn:active{transform:scale(0.92);}

.tabpane{display:none;} .tabpane.active{display:block;animation:fadein 0.3s cubic-bezier(0.22,1,0.36,1);}
@keyframes fadein{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
::view-transition-old(root), ::view-transition-new(root){
  animation-duration:0.32s;
  animation-timing-function:cubic-bezier(0.22,1,0.36,1);
}
html[data-swipe-dir="left"]::view-transition-old(root){animation-name:pdSlideOutL;}
html[data-swipe-dir="left"]::view-transition-new(root){animation-name:pdSlideInR;}
html[data-swipe-dir="right"]::view-transition-old(root){animation-name:pdSlideOutR;}
html[data-swipe-dir="right"]::view-transition-new(root){animation-name:pdSlideInL;}
@keyframes pdSlideOutL{to{transform:translateX(-22%);opacity:0;filter:blur(6px);}}
@keyframes pdSlideInR{from{transform:translateX(22%);opacity:0;filter:blur(6px);}to{transform:none;opacity:1;filter:blur(0);}}
@keyframes pdSlideOutR{to{transform:translateX(22%);opacity:0;filter:blur(6px);}}
@keyframes pdSlideInL{from{transform:translateX(-22%);opacity:0;filter:blur(6px);}to{transform:none;opacity:1;filter:blur(0);}}

.rhythm{display:flex;align-items:flex-end;gap:8px;height:80px;margin-bottom:8px;}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end;cursor:pointer;}
.bar{width:100%;border-radius:5px 5px 3px 3px;transition:opacity 0.2s, transform 0.15s;}
.bar-col:active .bar{transform:scaleY(0.94);}
.bar.today{box-shadow:0 0 0 2px var(--gold);animation:pulse 2.2s ease-in-out infinite;}
.bar.selected{box-shadow:0 0 0 2px var(--text);}
@keyframes pulse{0%,100%{filter:brightness(1);}50%{filter:brightness(1.4);}}
.daylabel{font-size:0.64rem;color:var(--muted);}
.daylabel.today{color:var(--gold);font-weight:600;}

.streak-card{background:linear-gradient(145deg, var(--surface), var(--surface-2));border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;margin:16px 0 18px;animation:fadein 0.4s cubic-bezier(0.22,1,0.36,1);}
.streak-num{font-family:'Space Grotesk';font-size:1.7rem;font-weight:700;color:var(--gold);line-height:1;}
.streak-label{font-size:0.7rem;color:var(--muted);margin-top:2px;}
.streak-note{font-size:0.74rem;color:var(--muted);max-width:170px;text-align:right;}

/* swipe deck */
.swipe-hint{text-align:center;font-size:0.68rem;color:var(--muted);margin-bottom:10px;}
.swipe-viewport{overflow:hidden;position:relative;border-radius:16px;touch-action:pan-y;}
.swipe-track{display:flex;transition:transform 0.28s cubic-bezier(.2,.8,.2,1);}.swipe-page{width:100%;flex:0 0 100%;min-width:100%;}
.dots{display:flex;justify-content:center;gap:6px;margin-top:14px;}
.dot-nav{width:6px;height:6px;border-radius:50%;background:var(--line);transition:all 0.2s;}
.dot-nav.active{background:var(--gold);width:16px;border-radius:4px;}

/* mascot */
.mascot-row{display:flex;align-items:center;gap:12px;margin:2px 0 18px;}
.mascot-face{width:52px;height:52px;flex-shrink:0;}
.pixel-buddy{image-rendering:pixelated;}
.pbuddy-eye{transform-origin:center;transform-box:fill-box;animation:pbuddyEyes 9s ease-in-out infinite;}
.pbuddy-eye-r{animation-name:pbuddyEyesR;}
.pbuddy-mouth{transform-origin:center;transform-box:fill-box;animation:pbuddySmirk 9s ease-in-out infinite;}
.pixel-buddy-sleep .pbuddy-z{animation:pbuddyZ 2.2s ease-in-out infinite;}
@keyframes pbuddyEyes{
  0%,55%{transform:scaleY(1) translateX(0);}
  57%{transform:scaleY(0.15) translateX(0);}   /* blink */
  59%,74%{transform:scaleY(1) translateX(0);}
  76%{transform:scaleY(1) translateX(-0.6px);} /* glance left */
  80%{transform:scaleY(1) translateX(0.6px);}  /* glance right */
  84%,100%{transform:scaleY(1) translateX(0);}
}
@keyframes pbuddyEyesR{
  0%,29%{transform:scaleY(1) translateX(0);}
  31%{transform:scaleY(0.15) translateX(0);}   /* blink, offset from left eye so it doesn't look synced */
  33%,44%{transform:scaleY(1) translateX(0);}
  46%{transform:scaleY(0.15) translateX(0);}   /* wink */
  50%,74%{transform:scaleY(1) translateX(0);}
  76%{transform:scaleY(1) translateX(-0.6px);}
  80%{transform:scaleY(1) translateX(0.6px);}
  84%,100%{transform:scaleY(1) translateX(0);}
}
@keyframes pbuddySmirk{
  0%,88%{transform:none;}
  91%{transform:translateX(0.8px) translateY(-0.4px) rotate(-4deg);} /* smirk */
  95%,100%{transform:none;}
}
@keyframes pbuddyZ{
  0%{opacity:0;transform:translateY(0);}
  30%{opacity:1;}
  100%{opacity:0;transform:translateY(-6px);}
}
.mascot-bubble{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 13px;font-size:0.76rem;color:var(--text);flex:1;line-height:1.35;animation:fadein 0.45s cubic-bezier(0.22,1,0.36,1);transition:background 0.2s ease;}
.mascot-bubble b{color:var(--gold);}

/* study tab: subject chips + progress */
.chip-row{display:flex;gap:8px;margin-bottom:16px;}
.chip{flex:1;background:var(--surface);border:1px solid var(--line);color:var(--muted);padding:9px 0;border-radius:10px;font-size:0.78rem;font-weight:600;text-align:center;cursor:pointer;font-family:inherit;transition:transform 0.1s, background 0.15s ease, border-color 0.15s ease, color 0.15s ease;}
.chip:active{transform:scale(0.95);}
.chip.active{background:var(--surface-2);color:var(--gold);border-color:var(--gold);}
.chip.backlog{border-color:var(--strength);}
.chip.backlog::after{content:'\25CF';color:var(--strength);font-size:0.55rem;margin-left:5px;vertical-align:middle;}
.chip.clear::after{content:'\25CF';color:var(--cardio);font-size:0.55rem;margin-left:5px;vertical-align:middle;}
.progress-track{background:var(--surface-2);border-radius:20px;height:8px;overflow:hidden;margin:6px 0 4px;}
.progress-fill{height:100%;background:var(--gold);border-radius:20px;transition:width 0.3s ease;}
.progress-label{font-size:0.68rem;color:var(--muted);display:flex;justify-content:space-between;margin-bottom:16px;}
.study-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:17px;margin-bottom:14px;}
.study-phase-tag{font-size:0.62rem;text-transform:uppercase;letter-spacing:0.07em;color:var(--gold);font-weight:700;margin-bottom:6px;}
.study-title{font-family:'Space Grotesk';font-weight:700;font-size:1rem;margin-bottom:14px;line-height:1.3;}
.study-title.finished{color:var(--muted);font-family:inherit;font-weight:400;font-size:0.85rem;}
.study-actions-row{display:flex;gap:8px;margin-bottom:14px;}
.notes-wrap{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);}
.notes-label{font-size:0.68rem;text-transform:uppercase;letter-spacing:0.07em;color:var(--muted);margin-bottom:8px;}
.notes-textarea{width:100%;min-height:90px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;color:var(--text);font-family:'IBM Plex Sans';font-size:0.82rem;line-height:1.5;resize:vertical;outline:none;}
.notes-textarea:focus{border-color:var(--gold);}
.study-done-row{display:flex;align-items:center;gap:10px;}
.study-done-row .task-label{font-size:0.82rem;}
.upnext{font-size:0.72rem;color:var(--muted);margin-top:4px;}
.upnext-item{padding:5px 0;border-top:1px solid var(--line);}

.section-label{font-size:0.7rem;text-transform:uppercase;letter-spacing:0.08em;color:var(--muted);margin:0 0 10px;}
.day-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 17px;flex-shrink:0;width:100%;box-shadow:0 4px 20px rgba(0,0,0,0.2);}
.day-card.today{border-color:var(--gold);}
.day-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.day-name{font-weight:700;font-size:1rem;font-family:'Space Grotesk';}
.type-tag{font-size:0.63rem;padding:3px 9px;border-radius:20px;font-weight:600;}

.task-row{display:flex;align-items:center;gap:8px;padding:9px 2px;border-bottom:1px solid var(--line);}
.task-row:last-of-type{border-bottom:none;}
.checkbox{width:19px;height:19px;border-radius:6px;border:1.5px solid var(--muted);flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform 0.1s, background 0.15s ease, border-color 0.15s ease;}
.checkbox:active{transform:scale(0.85);}
.checkbox.checked{background:var(--gold);border-color:var(--gold);}
.checkbox.checked::after{content:'\2713';font-size:11px;color:var(--bg);font-weight:700;}
.task-label{font-size:0.8rem;flex:1;cursor:pointer;}
.task-label .set-info{color:var(--muted);font-size:0.71rem;display:block;}
.task-label.done{color:var(--muted);text-decoration:line-through;}
.task-actions{display:flex;gap:4px;flex-shrink:0;}
.icon-btn{background:var(--surface-2);border:none;color:var(--muted);width:28px;height:28px;border-radius:8px;font-size:0.8rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform 0.1s;}
.icon-btn:active{background:var(--gold);color:var(--bg);transform:scale(0.9);}

.wellness{display:flex;gap:10px;margin-top:14px;}
.wellness-field{flex:1;background:var(--surface-2);border-radius:10px;padding:10px 12px;}
.wellness-field label{display:block;font-size:0.66rem;color:var(--muted);margin-bottom:4px;}
.wellness-field .input-row{display:flex;align-items:baseline;gap:4px;}
.wellness-field input{background:none;border:none;color:var(--text);font-family:'Space Grotesk';font-size:1.15rem;font-weight:700;width:100%;outline:none;}
.wellness-field .unit{font-size:0.68rem;color:var(--muted);}
.wellness-field.hit{outline:1px solid var(--gold);}
.water-controls{display:flex;align-items:center;justify-content:space-between;gap:6px;}
.water-controls .icon-btn{width:26px;height:26px;font-size:0.95rem;flex-shrink:0;}
.water-value{font-family:'Space Grotesk';font-size:1.05rem;font-weight:700;text-align:center;flex:1;}
.water-sub{font-size:0.6rem;color:var(--muted);text-align:center;margin-top:2px;}

.noworkout-row{display:flex;align-items:center;gap:9px;margin:2px 0 12px;cursor:pointer;}
.noworkout-row .task-label{font-size:0.78rem;color:var(--muted);}
.noworkout-note{font-size:0.78rem;color:var(--muted);padding:10px 2px;font-style:italic;}
.locked-content{opacity:0.5;pointer-events:none;user-select:none;}
.locked-banner{font-size:0.7rem;color:var(--muted);background:var(--surface-2);border-radius:8px;padding:7px 10px;margin-bottom:10px;text-align:center;animation:fadein 0.35s cubic-bezier(0.22,1,0.36,1);}
.edit-row{gap:6px;align-items:center;}
.topic-edit-card{background:var(--surface-2);border-radius:12px;padding:10px 12px;margin-bottom:8px;}
.topic-edit-head{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.topic-phase-input{flex:1;font-size:0.72rem;color:var(--muted);background:transparent;border:none;padding:4px 2px;}
.topic-phase-input:focus{background:var(--surface);border-radius:6px;}
.topic-label-input{width:100%;font-size:0.9rem;background:var(--surface);border:1px solid var(--line);}
.edit-input{background:var(--surface-2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:7px 9px;font-family:inherit;font-size:0.8rem;outline:none;}
.edit-input:focus{border-color:var(--gold);}
.edit-label{flex:2;min-width:0;}
.edit-sets{flex:1.2;min-width:0;}


/* v1.4 study command center */
.study-command{background:linear-gradient(145deg,var(--surface),var(--surface-2));border:1px solid var(--line);border-radius:16px;padding:14px;margin:0 0 14px;}
.study-command-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:10px;}
.study-command-title{font-family:'Space Grotesk';font-weight:700;font-size:1rem;}
.study-command-sub{font-size:.7rem;color:var(--muted);margin-top:3px;line-height:1.35;}
.study-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:10px 0;}
.study-kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 8px;text-align:center;}
.study-kpi b{display:block;font-family:'Space Grotesk';font-size:1rem;}
.study-kpi span{display:block;color:var(--muted);font-size:.6rem;margin-top:2px;}
.study-action-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;}
.study-action-grid .btn-primary,.study-action-grid .btn-secondary{width:100%;padding:9px 8px;}
.plan-lane{margin-top:12px;padding-top:10px;border-top:1px solid var(--line);}
.plan-lane-head{display:flex;justify-content:space-between;align-items:center;font-size:.7rem;color:var(--muted);margin-bottom:7px;}
.plan-item{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid var(--line);}
.plan-item:last-child{border-bottom:none;}
.plan-num{width:22px;height:22px;border-radius:50%;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:.65rem;color:var(--gold);font-weight:700;flex:0 0 22px;}
.plan-copy{min-width:0;flex:1;}
.plan-copy b{font-size:.78rem;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.plan-copy span{font-size:.63rem;color:var(--muted);}
.plan-date{font-size:.62rem;color:var(--muted);white-space:nowrap;}
.notebook-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;}
.notebook-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px;}
.notebook-title{font-family:'Space Grotesk';font-weight:700;font-size:.86rem;}
.notebook-meta{font-size:.63rem;color:var(--muted);}
.notebook-note{font-size:.78rem;line-height:1.5;white-space:pre-wrap;color:var(--text);margin-top:7px;}
.notebook-empty{font-size:.75rem;color:var(--muted);padding:14px 0;text-align:center;}
.study-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.76);z-index:70;padding:18px;backdrop-filter:blur(3px);overflow:auto;}
.study-overlay.open{display:block;}
.study-overlay-panel{max-width:520px;margin:16px auto;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;}
.study-overlay-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;}
.study-overlay-head h2{font-family:'Space Grotesk';font-size:1.05rem;margin:0;}
.quick-paste{width:100%;min-height:130px;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:11px;color:var(--text);font-family:inherit;font-size:.8rem;line-height:1.5;resize:vertical;outline:none;}
.quick-paste:focus{border-color:var(--gold);}
.smart-badge{display:inline-flex;align-items:center;gap:5px;background:var(--surface-2);color:var(--gold);border:1px solid var(--line);border-radius:20px;padding:4px 8px;font-size:.59rem;font-weight:700;}
.difficulty-row{display:flex;gap:7px;margin-top:9px;}
.difficulty-row button{flex:1;padding:8px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);color:var(--text);font-size:.68rem;cursor:pointer;}
.difficulty-row button.active{border-color:var(--gold);color:var(--gold);}
.cal-note{margin-top:12px;}
.cal-note textarea{width:100%;min-height:100px;}
.cal-cell.hasnote::after{content:'';position:absolute;width:4px;height:4px;border-radius:50%;background:var(--gold);bottom:5px;}
.cal-cell{position:relative;}

/* calendar */
.cal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.cal-detail-head{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
.cal-detail-date{font-family:'Space Grotesk';font-size:1.05rem;font-weight:700;}
.cal-header button{background:var(--surface);border:1px solid var(--line);color:var(--text);width:32px;height:32px;border-radius:9px;cursor:pointer;font-size:0.9rem;}
.cal-title{font-family:'Space Grotesk';font-weight:700;font-size:1rem;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:20px;}
.cal-dow{text-align:center;font-size:0.62rem;color:var(--muted);padding-bottom:4px;}
.cal-cell{aspect-ratio:1;border-radius:9px;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:0.75rem;cursor:pointer;border:1px solid transparent;color:var(--text);transition:transform 0.1s;}
.cal-cell:active{transform:scale(0.92);}
.cal-cell.empty{background:none;cursor:default;}
.cal-cell.complete{background:rgba(224,170,74,0.18);border-color:var(--gold);color:var(--gold);font-weight:700;}
.cal-cell.selected{border-color:var(--text);}
.cal-cell.istoday{box-shadow:0 0 0 1px var(--gold) inset;}

.reminder-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px;}
.reminder-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.reminder-row input[type=time], .reminder-row input[type=number]{background:var(--surface-2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:6px 10px;font-family:inherit;width:90px;}

/* Final visual pass — cinematic liquid-glass dashboard */
/* Theme tokens: single source of truth. Component/theme overrides live below. */
:root{
  --bg:#0b0d11;
  --surface:#151820;
  --surface-2:#1b1f28;
  --text:#f5f1e9;
  --muted:#918e88;
  --strength:#c05e37;
  --cardio:#3f8a76;
  --recovery:#6d7280;
  --gold:#e5a63e;
  --line:rgba(255,255,255,.09);
  --gold-soft:#f5bf62;
}
html,body{min-height:100%;}
body{
  background:
    radial-gradient(85% 38% at 50% -5%,rgba(196,91,36,.30),transparent 68%),
    radial-gradient(55% 32% at 100% 45%,rgba(219,126,38,.08),transparent 72%),
    radial-gradient(50% 30% at 0% 85%,rgba(214,91,34,.07),transparent 72%),
    #0b0d11;
}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;background:linear-gradient(180deg,rgba(255,255,255,.018),transparent 25%,rgba(0,0,0,.16));}
.wrap{max-width:540px;}
.top-bar{margin:8px 2px 20px;align-items:center;}
.top-bar h1,h1{font-size:1.82rem;letter-spacing:-.055em;}
.sub{color:#8e8a83;}
/* Cards: less flat, more depth and separation */
.streak-card,.day-card,.study-card,.tracker-card,.reminder-card,.settings-panel,.study-command{
  background:linear-gradient(145deg,rgba(31,34,41,.88),rgba(15,17,22,.90))!important;
  border:1px solid rgba(255,255,255,.075)!important;
  box-shadow:0 18px 48px rgba(0,0,0,.34),inset 0 1px 0 rgba(255,255,255,.045)!important;
}
.streak-card:after,.day-card:after,.study-card:after,.tracker-card:after{
  content:"";display:block;position:absolute;pointer-events:none;
}
.progress-track,.food-progress .progress-track{background:rgba(255,255,255,.075)!important;}
.progress-fill{box-shadow:0 0 14px rgba(229,166,62,.20);}
.wellness-field,.study-kpi{background:rgba(255,255,255,.035);border-color:rgba(255,255,255,.075);}
.btn-secondary{background:rgba(255,255,255,.045);border-color:rgba(255,255,255,.08);}
/* Slimmer, more transparent floating dock */
body{padding-bottom:92px;}
.bottom-nav{
  width:min(calc(100% - 42px),430px);
  bottom:calc(11px + env(safe-area-inset-bottom));
  padding:5px;
  border-radius:25px;
  background:linear-gradient(145deg,rgba(30,33,41,.62),rgba(11,13,18,.58));
  border:1px solid rgba(255,255,255,.14);
  box-shadow:0 18px 42px rgba(0,0,0,.48),inset 0 1px 0 rgba(255,255,255,.14),inset 0 -1px 0 rgba(0,0,0,.24);
  backdrop-filter:blur(34px) saturate(170%);-webkit-backdrop-filter:blur(34px) saturate(170%);
}
.bottom-nav:before{background:linear-gradient(115deg,rgba(255,255,255,.12),transparent 30%,rgba(255,255,255,.018) 70%,rgba(255,255,255,.055));}
.bottom-nav:after{
  width:calc((100% - 10px)/var(--nav-count,5) - 8px);height:50px;
  left:calc(5px + ((100% - 10px)/var(--nav-count,5))*var(--nav-index,0) + 4px);
  border-radius:19px;
  background:linear-gradient(145deg,rgba(255,255,255,.15),rgba(255,255,255,.045));
  border:1px solid rgba(255,255,255,.17);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.24),inset 0 -1px 0 rgba(0,0,0,.16),0 6px 18px rgba(0,0,0,.20);
  backdrop-filter:blur(18px) saturate(165%);-webkit-backdrop-filter:blur(18px) saturate(165%);
  transition:left .46s cubic-bezier(.22,1,.36,1),width .25s ease;
}
.nav-btn{height:52px;border-radius:19px;color:rgba(245,241,233,.66);}
.nav-btn svg{width:25px;height:25px;stroke-width:1.75;transition:transform .34s cubic-bezier(.2,1.35,.35,1),filter .25s,stroke-width .2s;}
.nav-btn.active{color:var(--gold-soft);}
.nav-btn.active svg{transform:scale(1.10);stroke-width:2;filter:drop-shadow(0 2px 8px rgba(229,166,62,.34));}
.nav-btn[data-tab="workout"] svg{width:27px;height:27px;}

function mbbsCurriculum(subjectId, phase, labels){
  return labels.map((label,i)=>({id:`${subjectId}-${i+1}`, phase, label}));
}

function isPastDate(iso){ return !!iso && iso < isoDate(new Date()); }
function isoDate(d){
  const y = d.getFullYear();
  const m = (d.getMonth()+1).toString().padStart(2,'0');
  const day = d.getDate().toString().padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function addDays(iso, n){
  const d = new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n); return isoDate(d);
}
function getWeekDates(){
  const today = new Date();
  const dow = (today.getDay()+6)%7;
  const monday = new Date(today);
  monday.setDate(today.getDate()-dow);
  const dates=[];
  for(let i=0;i<7;i++){ const d=new Date(monday); d.setDate(monday.getDate()+i); dates.push(isoDate(d)); }
  return {dates, todayIso: isoDate(today)};
}
function weekdayIndex(iso){
  const d = new Date(iso+'T00:00:00');
  return (d.getDay()+6)%7;
}

/* storage: works both inside Claude artifact preview (window.storage)
   and on a real hosted site like GitHub Pages (localStorage fallback) */
async function storageGet(key){
  try{
    if(window.storage){ const r = await window.storage.get(key, false); return r ? r.value : null; }
  }catch(e){}
  try{ return localStorage.getItem(key); }catch(e){ return null; }
}
async function storageSet(key, value){
  try{
    if(window.storage){ await window.storage.set(key, value, false); return; }
  }catch(e){}
  try{ localStorage.setItem(key, value); }catch(e){}
}

function periodKeyFor(reset, d){
  const date = d || new Date();
  if(reset === 'daily') return isoDate(date);
  if(reset === 'weekly'){
    const dow = (date.getDay()+6)%7; // Monday = 0
    const monday = new Date(date); monday.setDate(date.getDate()-dow);
    return isoDate(monday);
  }
  if(reset === 'monthly') return date.getFullYear()+'-'+String(date.getMonth()+1).padStart(2,'0');
  return 'never';
}
// auto-resets a tracker's progress when its reset period has rolled over since it was last touched
function applyAutoReset(tracker){
  if(tracker.reset === 'never') return tracker;
  const currentKey = periodKeyFor(tracker.reset);
  if(tracker.lastResetKey !== currentKey){
    if(tracker.type === 'counter') tracker.value = 0;
    if(tracker.type === 'checklist') (tracker.items||[]).forEach(i=>{ i.done = false; });
    tracker.lastResetKey = currentKey;
  }
  return tracker;
}
function applyAllAutoResets(){
  let anyReset = false;
  customTrackers.forEach(t=>{
    const before = t.lastResetKey;
    applyAutoReset(t);
    if(t.lastResetKey !== before) anyReset = true;
  });
  if(anyReset) saveCustomTrackers();
}

function dayComplete(iso){
  const e = entries[iso]; if(!e) return false;
  const taskList = getTasksForDow(weekdayIndex(iso));
  const workoutRequired = settings.workoutEnabled !== false && !e.noWorkout;
  const allTasksDone = !workoutRequired || taskList.every(t => e.tasks && e.tasks[t.id]);
  const sleepOk = (e.sleep || 0) >= SLEEP_TARGET;
  const proteinOk = (e.protein || 0) >= settings.proteinTarget;
  return allTasksDone && sleepOk && proteinOk;
}
function computeStreak(todayIso){
  let streak=0; let cursor = todayIso;
  while(dayComplete(cursor)){ streak++; cursor = addDays(cursor, -1); }
  return streak;
}

function beep(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const o = ctx.createOscillator(); const g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = 880; g.gain.value = 0.15;
    o.start(); setTimeout(()=>{o.stop(); ctx.close();}, 400);
  }catch(e){}
  if(navigator.vibrate) navigator.vibrate([200,100,200]);
}

    timerState.interval = setInterval(()=>{
      timerState.remaining--;

function focusNow(){ return Math.max(0, Math.floor((Date.now()-focusState.startedAt)/1000)); }

async function recordFocusSession(){

  if(!Array.isArray(entries[today].focusSessions)) entries[today].focusSessions=[];

}

function startFocusClock(){
  if(focusState.running) return;
  focusState.startedAt=Date.now()-(focusState.elapsed*1000);
  focusState.running=true;
  focusUpdateClock();
  clearInterval(focusState.interval);
  focusState.interval=setInterval(focusUpdateClock,1000);
}
function getFocusWorkoutQueue(){
  const today=isoDate(new Date());
  const e=entries[today]||{};
  if(settings.workoutEnabled===false || e.noWorkout) return [];
  return getTasksForDow(weekdayIndex(today)).filter(t=>!(e.tasks&&e.tasks[t.id])).map(t=>({
    type:'workout', id:t.id, label:t.label, meta:t.sets||'Workout task', taskId:t.id
  }));
}
function getFocusStudyQueue(){
  const today=isoDate(new Date());
  const queue=[];
  subjects.forEach(subj=>{
    const start=Math.max(0,Number(subj.index)||0);
    const curriculum=Array.isArray(subj.curriculum)?subj.curriculum:[];
    const pending=curriculum.slice(start);
    const todays=pending.filter(item=>item&&item.scheduledDate===today&&item.isStudySession&&!item.focusDoneDates?.[today]);
    const generated=pending.some(item=>item&&item.isStudySession);
    const source=todays.length ? todays : (!generated && pending[0] && !pending[0].focusDoneDates?.[today] ? [pending[0]] : []);
    source.forEach(item=>queue.push({
      type:'study', id:item.id, label:item.baseLabel||item.label||'Study topic',
      meta:item.isStudySession ? `Session ${item.sessionNumber||1}/${item.sessionTotal||1} · ${Number(item.sessionMinutes)||0} min` : (item.phase||'Study topic'),
      subjectId:subj.id, curriculumId:item.id
    }));
  });
  return queue;
}
function getFocusQueue(mode){ return mode==='workout' ? getFocusWorkoutQueue() : getFocusStudyQueue(); }
function beginFocus(mode){
  stopFocusClock();
  recordFocusSession();
  focusState={mode,queue:getFocusQueue(mode),current:null,startedAt:Date.now(),elapsed:0,running:false,interval:null,swipeBusy:false,sessionSaved:false};
  focusState.current=focusState.queue.shift()||null;
  startFocusClock();
  render();
}
async function completeFocusItem(item){
  const today=isoDate(new Date());
  if(item.type==='workout'){
    if(!entries[today]) entries[today]={tasks:{}};
    if(!entries[today].tasks) entries[today].tasks={};
    entries[today].tasks[item.taskId]=true;
    await saveEntries();
    patchEntryUI(today);
  }else{
    const subj=getSubject(item.subjectId);
    if(!subj) return;
    const idx=(subj.curriculum||[]).findIndex(x=>x&&x.id===item.curriculumId);
    if(idx<0) return;
    if(!subj.curriculum[idx].focusDoneDates) subj.curriculum[idx].focusDoneDates={};
    subj.curriculum[idx].focusDoneDates[today]=true;
    let advanced=0;
    while((subj.index||0)<subj.curriculum.length){
      const current=subj.curriculum[subj.index];
      if(!current?.focusDoneDates?.[today]) break;
      subj.index=(subj.index||0)+1; advanced++;
    }
    if(!entries[today]) entries[today]={tasks:{}};
    if(!entries[today].study) entries[today].study={};
    if(!entries[today].studyExtra) entries[today].studyExtra={};
    if(!entries[today].study[item.subjectId]) entries[today].study[item.subjectId]=true;
    else entries[today].studyExtra[item.subjectId]=(entries[today].studyExtra[item.subjectId]||0)+1;
    await saveEntries();
    await saveSubjects();
    patchStudyUI(item.subjectId);
  }
}
async function focusFinishCurrent(){
  if(!focusState.current || focusState.swipeBusy) return;
  focusState.swipeBusy=true;
  const item=focusState.current;
  const card=document.getElementById('focusCard');
  if(card) card.classList.add('swipe-right');
  await new Promise(r=>setTimeout(r,160));
  await completeFocusItem(item);
  focusState.current=focusState.queue.shift()||null;
  focusState.swipeBusy=false;
  if(!focusState.current){
    stopFocusClock();
    await recordFocusSession();
    beep();
  }
  refreshFocusOverlay();
}
async function focusSkipCurrent(){
  if(!focusState.current || focusState.swipeBusy) return;
  focusState.swipeBusy=true;
  const card=document.getElementById('focusCard');
  if(card) card.classList.add('swipe-left');
  const item=focusState.current;
  const today=isoDate(new Date());
  if(!entries[today]) entries[today]={tasks:{}};
  if(item.type==='workout'){
    if(!entries[today].focusSkippedWorkoutIds) entries[today].focusSkippedWorkoutIds=[];
    if(!entries[today].focusSkippedWorkoutIds.includes(item.taskId)) entries[today].focusSkippedWorkoutIds.push(item.taskId);
  }else{
    if(!entries[today].focusSkippedStudyIds) entries[today].focusSkippedStudyIds=[];
    const marker={subjectId:item.subjectId,curriculumId:item.curriculumId};
    if(!entries[today].focusSkippedStudyIds.some(x=>x.subjectId===marker.subjectId&&x.curriculumId===marker.curriculumId)) entries[today].focusSkippedStudyIds.push(marker);
  }
  if(!entries[today].focusUntitled) entries[today].focusUntitled=[];
  entries[today].focusUntitled.push({mode:item.type,subjectId:item.subjectId||null,curriculumId:item.curriculumId||null,taskId:item.taskId||null});
  await saveEntries();
  setTimeout(()=>{
    focusState.current=focusState.queue.shift()||null;
    focusState.swipeBusy=false;
    if(!focusState.current){ stopFocusClock(); recordFocusSession(); beep(); }
    refreshFocusOverlay();
  },160);
}
async function closeFocus(){
  stopFocusClock();
  await recordFocusSession();
  focusState={mode:null,queue:[],current:null,startedAt:0,elapsed:0,running:false,interval:null,swipeBusy:false,sessionSaved:false};
  render();
}
function focusCardMeta(item){
  if(!item) return '';
  return `${escapeFocusText(item.meta||'')} · ${focusState.queue.length+1} left after this`;
}
function refreshFocusOverlay(){
  const existing=document.getElementById('focusOverlay');
  if(!existing) return;
  existing.outerHTML=renderFocusOverlay();
  bindFocusControls();
}
function bindFocusControls(){
  document.querySelectorAll('[data-action="focus-complete"]').forEach(el=>{
    el.onclick=()=>focusFinishCurrent();
  });
  document.querySelectorAll('[data-action="focus-skip"]').forEach(el=>{
    el.onclick=()=>focusSkipCurrent();
  });
  document.querySelectorAll('[data-action="close-focus"]').forEach(el=>{
    el.onclick=()=>closeFocus();
  });
  const focusCard=document.getElementById('focusCard');
  if(focusCard){
    let startX=0,startY=0;
    focusCard.onpointerdown=ev=>{ startX=ev.clientX; startY=ev.clientY; };
    focusCard.onpointerup=ev=>{
      if(focusState.swipeBusy) return;
      const dx=ev.clientX-startX, dy=ev.clientY-startY;
      if(Math.abs(dx)<70 || Math.abs(dx)<Math.abs(dy)*1.15) return;
      if(dx>0) focusFinishCurrent(); else focusSkipCurrent();
    };
  }
}

  const dow = weekdayIndex(todayIso);
  const taskList = getTasksForDow(dow);
  const noWorkout = !!e.noWorkout;

  // red MAX-style banner: anything still outstanding today, pulled from every tracker
  let missed = [];
  subjects.forEach(s=>{
    const finished = (s.index||0) >= s.curriculum.length;
    if(finished) return;
    const backlogCount = subjectBacklogCount(s);
    if(backlogCount !== null){
      if(backlogCount > 0) missed.push(`${s.name}: ${backlogCount} overdue topic${backlogCount>1?'s':''}`);
    } else {
      const doneToday = !!(e.study && e.study[s.id]);
      if(!doneToday) missed.push(`${s.name} session`);
    }
  });
  if(settings.workoutEnabled!==false && !noWorkout){
    const left = taskList.filter(t=>!(e.tasks && e.tasks[t.id])).length;
    if(left>0) missed.push(`${left} workout exercise${left>1?'s':''}`);
  }
  const redBanner = missed.length
    ? `<div class="locked-banner" style="background:${COLORS.strength}22;color:var(--strength);border:1px solid ${COLORS.strength}55;">Still open today: ${missed.join(' \u00b7 ')}</div>`
    : `<div class="locked-banner" style="background:${COLORS.cardio}22;color:var(--cardio);border:1px solid ${COLORS.cardio}55;">Everything's checked off for today.</div>`;

  // Workout rows (reuses the same task-toggle action as the Workout tab)
  let workoutRows;
  if(noWorkout){
    workoutRows = `<div class="noworkout-note">Marked as no workout today.</div>`;
  } else {
    const skippedWorkout=new Set(e.focusSkippedWorkoutIds||[]);
    workoutRows = taskList.map(t=>{
      const done = !!(e.tasks && e.tasks[t.id]);
      const skipped=skippedWorkout.has(t.id);
      const label=skipped?'Untitled':t.label;
      return `<div class="task-row">
        <div class="checkbox ${done?'checked':''}" data-action="task" data-date="${todayIso}" data-taskid="${t.id}"></div>
        <div class="task-label ${done?'done':''}" data-action="task" data-date="${todayIso}" data-taskid="${t.id}">${label}</div>
      </div>`;
    }).join('');
  }

  // Study rows (reuses studydone action from the Study tab)
  const skippedStudyCount=Array.isArray(e.focusSkippedStudyIds)?e.focusSkippedStudyIds.length:0;
  const studyRows = subjects.length === 0
    ? `<p class="note" style="margin:4px 0 0;">No subjects set up yet \u2014 add one on the Study tab.</p>`
    : subjects.map((s,i)=>{
        const done = !!(e.study && e.study[s.id]);
        return `<div class="task-row" ${i===subjects.length-1 && !skippedStudyCount?'style="border-bottom:none;"':''}>
          <div class="checkbox ${done?'checked':''}" data-action="studydone" data-subject="${s.id}"></div>
          <div class="task-label ${done?'done':''}" data-action="studydone" data-subject="${s.id}">${s.name} session</div>
        </div>`;
      }).join('') + (skippedStudyCount ? `<div class="task-row" style="border-bottom:none;"><div class="checkbox"></div><div class="task-label">Untitled${skippedStudyCount>1?` × ${skippedStudyCount}`:''}</div></div>` : '');

  const foodTarget = Math.max(1, Number(settings.caloriesTarget)||1);
  const foodUsed = Math.max(0, Number(e.calories)||0);
  const foodPct = Math.min(1, foodUsed / foodTarget);
  const totalStudyTopics = subjects.reduce((n,s)=>n + ((s.curriculum||[]).length || 0), 0);
  const completedStudyTopics = subjects.reduce((n,s)=>n + Math.min((s.index||0), (s.curriculum||[]).length || 0), 0);
  const studyPct = totalStudyTopics ? Math.min(1, completedStudyTopics / totalStudyTopics) : 0;
  const foodR=72, studyR=50;
  const foodC=2*Math.PI*foodR, studyC=2*Math.PI*studyR;
  const foodOffset=foodC-(foodC*foodPct), studyOffset=studyC-(studyC*studyPct);
  const dualRing = `
    <div class="home-dual-ring-wrap">
      <div>
        <div class="home-dual-ring" aria-label="${Math.round(foodUsed)} of ${Math.round(foodTarget)} calories eaten; ${Math.round(studyPct*100)} percent study progress">
          <svg viewBox="0 0 190 190" aria-hidden="true">
            <circle class="home-ring-track" cx="95" cy="95" r="${foodR}"/>
            <circle class="home-ring-fill" cx="95" cy="95" r="${foodR}" stroke-dasharray="${foodC}" stroke-dashoffset="${foodOffset}"/>
            <circle class="home-study-track" cx="95" cy="95" r="${studyR}"/>
            <circle class="home-study-fill" cx="95" cy="95" r="${studyR}" stroke-dasharray="${studyC}" stroke-dashoffset="${studyOffset}"/>
          </svg>
          <div class="home-dual-center">
            <div class="home-ring-number">${Math.round(foodUsed)}</div>
            <div class="home-ring-label">kcal eaten · ${Math.round(Math.max(0,foodTarget-foodUsed))} left</div>
            <div class="home-ring-study">Study ${Math.round(studyPct*100)}%</div>
          </div>
        </div>
        <div class="home-ring-legend">
          <span><i class="home-ring-dot"></i> Food</span>
          <span><i class="home-ring-dot study"></i> Study</span>
        </div>
      </div>
    </div>`;

  let trackerRows;
  if(customTrackers.length === 0){
    trackerRows = `<p class="note" style="margin:4px 0 0;">No custom trackers yet — build one on the + tab.</p>`;
  } else {
    trackerRows = customTrackers.map(t=>{
      if(t.type === 'counter'){
        return `<div class="task-row" style="border-bottom:none;">
          <div class="task-label" style="flex:1;">${t.name}</div>
          <div style="display:flex;align-items:center;gap:10px;">
            <button class="icon-btn" data-action="tracker-counter-minus" data-id="${t.id}">−</button>
            <span class="water-value">${t.value||0}</span>
            <button class="icon-btn" data-action="tracker-counter-plus" data-id="${t.id}">+</button>

        </div>`;

      return `<div class="task-row" style="border-bottom:none;">
        <div class="task-label" style="flex:1;">${t.name}</div>
        <span class="water-sub" style="margin:0;">${openCount} open</span>
      </div>`;
    }).join('');
  }

  const workoutVisible = settings.workoutEnabled !== false && !noWorkout;
  return `
    <div class="streak-card">
      <div><div class="streak-num">${streak}</div><div class="streak-label">day streak &middot; full day complete</div></div>
      <div class="streak-note">${streak===0 ? "Complete your planned tasks, sleep, and food targets to start one." : "Today's planned tracking has landed."}</div>
    </div>

    ${aiUsageWarningBanner()}
    <div class="home-focus-grid">
      <button class="home-focus-box study" data-action="start-focus-study">

function migrateMissionCurriculum(){
  subjects=(subjects||[]).map(subj=>{
    subj.curriculum=(Array.isArray(subj.curriculum)?subj.curriculum:[]).map((item,i)=>{const id=item.id||`${subj.id}-topic-${i+1}`;return {...item,id,baseLabel:item.baseLabel||item.label||'Untitled topic',subtasks:normalizeMissionSubtasks({...item,id})};});
    if(Array.isArray(subj.planTopics)) subj.planTopics=subj.planTopics.map((item,i)=>{const id=item.id||`${subj.id}-topic-${i+1}`;return {...item,id,baseLabel:item.baseLabel||item.label||'Untitled topic',subtasks:normalizeMissionSubtasks({...item,id})};});
    return subj;
  });
}

function getSubject(id){ return subjects.find(s => s.id === id); }

// Real backlog definition: an item only counts as backlog once its scheduled date has
// actually passed while still unreached — never just "not done yet today". Subjects with
// no dated items at all (like undated AI/Quantum) have no concept of backlog by date, so
// callers should fall back to the old "done today" check when this returns null.
function subjectBacklogCount(subj){
  const hasDates = subj.curriculum.some(it => it.scheduledDate);
  if(!hasDates) return null;
  const todayIso = isoDate(new Date());
  return subj.curriculum.filter((it, i) => it.scheduledDate && it.scheduledDate < todayIso && i >= (subj.index||0)).length;
}

async function loadSubjects(){
  const raw = await storageGet('tracker:subjects');
  if(raw){ subjects = JSON.parse(raw); return; }
  // No subjects saved yet. If this looks like an existing v1 install (real prior AI/Quantum
  // progress), migrate that progress in silently. Otherwise leave it empty — that's what
  // triggers the setup wizard for a genuinely new user.
  const hasPriorProgress = Object.values(entries).some(e => e.study && (e.study.ai || e.study.quantum));
  if(hasPriorProgress){
    subjects = [
      {id:'ai', name:'AI', curriculum:[...AI_CURRICULUM], index: (settings.aiIndex || 0)},
      {id:'quantum', name:'Quantum', curriculum:[...QUANTUM_CURRICULUM], index: (settings.quantumIndex || 0)},
    ];
  } else {
    subjects = [];
  }
  await saveSubjects();
}
async function saveSubjects(){ await storageSet('tracker:subjects', JSON.stringify(subjects)); }
async function loadAiSummaryCache(){
  const raw = await storageGet('tracker:aisummary');
  aiSummaryCache = raw ? JSON.parse(raw) : { date: null, text: '', lastRefreshAt: 0 };
}
async function saveAiSummaryCache(){ await storageSet('tracker:aisummary', JSON.stringify(aiSummaryCache)); }

// Throttle, not a timer/poll: called after real user actions. Only actually fires a request
// if at least AI_REFRESH_MIN_GAP_MS has passed since the last one \u2014 no background loop running.
function maybeRefreshAi(){
  const now = Date.now();
  if(now - (aiSummaryCache.lastRefreshAt || 0) < AI_REFRESH_MIN_GAP_MS) return;
  aiSummaryCache.lastRefreshAt = now; // set immediately so rapid-fire actions can't sneak past the gate before the fetch resolves
  saveAiSummaryCache();
  runAiRefresh();
}
async function runAiRefresh(){
  aiMascotBusy = true; render();
  try{
    await trackAiCall();
    const res = await fetch(WORKER_URL + '/summary', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({data: buildTodaySnapshot()}),
    });
    const data = await res.json();
    if(!res.ok || data.error) throw new Error(data.error || 'Summary failed');
    aiSummaryCache.date = isoDate(new Date());
    aiSummaryCache.text = data.summary || '';
    await saveAiSummaryCache();
  } catch(e){
    console.warn('AI summary refresh failed (staying on the last known line):', e.message);
  } finally {
    aiMascotBusy = false; render();
  }
}

function fileToBase64(file){

function macroNumber(value){

}

// Sends one or more photos to the Worker and merges the returned items into one list.

function scanPhoto(mode, onSuccess){
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.multiple = true; // lets a multi-day plan be scanned as several photos in one go
  // no `capture` attribute on purpose — lets the picker offer Camera, Gallery, and Files, not just a forced live camera
  input.addEventListener('change', async ()=>{
    const files = Array.from(input.files || []);
    if(!files.length) return;
    scanBusy = true; render();
    try{
      let allItems = [];
      for(const file of files){
        const base64 = await fileToBase64(file);
        await trackAiCall();
        const res = await fetch(WORKER_URL + '/analyze', {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({mode, image: base64, mimeType: file.type}),
        });
        const data = await res.json();
        if(!res.ok || data.error){
          const rawSnippet = data.raw ? data.raw.slice(0, 2000) : '(no raw output returned)';
          console.warn('Scan failed for', file.name, data.raw || data.error);
          throw new Error(`${data.error || 'Scan failed'}${files.length>1 ? ` (on photo: ${file.name})` : ''}\n\n--- What the model actually said ---\n${rawSnippet}`);
        }
        allItems = allItems.concat(data.items || []);
      }
      onSuccess(allItems);
    } catch(e){
      alert('Could not read that photo:\n\n' + e.message);
    } finally {
      scanBusy = false; render();
    }
  });
  input.click();
}

// Network calls used by planning/scanning must never leave the student stuck on a loading screen.
// fetch() can remain pending when a remote service is slow or unreachable, so give AI calls a hard
// upper bound and let the local planner take over. AbortController is the browser-native way to
// cancel a pending fetch request. See MDN Fetch/AbortController guidance.
async function fetchJsonWithTimeout(url, options={}, timeoutMs=15000){
  const controller = new AbortController();
  const timer = setTimeout(()=>controller.abort(), Math.max(1000, Number(timeoutMs)||15000));
  try{
    const response = await fetch(url, {...options, signal:controller.signal});
    let data = null;
    try { data = await response.json(); }
    catch { throw new Error(`Invalid response from AI service (HTTP ${response.status})`); }
    return {response, data};
  }catch(err){
    if(err?.name === 'AbortError') throw new Error('AI request timed out');
    throw err;
  }finally{
    clearTimeout(timer);
  }
}

function normalizeTopicLabel(s){
  return (s||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
}
function isDuplicateTopicLabel(label, existingNormLabels){
  const norm = normalizeTopicLabel(label);
  if(!norm) return false;
  const words = new Set(norm.split(' ').filter(Boolean));
  return existingNormLabels.some(ex=>{
    if(ex === norm) return true;
    // word-overlap similarity, not substring containment \u2014 containment wrongly flagged
    // "Waves" as a duplicate of "Standing waves" just because one contains the other.
    // Requiring most of the WORDS to actually match avoids that false positive while still
    // catching real near-duplicates like "Superposition of waves" vs "Waves: superposition".
    const exWords = new Set(ex.split(' ').filter(Boolean));
    if(words.size===0 || exWords.size===0) return false;
    let shared = 0;
    words.forEach(w=>{ if(exWords.has(w)) shared++; });
    const union = new Set([...words, ...exWords]).size;
    return (shared/union) >= 0.8;
  });
}
// Shared entry point for adding new topics from ANY source (photo scan, pasted syllabus text,
// scanning the same list twice by accident, two photos that each cover overlapping/partial
// content of one real list). Dedupes against what's already there AND within the new batch
// itself, then re-sorts only the still-pending portion by difficulty \u2014 completed topics
// never get reshuffled.
function addTopicsToSubject(subj, rawItems, preserveInputOrder=false){
  const existingNorm = subj.curriculum.map(t=>normalizeTopicLabel(t.label));
  const newOnes = [];
  let skipped = 0;
  rawItems.forEach(it=>{
    const label = (it.label || 'Untitled topic').trim();
    if(/^topics\s*:??$/i.test(label)) return;
    const seenSoFar = existingNorm.concat(newOnes.map(n=>normalizeTopicLabel(n.label)));
    if(isDuplicateTopicLabel(label, seenSoFar)){ skipped++; return; }
    newOnes.push({ id: makeTopicId(), phase: it.phase || '', label, difficulty: it.difficulty || null, order: 0 });
  });
  subj.curriculum = subj.curriculum.concat(newOnes);
  const doneCount = subj.index || 0;
  const done = subj.curriculum.slice(0, doneCount);
  const pendingSource = subj.curriculum.slice(doneCount);
  const pending = preserveInputOrder ? pendingSource : smartOrderCurriculum(pendingSource);
  pending.forEach((item,i)=>{ item.order = doneCount + i; });
  subj.curriculum = done.concat(pending);
  return { added: newOnes.length, skipped };
}

function normalizeCurriculumData(){
  let changed = false;
  subjects.forEach(subj=>{
    (subj.curriculum||[]).forEach((item,i)=>{

      if(item.difficulty == null){ item.difficulty = null; changed = true; }
      if(item.order == null){ item.order = i; changed = true; }
    });
  });
  return changed;
}

function noteKeyFor(subjectId, item, idx){

  const legacy = `${subjectId}-${idx}`;

  if(studyNotes[legacy] && studyNotes[next] == null){
    studyNotes[next] = studyNotes[legacy];
    delete studyNotes[legacy];
    saveStudyNotesDebounced();
  }
  return next;
}

function topicNeedScore(item, idx){
  const t = ((item.phase||'')+' '+(item.label||'')).toLowerCase();
  let score = idx * 0.02;
  const basics = ['basic','introduction','unit','measurement','sets','definition','notation','fundamental','mole concept','atomic models','cell theory','vectors','functions','algebra'];
  const advanced = ['application','derivation','advanced','integration','differential','eigen','gradient','mechanism','equilibrium','reaction','organic','rotation','electromagnetic','quantum','transformer','transistor','neural','transformer'];
  basics.forEach(k=>{ if(t.includes(k)) score -= 5; });
  advanced.forEach(k=>{ if(t.includes(k)) score += 1.5; });
  if(item.difficulty === 'hard') score -= 2.0; // harder topics move earlier so foundations can be reinforced sooner
  if(item.difficulty === 'easy') score += 0.8;
  return score;
}

function smartOrderCurriculum(curriculum){
  return curriculum
    .map((item,i)=>({item, i, score:topicNeedScore(item,i)}))
    .sort((a,b)=>a.score-b.score)
    .map(x=>x.item);
}

function deterministicTopicEstimate(item){
  const text = `${item?.phase||''} ${item?.label||item?.baseLabel||''}`.trim().toLowerCase();
  const difficulty = String(item?.difficulty||'').toLowerCase();

  // This is a safety-net estimate for curricula that do not carry hour metadata.
  // It deliberately varies by topic instead of collapsing every topic to 60 min.
  let minutes = difficulty === 'hard' ? 180 : difficulty === 'easy' ? 60 : 120;

  const small = ['introduction','overview','terminology','definitions','basics','basic anatomy','general anatomy','units','measurement','classification','summary','revision'];
  const large = ['system','physiology','pathology','pharmacology','biochemistry','mechanism','metabolism','regulation','development','embryology','neuro','cardio','respiratory','renal','gastro','endocrine','reproductive','immunology','genetics','microbiology','infection','clinical','diagnosis','management','electromagnetic','quantum','organic chemistry'];
  const veryLarge = ['integrated','comprehensive','complete','major','complex'];

  if(small.some(k=>text.includes(k))) minutes -= 45;
  if(large.some(k=>text.includes(k))) minutes += 30;
  if(veryLarge.some(k=>text.includes(k))) minutes += 45;
  if(text.length > 80) minutes += 30;
  else if(text.length < 28) minutes -= 15;

  return Math.max(30, Math.min(360, Math.round(minutes / 15) * 15));
}

function normalizeMissionSubtasks(item){
  const raw=Array.isArray(item?.subtasks)?item.subtasks:[];
  return raw.map((st,i)=>({id:String(st?.id||`${item?.id||'mission'}-task-${i+1}`),title:String(st?.title||st?.label||`Task ${i+1}`),type:String(st?.type||'LEARN'),minutes:Math.max(0,Number(st?.minutes??st?.estimatedMinutes)||0),completed:!!st?.completed}));
}
function missionMinutes(item){
  return normalizeMissionSubtasks(item).reduce((n,st)=>n+st.minutes,0);
}

function estimateTopicMinutes(item){
  const explicitEstimated = Number(item?.estimatedMinutes);
  if(Number.isFinite(explicitEstimated) && explicitEstimated > 0) return Math.max(15, Math.round(explicitEstimated));
  const missionTotal=missionMinutes(item);
  if(missionTotal>0) return Math.max(15, Math.round(missionTotal));
  const learning = Number(item?.learningMinutes) || (Number(item?.learningHours) || 0) * 60;
  const practice = Number(item?.practiceMinutes) || (Number(item?.practiceHours) || 0) * 60;
  const total = learning + practice;
  return Math.max(30, Math.round(total || deterministicTopicEstimate(item)));
}

// Keep template planning on the same topic-estimation engine. This alias is used by
// both the setup wizard and the Study-tab planner so a missing estimator can never
// leave the planner stuck in its busy state.
function estimateTemplateMinutes(item){
  return estimateTopicMinutes(item);
}

function getStudyPlanBaseTopics(subj){
  const curriculum = Array.isArray(subj?.curriculum) ? subj.curriculum : [];
  const completedSessions = curriculum.slice(0, Math.max(0, Number(subj?.index)||0)).filter(x=>x?.isStudySession);
  const hasGeneratedPlan = curriculum.some(x=>x?.isStudySession);
  const source = Array.isArray(subj?.planTopics) && subj.planTopics.length
    ? subj.planTopics
    : (hasGeneratedPlan ? curriculum.filter(x=>!x?.isStudySession) : curriculum.slice(Math.max(0, Number(subj?.index)||0)));

  // A generated plan replaces the visible topic list with sessions. Keep a clean
  // topic-level model underneath so re-planning never duplicates old sessions.
  const unique = new Map();
  source.forEach((item, i)=>{
    const id = item.id || `${subj?.id||'subject'}-topic-${i+1}`;
    if(!unique.has(id)) unique.set(id, {...item, id, baseLabel:item.baseLabel||item.label, subtasks:normalizeMissionSubtasks({...item,id})});
  });

  const completedByTopic = new Map();
  completedSessions.forEach(session=>{
    const topicId = session.parentTopicId || session.originalTopicId || session.id;
    const minutes = Math.max(0, Number(session.sessionMinutes)||0);
    completedByTopic.set(topicId, (completedByTopic.get(topicId)||0) + minutes);
  });

  let topicList = Array.from(unique.values());
  if(Array.isArray(subj?.planTopicsOrder) && subj.planTopicsOrder.length){
    const rank = new Map(subj.planTopicsOrder.map((id,i)=>[id,i]));
    topicList.sort((a,b)=>(rank.get(a.id)??999999)-(rank.get(b.id)??999999));
  }
  return topicList.map(item=>{
    const total = Number(subj?.manualTopicMinutes?.[item.id]) || Number(item?.estimatedMinutes) || estimateTemplateMinutes(item);
    const completed = Math.min(total, completedByTopic.get(item.id)||0);
    return {
      ...item,
      estimatedMinutes: total,
      completedMinutes: completed,
      remainingMinutes: Math.max(0, total-completed)
    };
  }).filter(item=>item.remainingMinutes>0);
}

function buildStudySessions(items, startDate, dailyMinutes, targetDate, useIndividualDueDates=false){
  const result = [];
  const dayBudget = Math.max(15, Number(dailyMinutes)||60);
  const deadline = targetDate || '';
  let day = startDate || isoDate(new Date());
  let used = 0;

  items.forEach((item, topicIndex)=>{
    const totalMinutes = Math.max(15, Number(item.remainingMinutes) || estimateTopicMinutes(item));
    const estimatedTotal = Math.max(totalMinutes, Number(item.estimatedMinutes)||totalMinutes);
    const itemDeadline = useIndividualDueDates ? (item.dueDate || '') : deadline;
    let remaining = totalMinutes;
    let sessionNumber = 1;

    while(remaining > 0.0001){
      if(used >= dayBudget){ day=addDays(day,1); used=0; }
      const sessionMinutes = Math.min(dayBudget-used, remaining);
      const wouldMissDeadline = !!itemDeadline && day > itemDeadline;
      result.push({
        ...item,
        id:`${item.id || makeTopicId()}-s${sessionNumber}-${topicIndex}-${result.length}`,
        parentTopicId:item.id || null,
        originalTopicId:item.id || null,
        sessionNumber,
        sessionTotal:0,
        sessionMinutes,
        learningMinutes:sessionMinutes,
        practiceMinutes:0,
        scheduledDate:day,
        dueDate:itemDeadline || null,
        isStudySession:true,
        isOverDeadline:wouldMissDeadline,
        estimatedMinutes:estimatedTotal,
        baseLabel:item.baseLabel || item.label,
        label:`${item.baseLabel || item.label} — Session ${sessionNumber}`
      });
      used += sessionMinutes;
      remaining -= sessionMinutes;
      sessionNumber++;
    }
  });

  const counts=new Map();
  result.forEach(x=>counts.set(x.parentTopicId,(counts.get(x.parentTopicId)||0)+1));
  const seen=new Map();
  result.forEach(x=>{
    const n=(seen.get(x.parentTopicId)||0)+1;
    seen.set(x.parentTopicId,n);
    x.sessionNumber=n;
    x.sessionTotal=counts.get(x.parentTopicId)||1;
    x.label=`${x.baseLabel} — Session ${n}/${x.sessionTotal}`;
  });
  return result;
}

function localSmartPlan(subj, opts){
  const pending = getStudyPlanBaseTopics(subj);
  const ordered = smartOrderCurriculum(pending);
  const planned = buildStudySessions(
    ordered,
    opts.startDate||isoDate(new Date()),
    opts.minutes,
    opts.targetDate
  );
  const completedSessions = (subj.curriculum||[]).slice(0, Number(subj.index)||0).filter(x=>x?.isStudySession);
  subj.curriculum = completedSessions.concat(planned);
  subj.index = Math.min(Number(subj.index)||0, subj.curriculum.length);
  subj.planSource = 'smart-local';
  subj.planUpdatedAt = new Date().toISOString();
  subj.planMeta = summarizeStudyPlan(subj, opts);
  return {count:planned.length, source:'smart-local', ...subj.planMeta};
}

function buildBundleStudySessions(subjectList, estimates, startDate, dailyMinutes, targetDate){
  const budget = Math.max(15, Number(dailyMinutes)||60);
  const byKey = new Map(estimates.map(x=>[`${x.subjectId}::${x.id}`, x]));
  const queues = subjectList.map(subj => {
    const topics = getStudyPlanBaseTopics(subj).map((item, i)=>{
      const estimate = byKey.get(`${subj.id}::${item.id}`);
      const estimatedMinutes = Math.max(15, Number(estimate?.estimatedMinutes) || Number(item.estimatedMinutes) || estimateTemplateMinutes(item));
      const completedMinutes = Math.min(estimatedMinutes, Math.max(0, Number(item.completedMinutes)||0));
      return {
        item,
        order: Number(estimate?.order ?? i),
        estimatedMinutes,
        remainingMinutes: Math.max(0, estimatedMinutes-completedMinutes)
      };
    }).filter(x=>x.remainingMinutes>0).sort((a,b)=>a.order-b.order);
    return {subj, topics, topicIndex:0, remaining:topics[0]?.remainingMinutes||0, sessionNumber:1};
  });
  const result = subjectList.map(s=>({subjectId:s.id, sessions:[]}));
  const resultMap = new Map(result.map(x=>[x.subjectId,x.sessions]));
  let day = startDate || isoDate(new Date());
  let used = 0;
  let guard = 0;

  while(queues.some(q=>q.topicIndex < q.topics.length) && guard++ < 10000){
    let progressed = false;
    for(const q of queues){
      if(q.topicIndex >= q.topics.length) continue;
      if(used >= budget){ day=addDays(day,1); used=0; }
      const topic=q.topics[q.topicIndex];
      if(!q.remaining) q.remaining=topic.remainingMinutes;
      const sessionMinutes=Math.min(q.remaining,budget-used);
      resultMap.get(q.subj.id).push({
        topicId:topic.item.id,
        sessionNumber:q.sessionNumber,
        sessionMinutes,
        scheduledDate:day,
        estimatedMinutes:topic.estimatedMinutes,
        isOverDeadline:!!targetDate && day>targetDate
      });
      used+=sessionMinutes;
      q.remaining-=sessionMinutes;
      progressed=true;
      if(q.remaining<=0.0001){
        q.topicIndex++;
        q.remaining=q.topics[q.topicIndex]?.remainingMinutes||0;
        q.sessionNumber=1;
      }else q.sessionNumber++;
      if(used>=budget) break;
    }
    if(!progressed) break;
  }

  result.forEach(group=>{
    const counts=new Map();
    group.sessions.forEach(s=>counts.set(s.topicId,(counts.get(s.topicId)||0)+1));
    const seen=new Map();
    group.sessions.forEach(s=>{
      const n=(seen.get(s.topicId)||0)+1;
      seen.set(s.topicId,n);
      s.sessionNumber=n;
      s.sessionTotal=counts.get(s.topicId)||1;
    });
  });
  return result;
}

function summarizeStudyPlan(subj, opts){
  const sessions=(subj?.curriculum||[]).filter(x=>x?.isStudySession);
  const plannedMinutes=sessions.reduce((n,x)=>n+Math.max(0,Number(x.sessionMinutes)||0),0);
  const start=opts?.startDate||isoDate(new Date());
  const deadline=opts?.targetDate||'';
  const finish=sessions.map(x=>x.scheduledDate).filter(Boolean).sort().pop()||start;
  const overflow=sessions.filter(x=>{
    const itemDeadline=opts?.individualDueDates ? (x.dueDate||'') : deadline;
    return itemDeadline && x.scheduledDate>itemDeadline;
  }).reduce((n,x)=>n+Math.max(0,Number(x.sessionMinutes)||0),0);
  const days=deadline && deadline>=start
    ? Math.max(1, Math.floor((new Date(deadline+'T00:00:00')-new Date(start+'T00:00:00'))/86400000)+1)
    : 0;
  const capacity=days ? days*Math.max(15,Number(opts.minutes)||60) : plannedMinutes;
  return {
    goal:opts?.goal||'',
    targetDate:deadline,
    dailyMinutes:Math.max(15,Number(opts?.minutes)||60),
    level:opts?.level||'starting',
    plannedMinutes,
    finishDate:finish,
    capacityMinutes:capacity,
    overflowMinutes:overflow,
    feasible:overflow<=0,
    sessionCount:sessions.length
  };
}

async function aiPlanTemplate(subjectList, opts){
  const pendingBySubject = subjectList.map(subj=>({
    subj,
    pending:getStudyPlanBaseTopics(subj)
  })).filter(x=>x.pending.length);

  if(!pendingBySubject.length){
    return {items:[],source:'local'};
  }

  // Template planning uses the dedicated bundle endpoint so the AI sees the
  // entire curriculum while the app keeps ONE shared daily study budget.
  // The AI estimates workload/order only; deterministic code creates sessions.
  const payload={
    goal:opts.goal||'Complete the curriculum thoroughly',
    targetDate:opts.targetDate||'',
    dailyMinutes:Number(opts.minutes)||60,
    currentLevel:opts.level||'starting',
    keepOrder:!!opts.keepOrder,
    subjects:pendingBySubject.map(({subj,pending})=>({
      id:String(subj.id),
      name:String(subj.name||''),
      curriculum:pending.map((x,i)=>({
        id:String(x.id||i),
        phase:x.phase||'',
        label:x.baseLabel||x.label||'',
        difficulty:x.difficulty||null,
        learningHours:x.learningHours??null,
        practiceHours:x.practiceHours??null
      }))
    }))
  };

  try{
    await trackAiCall();
    const {response:res,data}=await fetchJsonWithTimeout(
      WORKER_URL+'/plan-bundle',
      {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)},
      15000
    );
    if(!res.ok || data?.error || !Array.isArray(data?.items)){
      throw new Error(data?.error||'AI bundle planner unavailable');
    }

    const valid=new Set();
    pendingBySubject.forEach(({subj,pending})=>pending.forEach(item=>valid.add(`${subj.id}::${item.id}`)));

    const estimates=[];
    const seen=new Set();
    data.items.forEach((it,i)=>{
      const subjectId=String(it?.subjectId??'');
      const id=String(it?.id??'');
      const key=`${subjectId}::${id}`;
      if(!valid.has(key) || seen.has(key)) return;
      const original=pendingBySubject.find(x=>String(x.subj.id)===subjectId)?.pending.find(x=>String(x.id)===id);
      if(!original) return;
      const rawMinutes=Number(it?.estimatedMinutes);
      const estimatedMinutes=Number.isFinite(rawMinutes) && rawMinutes >= 15
        ? Math.round(rawMinutes / 15) * 15
        : estimateTemplateMinutes(original);
      estimates.push({
        subjectId,id,estimatedMinutes,
        order:Number.isFinite(Number(it?.order)) ? Number(it.order) : i
      });
      seen.add(key);
    });

    // If the model collapses a curriculum into the same default duration for
    // nearly every topic, do not let that bad estimate define the whole plan.
    // Re-estimate only the suspiciously uniform set; genuinely varied AI output
    // remains untouched.
    const rawValues=estimates.map(x=>x.estimatedMinutes).filter(Number.isFinite);
    const valueCounts=new Map();
    rawValues.forEach(v=>valueCounts.set(v,(valueCounts.get(v)||0)+1));
    const dominantCount=Math.max(0,...valueCounts.values());
    const uniformModel=rawValues.length >= 3 && dominantCount / rawValues.length >= 0.85;
    if(uniformModel){
      estimates.forEach(x=>{
        const original=pendingBySubject.find(y=>String(y.subj.id)===String(x.subjectId))?.pending.find(y=>String(y.id)===String(x.id));
        if(original) x.estimatedMinutes=deterministicTopicEstimate(original);
      });
    }

    // The Worker itself protects against omitted/truncated model items, but keep
    // the client defensive too: every input topic must reach the deterministic splitter.
    let nextOrder=estimates.reduce((m,x)=>Math.max(m,Number(x.order)||0),-1)+1;
    pendingBySubject.forEach(({subj,pending})=>pending.forEach(item=>{
      const key=`${subj.id}::${item.id}`;
      if(seen.has(key)) return;
      estimates.push({
        subjectId:String(subj.id),
        id:String(item.id),
        estimatedMinutes:Math.max(15,Number(item.estimatedMinutes)||estimateTemplateMinutes(item)),
        order:nextOrder++
      });
    }));

    if(opts.keepOrder){
      const rank=new Map();
      pendingBySubject.forEach(({subj,pending})=>pending.forEach((item,i)=>rank.set(`${subj.id}::${item.id}`,i)));
      estimates.forEach(x=>{ x.order=rank.get(`${x.subjectId}::${x.id}`)??999999; });
    }
    return {items:estimates,source:'ai'};
  }catch(err){
    console.warn('AI bundle planner failed; using local topic estimates:',err.message);
    const items=[];
    pendingBySubject.forEach(({subj,pending})=>pending.forEach((item,i)=>items.push({
      subjectId:String(subj.id),
      id:String(item.id),
      estimatedMinutes:Math.max(15,Number(item.estimatedMinutes)||estimateTemplateMinutes(item)),
      order:i
    })));
    return {items,source:'local',error:err.message};
  }
}

async function aiPlanSubject(subj, opts){
  const pending = getStudyPlanBaseTopics(subj);
  const completedSessions=(subj.curriculum||[]).slice(0,Number(subj.index)||0).filter(x=>x?.isStudySession);
  const payload = {
    subject: subj.name,
    goal: opts.goal || `Learn ${subj.name}`,
    targetDate: opts.targetDate || '',
    dailyMinutes: Number(opts.minutes)||60,
    currentLevel: opts.level || 'starting',
    completedCount: completedSessions.length,
    curriculum: pending.map((x,i)=>({
      id:x.id||String(i), phase:x.phase||'', label:x.baseLabel||x.label||'', difficulty:x.difficulty||null,
      remainingMinutes:x.remainingMinutes||estimateTemplateMinutes(x)
    }))
  };
  try{
    await trackAiCall();
    const {response:res,data}=await fetchJsonWithTimeout(WORKER_URL+'/plan',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)},15000);
    if(!res.ok || data.error || !Array.isArray(data.items)) throw new Error(data.error||'AI planner unavailable');

    const byId=new Map(pending.map(x=>[x.id,x]));
    const estimates=[];
    data.items.forEach((it,i)=>{
      const original=byId.get(it.id);
      if(!original) return;
      const total=Math.max(15,Number(it.estimatedMinutes)||original.remainingMinutes||estimateTemplateMinutes(original));
      estimates.push({subjectId:subj.id,id:original.id,estimatedMinutes:total,order:i});
    });
    pending.forEach((item,i)=>{
      if(!estimates.some(x=>x.id===item.id)) estimates.push({subjectId:subj.id,id:item.id,estimatedMinutes:item.remainingMinutes||estimateTemplateMinutes(item),order:data.items.length+i});
    });

    const sessions=buildStudySessions(
      estimates.map(x=>({...byId.get(x.id),...x,remainingMinutes:Math.max(0,Number(byId.get(x.id)?.remainingMinutes)||0)})),
      opts.startDate||isoDate(new Date()),
      opts.minutes,
      opts.targetDate
    );
    subj.planTopics=pending.map(({completedMinutes,remainingMinutes,...topic})=>({...topic}));
    subj.curriculum=completedSessions.concat(sessions);
    subj.index=Math.min(Number(subj.index)||0,subj.curriculum.length);
    subj.planSource='ai';
    subj.planUpdatedAt=new Date().toISOString();
    subj.planMeta=summarizeStudyPlan(subj,opts);
    return {count:sessions.length,source:'ai',...subj.planMeta};
  }catch(err){
    console.warn('AI planner failed; using local session planner:',err.message);
    return localSmartPlan(subj,opts);
  }
}

function applyBundlePlan(subjectList, estimates, opts){
  const sessionGroups=buildBundleStudySessions(subjectList,estimates,opts.startDate||isoDate(new Date()),opts.minutes,opts.targetDate);
  const groupMap=new Map(sessionGroups.map(x=>[x.subjectId,x.sessions]));
  subjectList.forEach(subj=>{
    const pending=getStudyPlanBaseTopics(subj);
    const completedSessions=(subj.curriculum||[]).slice(0,Number(subj.index)||0).filter(x=>x?.isStudySession);
    const estimateMap=new Map(estimates.filter(x=>x.subjectId===subj.id).map(x=>[x.id,x]));
    const sessions=groupMap.get(subj.id)||[];
    const byTopic=new Map();
    sessions.forEach(s=>{ if(!byTopic.has(s.topicId)) byTopic.set(s.topicId,[]); byTopic.get(s.topicId).push(s); });
    const ordered=opts.keepOrder ? pending.slice() : pending.slice().sort((a,b)=>Number(estimateMap.get(a.id)?.order??999999)-Number(estimateMap.get(b.id)?.order??999999));
    const planned=[];
    ordered.forEach(item=>{
      const topicSessions=byTopic.get(item.id)||[];
      const total=topicSessions.length||1;
      topicSessions.forEach((session,si)=>planned.push({
        ...item,
        id:`${item.id}-s${session.sessionNumber}-${si}`,
        parentTopicId:item.id, originalTopicId:item.id,
        baseLabel:item.baseLabel||item.label,
        label:`${item.baseLabel||item.label} — Session ${session.sessionNumber}/${total}`,
        sessionNumber:session.sessionNumber, sessionTotal:total,
        sessionMinutes:session.sessionMinutes,
        estimatedMinutes:session.estimatedMinutes,
        learningMinutes:session.sessionMinutes, practiceMinutes:0,
        scheduledDate:session.scheduledDate, isStudySession:true,
        isOverDeadline:!!session.isOverDeadline
      }));
    });
    subj.planTopics=pending.map(({completedMinutes,remainingMinutes,...topic})=>({...topic}));
    subj.curriculum=completedSessions.concat(planned);
    subj.index=Math.min(Number(subj.index)||0,subj.curriculum.length);
    subj.planSource=opts.source==='ai'?'ai':'smart-local';
    subj.planUpdatedAt=new Date().toISOString();
    subj.planMeta=summarizeStudyPlan(subj,opts);
  });
  return subjectList.reduce((n,s)=>n+(s.curriculum||[]).length-(s.index||0),0);
}
