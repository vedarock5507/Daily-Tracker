<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15171b">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>Daily Rhythm</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap');
:root{
  --bg:#121418; --surface:#1b1e24; --surface-2:#232730; --text:#f0ede6; --muted:#8b8780;
  --strength:#c05e37; --cardio:#3f8a76; --recovery:#6d7280; --gold:#e0aa4a; --line: rgba(240,237,230,0.08);
}
*{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
body{margin:0;background:var(--bg);color:var(--text);font-family:'IBM Plex Sans', sans-serif;padding:22px 16px 60px;min-height:100vh;overscroll-behavior-y:contain;}
.wrap{max-width:520px;margin:0 auto;}
h1{font-family:'Space Grotesk', sans-serif;font-weight:700;font-size:1.4rem;letter-spacing:-0.01em;margin:0 0 2px;}
.sub{color:var(--muted);font-size:0.85rem;margin:0 0 20px;}

/* Liquid Glass bottom navigation — premium floating glass capsule */
body{padding-bottom:116px;}
.bottom-nav{
  position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom));
  transform:translateX(-50%);z-index:40;
  width:min(calc(100% - 28px),430px);
  display:grid;grid-template-columns:repeat(var(--nav-count,5),1fr);align-items:center;
  padding:7px;border-radius:30px;
  background:linear-gradient(145deg,rgba(39,42,49,.72),rgba(22,24,29,.68));
  border:1px solid rgba(255,255,255,.13);
  box-shadow:0 22px 50px rgba(0,0,0,.46),inset 0 1px 0 rgba(255,255,255,.15),inset 0 -1px 0 rgba(0,0,0,.3);
  backdrop-filter:blur(30px) saturate(155%);-webkit-backdrop-filter:blur(30px) saturate(155%);
  overflow:hidden;isolation:isolate;
}
.bottom-nav:before{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:0;border-radius:inherit;
  background:linear-gradient(115deg,rgba(255,255,255,.13),transparent 28%,rgba(255,255,255,.025) 68%,rgba(255,255,255,.08));
}
.bottom-nav:after{
  content:"";position:absolute;z-index:0;pointer-events:none;
  width:76px;height:66px;
  left:calc(7px + ((100% - 14px) / var(--nav-count,5)) * var(--nav-index,0) + (((100% - 14px) / var(--nav-count,5) - 76px) / 2));
  top:50%;transform:translateY(-50%);border-radius:23px;
  background:linear-gradient(145deg,rgba(255,255,255,.20),rgba(255,255,255,.055));
  border:1px solid rgba(255,255,255,.20);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.29),inset 0 -1px 0 rgba(0,0,0,.18),0 8px 22px rgba(0,0,0,.22);
  backdrop-filter:blur(17px) saturate(160%);-webkit-backdrop-filter:blur(17px) saturate(160%);
  transition:left .46s cubic-bezier(.22,1,.36,1),transform .18s ease;
}
.nav-btn{position:relative;z-index:1;background:transparent!important;border:0;color:rgba(240,237,230,.72);
  cursor:pointer;width:100%;height:66px;border-radius:23px;display:flex;align-items:center;justify-content:center;
  transition:color .28s ease,transform .18s cubic-bezier(.2,.8,.2,1);font-family:inherit;
}
.nav-btn.active{color:var(--gold);}
.nav-btn:active{transform:scale(.90);}
.nav-btn svg{width:28px;height:28px;stroke:currentColor;fill:none;stroke-width:1.85;stroke-linecap:round;stroke-linejoin:round;transition:transform .32s cubic-bezier(.2,1.4,.4,1),stroke-width .2s,filter .25s;}
.nav-btn.active svg{transform:scale(1.08);stroke-width:2.05;filter:drop-shadow(0 3px 8px rgba(224,170,74,.32));}
.nav-btn:not(.active):hover{color:rgba(240,237,230,.94);}
@media (prefers-reduced-motion:reduce){.bottom-nav:after,.nav-btn,.nav-btn svg{transition:none!important;}}

/* top-right settings icon, replacing the old Reminders tab */
.top-bar{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:2px;}
.settings-btn{background:var(--surface);border:1px solid var(--line);color:var(--muted);width:36px;height:36px;
  border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1rem;cursor:pointer;flex-shrink:0;}
.settings-btn:active{transform:scale(0.92);}

.tabpane{display:none;} .tabpane.active{display:block;animation:fadein 0.3s cubic-bezier(0.22,1,0.36,1);}
@keyframes fadein{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
::view-transition-old(root), ::view-transition-new(root){
  animation-duration:0.32s;
  animation-timing-function:cubic-bezier(0.22,1,0.36,1);
}
html[data-swipe-dir="left"]::view-transition-old(root){animation-name:pdSlideOutL;}
html[data-swipe-dir="left"]::view-transition-new(root){animation-name:pdSlideInR;}
html[data-swipe-dir="right"]::view-transition-old(root){animation-name:pdSlideOutR;}
html[data-swipe-dir="right"]::view-transition-new(root){animation-name:pdSlideInL;}
@keyframes pdSlideOutL{to{transform:translateX(-22%);opacity:0;filter:blur(6px);}}
@keyframes pdSlideInR{from{transform:translateX(22%);opacity:0;filter:blur(6px);}to{transform:none;opacity:1;filter:blur(0);}}
@keyframes pdSlideOutR{to{transform:translateX(22%);opacity:0;filter:blur(6px);}}
@keyframes pdSlideInL{from{transform:translateX(-22%);opacity:0;filter:blur(6px);}to{transform:none;opacity:1;filter:blur(0);}}

.rhythm{display:flex;align-items:flex-end;gap:8px;height:80px;margin-bottom:8px;}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end;cursor:pointer;}
.bar{width:100%;border-radius:5px 5px 3px 3px;transition:opacity 0.2s, transform 0.15s;}
.bar-col:active .bar{transform:scaleY(0.94);}
.bar.today{box-shadow:0 0 0 2px var(--gold);animation:pulse 2.2s ease-in-out infinite;}
.bar.selected{box-shadow:0 0 0 2px var(--text);}
@keyframes pulse{0%,100%{filter:brightness(1);}50%{filter:brightness(1.4);}}
.daylabel{font-size:0.64rem;color:var(--muted);}
.daylabel.today{color:var(--gold);font-weight:600;}

.streak-card{background:linear-gradient(145deg, var(--surface), var(--surface-2));border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;margin:16px 0 18px;animation:fadein 0.4s cubic-bezier(0.22,1,0.36,1);}
.streak-num{font-family:'Space Grotesk';font-size:1.7rem;font-weight:700;color:var(--gold);line-height:1;}
.streak-label{font-size:0.7rem;color:var(--muted);margin-top:2px;}
.streak-note{font-size:0.74rem;color:var(--muted);max-width:170px;text-align:right;}

/* swipe deck */
.swipe-hint{text-align:center;font-size:0.68rem;color:var(--muted);margin-bottom:10px;}
.swipe-viewport{overflow:hidden;position:relative;border-radius:16px;touch-action:pan-y;}
.swipe-track{display:flex;transition:transform 0.28s cubic-bezier(.2,.8,.2,1);}
.dots{display:flex;justify-content:center;gap:6px;margin-top:14px;}
.dot-nav{width:6px;height:6px;border-radius:50%;background:var(--line);transition:all 0.2s;}
.dot-nav.active{background:var(--gold);width:16px;border-radius:4px;}

/* mascot */
.mascot-row{display:flex;align-items:center;gap:12px;margin:2px 0 18px;}
.mascot-face{width:52px;height:52px;flex-shrink:0;}
.pixel-buddy{image-rendering:pixelated;}
.pbuddy-eye{transform-origin:center;transform-box:fill-box;animation:pbuddyEyes 9s ease-in-out infinite;}
.pbuddy-eye-r{animation-name:pbuddyEyesR;}
.pbuddy-mouth{transform-origin:center;transform-box:fill-box;animation:pbuddySmirk 9s ease-in-out infinite;}
.pixel-buddy-sleep .pbuddy-z{animation:pbuddyZ 2.2s ease-in-out infinite;}
@keyframes pbuddyEyes{
  0%,55%{transform:scaleY(1) translateX(0);}
  57%{transform:scaleY(0.15) translateX(0);}   /* blink */
  59%,74%{transform:scaleY(1) translateX(0);}
  76%{transform:scaleY(1) translateX(-0.6px);} /* glance left */
  80%{transform:scaleY(1) translateX(0.6px);}  /* glance right */
  84%,100%{transform:scaleY(1) translateX(0);}
}
@keyframes pbuddyEyesR{
  0%,29%{transform:scaleY(1) translateX(0);}
  31%{transform:scaleY(0.15) translateX(0);}   /* blink, offset from left eye so it doesn't look synced */
  33%,44%{transform:scaleY(1) translateX(0);}
  46%{transform:scaleY(0.15) translateX(0);}   /* wink */
  50%,74%{transform:scaleY(1) translateX(0);}
  76%{transform:scaleY(1) translateX(-0.6px);}
  80%{transform:scaleY(1) translateX(0.6px);}
  84%,100%{transform:scaleY(1) translateX(0);}
}
@keyframes pbuddySmirk{
  0%,88%{transform:none;}
  91%{transform:translateX(0.8px) translateY(-0.4px) rotate(-4deg);} /* smirk */
  95%,100%{transform:none;}
}
@keyframes pbuddyZ{
  0%{opacity:0;transform:translateY(0);}
  30%{opacity:1;}
  100%{opacity:0;transform:translateY(-6px);}
}
.mascot-bubble{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 13px;font-size:0.76rem;color:var(--text);flex:1;line-height:1.35;animation:fadein 0.45s cubic-bezier(0.22,1,0.36,1);transition:background 0.2s ease;}
.mascot-bubble b{color:var(--gold);}

/* study tab: subject chips + progress */
.chip-row{display:flex;gap:8px;margin-bottom:16px;}
.chip{flex:1;background:var(--surface);border:1px solid var(--line);color:var(--muted);padding:9px 0;border-radius:10px;font-size:0.78rem;font-weight:600;text-align:center;cursor:pointer;font-family:inherit;transition:transform 0.1s, background 0.15s ease, border-color 0.15s ease, color 0.15s ease;}
.chip:active{transform:scale(0.95);}
.chip.active{background:var(--surface-2);color:var(--gold);border-color:var(--gold);}
.chip.backlog{border-color:var(--strength);}
.chip.backlog::after{content:'\25CF';color:var(--strength);font-size:0.55rem;margin-left:5px;vertical-align:middle;}
.chip.clear::after{content:'\25CF';color:var(--cardio);font-size:0.55rem;margin-left:5px;vertical-align:middle;}
.progress-track{background:var(--surface-2);border-radius:20px;height:8px;overflow:hidden;margin:6px 0 4px;}
.progress-fill{height:100%;background:var(--gold);border-radius:20px;transition:width 0.3s ease;}
.progress-label{font-size:0.68rem;color:var(--muted);display:flex;justify-content:space-between;margin-bottom:16px;}
.study-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:17px;margin-bottom:14px;}
.study-phase-tag{font-size:0.62rem;text-transform:uppercase;letter-spacing:0.07em;color:var(--gold);font-weight:700;margin-bottom:6px;}
.study-title{font-family:'Space Grotesk';font-weight:700;font-size:1rem;margin-bottom:14px;line-height:1.3;}
.study-title.finished{color:var(--muted);font-family:inherit;font-weight:400;font-size:0.85rem;}
.study-actions-row{display:flex;gap:8px;margin-bottom:14px;}
.notes-wrap{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);}
.notes-label{font-size:0.68rem;text-transform:uppercase;letter-spacing:0.07em;color:var(--muted);margin-bottom:8px;}
.notes-textarea{width:100%;min-height:90px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;color:var(--text);font-family:'IBM Plex Sans';font-size:0.82rem;line-height:1.5;resize:vertical;outline:none;}
.notes-textarea:focus{border-color:var(--gold);}
.study-done-row{display:flex;align-items:center;gap:10px;}
.study-done-row .task-label{font-size:0.82rem;}
.upnext{font-size:0.72rem;color:var(--muted);margin-top:4px;}
.upnext-item{padding:5px 0;border-top:1px solid var(--line);}

.section-label{font-size:0.7rem;text-transform:uppercase;letter-spacing:0.08em;color:var(--muted);margin:0 0 10px;}
.day-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 17px;flex-shrink:0;width:100%;box-shadow:0 4px 20px rgba(0,0,0,0.2);}
.day-card.today{border-color:var(--gold);}
.day-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.day-name{font-weight:700;font-size:1rem;font-family:'Space Grotesk';}
.type-tag{font-size:0.63rem;padding:3px 9px;border-radius:20px;font-weight:600;}

.task-row{display:flex;align-items:center;gap:8px;padding:9px 2px;border-bottom:1px solid var(--line);}
.task-row:last-of-type{border-bottom:none;}
.checkbox{width:19px;height:19px;border-radius:6px;border:1.5px solid var(--muted);flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform 0.1s, background 0.15s ease, border-color 0.15s ease;}
.checkbox:active{transform:scale(0.85);}
.checkbox.checked{background:var(--gold);border-color:var(--gold);}
.checkbox.checked::after{content:'\2713';font-size:11px;color:var(--bg);font-weight:700;}
.task-label{font-size:0.8rem;flex:1;cursor:pointer;}
.task-label .set-info{color:var(--muted);font-size:0.71rem;display:block;}
.task-label.done{color:var(--muted);text-decoration:line-through;}
.task-actions{display:flex;gap:4px;flex-shrink:0;}
.icon-btn{background:var(--surface-2);border:none;color:var(--muted);width:28px;height:28px;border-radius:8px;font-size:0.8rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform 0.1s;}
.icon-btn:active{background:var(--gold);color:var(--bg);transform:scale(0.9);}

.wellness{display:flex;gap:10px;margin-top:14px;}
.wellness-field{flex:1;background:var(--surface-2);border-radius:10px;padding:10px 12px;}
.wellness-field label{display:block;font-size:0.66rem;color:var(--muted);margin-bottom:4px;}
.wellness-field .input-row{display:flex;align-items:baseline;gap:4px;}
.wellness-field input{background:none;border:none;color:var(--text);font-family:'Space Grotesk';font-size:1.15rem;font-weight:700;width:100%;outline:none;}
.wellness-field .unit{font-size:0.68rem;color:var(--muted);}
.wellness-field.hit{outline:1px solid var(--gold);}
.water-controls{display:flex;align-items:center;justify-content:space-between;gap:6px;}
.water-controls .icon-btn{width:26px;height:26px;font-size:0.95rem;flex-shrink:0;}
.water-value{font-family:'Space Grotesk';font-size:1.05rem;font-weight:700;text-align:center;flex:1;}
.water-sub{font-size:0.6rem;color:var(--muted);text-align:center;margin-top:2px;}

.noworkout-row{display:flex;align-items:center;gap:9px;margin:2px 0 12px;cursor:pointer;}
.noworkout-row .task-label{font-size:0.78rem;color:var(--muted);}
.noworkout-note{font-size:0.78rem;color:var(--muted);padding:10px 2px;font-style:italic;}
.locked-content{opacity:0.5;pointer-events:none;user-select:none;}
.locked-banner{font-size:0.7rem;color:var(--muted);background:var(--surface-2);border-radius:8px;padding:7px 10px;margin-bottom:10px;text-align:center;animation:fadein 0.35s cubic-bezier(0.22,1,0.36,1);}
.edit-row{gap:6px;align-items:center;}
.topic-edit-card{background:var(--surface-2);border-radius:12px;padding:10px 12px;margin-bottom:8px;}
.topic-edit-head{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.topic-phase-input{flex:1;font-size:0.72rem;color:var(--muted);background:transparent;border:none;padding:4px 2px;}
.topic-phase-input:focus{background:var(--surface);border-radius:6px;}
.topic-label-input{width:100%;font-size:0.9rem;background:var(--surface);border:1px solid var(--line);}
.edit-input{background:var(--surface-2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:7px 9px;font-family:inherit;font-size:0.8rem;outline:none;}
.edit-input:focus{border-color:var(--gold);}
.edit-label{flex:2;min-width:0;}
.edit-sets{flex:1.2;min-width:0;}


/* v1.4 study command center */
.study-command{background:linear-gradient(145deg,var(--surface),var(--surface-2));border:1px solid var(--line);border-radius:16px;padding:14px;margin:0 0 14px;}
.study-command-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:10px;}
.study-command-title{font-family:'Space Grotesk';font-weight:700;font-size:1rem;}
.study-command-sub{font-size:.7rem;color:var(--muted);margin-top:3px;line-height:1.35;}
.study-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:10px 0;}
.study-kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 8px;text-align:center;}
.study-kpi b{display:block;font-family:'Space Grotesk';font-size:1rem;}
.study-kpi span{display:block;color:var(--muted);font-size:.6rem;margin-top:2px;}
.study-action-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;}
.study-action-grid .btn-primary,.study-action-grid .btn-secondary{width:100%;padding:9px 8px;}
.plan-lane{margin-top:12px;padding-top:10px;border-top:1px solid var(--line);}
.plan-lane-head{display:flex;justify-content:space-between;align-items:center;font-size:.7rem;color:var(--muted);margin-bottom:7px;}
.plan-item{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid var(--line);}
.plan-item:last-child{border-bottom:none;}
.plan-num{width:22px;height:22px;border-radius:50%;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:.65rem;color:var(--gold);font-weight:700;flex:0 0 22px;}
.plan-copy{min-width:0;flex:1;}
.plan-copy b{font-size:.78rem;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.plan-copy span{font-size:.63rem;color:var(--muted);}
.plan-date{font-size:.62rem;color:var(--muted);white-space:nowrap;}
.notebook-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;}
.notebook-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px;}
.notebook-title{font-family:'Space Grotesk';font-weight:700;font-size:.86rem;}
.notebook-meta{font-size:.63rem;color:var(--muted);}
.notebook-note{font-size:.78rem;line-height:1.5;white-space:pre-wrap;color:var(--text);margin-top:7px;}
.notebook-empty{font-size:.75rem;color:var(--muted);padding:14px 0;text-align:center;}
.study-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.76);z-index:70;padding:18px;backdrop-filter:blur(3px);overflow:auto;}
.study-overlay.open{display:block;}
.study-overlay-panel{max-width:520px;margin:16px auto;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;}
.study-overlay-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;}
.study-overlay-head h2{font-family:'Space Grotesk';font-size:1.05rem;margin:0;}
.quick-paste{width:100%;min-height:130px;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:11px;color:var(--text);font-family:inherit;font-size:.8rem;line-height:1.5;resize:vertical;outline:none;}
.quick-paste:focus{border-color:var(--gold);}
.smart-badge{display:inline-flex;align-items:center;gap:5px;background:var(--surface-2);color:var(--gold);border:1px solid var(--line);border-radius:20px;padding:4px 8px;font-size:.59rem;font-weight:700;}
.difficulty-row{display:flex;gap:7px;margin-top:9px;}
.difficulty-row button{flex:1;padding:8px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);color:var(--text);font-size:.68rem;cursor:pointer;}
.difficulty-row button.active{border-color:var(--gold);color:var(--gold);}
.cal-note{margin-top:12px;}
.cal-note textarea{width:100%;min-height:100px;}
.cal-cell.hasnote::after{content:'';position:absolute;width:4px;height:4px;border-radius:50%;background:var(--gold);bottom:5px;}
.cal-cell{position:relative;}

/* calendar */
.cal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.cal-detail-head{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
.cal-detail-date{font-family:'Space Grotesk';font-size:1.05rem;font-weight:700;}
.cal-header button{background:var(--surface);border:1px solid var(--line);color:var(--text);width:32px;height:32px;border-radius:9px;cursor:pointer;font-size:0.9rem;}
.cal-title{font-family:'Space Grotesk';font-weight:700;font-size:1rem;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:20px;}
.cal-dow{text-align:center;font-size:0.62rem;color:var(--muted);padding-bottom:4px;}
.cal-cell{aspect-ratio:1;border-radius:9px;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:0.75rem;cursor:pointer;border:1px solid transparent;color:var(--text);transition:transform 0.1s;}
.cal-cell:active{transform:scale(0.92);}
.cal-cell.empty{background:none;cursor:default;}
.cal-cell.complete{background:rgba(224,170,74,0.18);border-color:var(--gold);color:var(--gold);font-weight:700;}
.cal-cell.selected{border-color:var(--text);}
.cal-cell.istoday{box-shadow:0 0 0 1px var(--gold) inset;}

.reminder-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px;}

function isoDate(d){
  const y = d.getFullYear();
  const m = (d.getMonth()+1).toString().padStart(2,'0');
  const day = d.getDate().toString().padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function addDays(iso, n){
  const d = new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n); return isoDate(d);
}
function getWeekDates(){
  const today = new Date();
  const dow = (today.getDay()+6)%7;
  const monday = new Date(today);
  monday.setDate(today.getDate()-dow);
  const dates=[];
  for(let i=0;i<7;i++){ const d=new Date(monday); d.setDate(monday.getDate()+i); dates.push(isoDate(d)); }
  return {dates, todayIso: isoDate(today)};
}
function weekdayIndex(iso){
  const d = new Date(iso+'T00:00:00');
  return (d.getDay()+6)%7;
}

/* storage: works both inside Claude artifact preview (window.storage)
   and on a real hosted site like GitHub Pages (localStorage fallback) */
async function storageGet(key){
  try{
    if(window.storage){ const r = await window.storage.get(key, false); return r ? r.value : null; }
  }catch(e){}
  try{ return localStorage.getItem(key); }catch(e){ return null; }
}
async function storageSet(key, value){
  try{
    if(window.storage){ await window.storage.set(key, value, false); return; }
  }catch(e){}
  try{ localStorage.setItem(key, value); }catch(e){}
}

function periodKeyFor(reset, d){
  const date = d || new Date();
  if(reset === 'daily') return isoDate(date);
  if(reset === 'weekly'){
    const dow = (date.getDay()+6)%7; // Monday = 0
    const monday = new Date(date); monday.setDate(date.getDate()-dow);
    return isoDate(monday);
  }
  if(reset === 'monthly') return date.getFullYear()+'-'+String(date.getMonth()+1).padStart(2,'0');
  return 'never';
}
// auto-resets a tracker's progress when its reset period has rolled over since it was last touched
function applyAutoReset(tracker){
  if(tracker.reset === 'never') return tracker;
  const currentKey = periodKeyFor(tracker.reset);
  if(tracker.lastResetKey !== currentKey){
    if(tracker.type === 'counter') tracker.value = 0;
    if(tracker.type === 'checklist') (tracker.items||[]).forEach(i=>{ i.done = false; });
    tracker.lastResetKey = currentKey;
  }
  return tracker;
}
function applyAllAutoResets(){
  let anyReset = false;
  customTrackers.forEach(t=>{
    const before = t.lastResetKey;
    applyAutoReset(t);
    if(t.lastResetKey !== before) anyReset = true;
  });
  if(anyReset) saveCustomTrackers();
}

function dayComplete(iso){
  const e = entries[iso]; if(!e) return false;
  const taskList = getTasksForDow(weekdayIndex(iso));
  const allTasksDone = e.noWorkout || taskList.every(t => e.tasks && e.tasks[t.id]);
  const sleepOk = (e.sleep || 0) >= SLEEP_TARGET;
  const proteinOk = (e.protein || 0) >= settings.proteinTarget;
  return allTasksDone && sleepOk && proteinOk;
}
function computeStreak(todayIso){
  let streak=0; let cursor = todayIso;
  while(dayComplete(cursor)){ streak++; cursor = addDays(cursor, -1); }
  return streak;
}

function fmtTime(sec){
  const m = Math.floor(sec/60).toString().padStart(2,'0');
  const s = Math.floor(sec%60).toString().padStart(2,'0');
  return m+':'+s;
}

function beep(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const o = ctx.createOscillator(); const g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = 880; g.gain.value = 0.15;
    o.start(); setTimeout(()=>{o.stop(); ctx.close();}, 400);
  }catch(e){}
  if(navigator.vibrate) navigator.vibrate([200,100,200]);
}
function toggleTimerStart(){
  if(timerState.running){
    clearInterval(timerState.interval); timerState.running = false;
    document.getElementById('timerStart').textContent = 'Resume';
  } else {
    timerState.running = true;
    document.getElementById('timerStart').textContent = 'Pause';
    timerState.interval = setInterval(()=>{
      timerState.remaining--;
      document.getElementById('timerDisplay').textContent = fmtTime(Math.max(0,timerState.remaining));
      if(timerState.remaining<=0){
        clearInterval(timerState.interval); timerState.running = false;
        document.getElementById('timerStart').textContent = 'Start';
        document.getElementById('timerSets').textContent = 'Done \u2014 nice work';
        beep();
      }
    }, 1000);
  }
}
function adjustTimer(delta){
  if(timerState.running) return;
  timerState.remaining = Math.max(0, timerState.remaining + delta);
  timerState.seconds = timerState.remaining;
  document.getElementById('timerDisplay').textContent = fmtTime(timerState.remaining);
}
function resetTimer(){
  clearInterval(timerState.interval); timerState.running = false;
  timerState.remaining = timerState.seconds;
  document.getElementById('timerDisplay').textContent = fmtTime(timerState.remaining);
  document.getElementById('timerStart').textContent = 'Start';
}

function buildTodaySnapshot(){
  const todayIso = isoDate(new Date());
  const e = entries[todayIso] || {tasks:{}};
  const dow = weekdayIndex(todayIso);
  const taskList = getTasksForDow(dow);
  const tasksDone = e.noWorkout ? 'n/a (no workout day)' : taskList.filter(t=>e.tasks && e.tasks[t.id]).length + '/' + taskList.length;
  const studyStatus = {};
  subjects.forEach(s => { studyStatus[s.name] = !!(e.study && e.study[s.id]); });
  return {
    streak: computeStreak(todayIso),
    workout: tasksDone,
    sleep: (e.sleep||0) + 'h',
    protein: (e.protein||0) + 'g (target ' + settings.proteinTarget + 'g)',
    water: (e.water||0) + '/' + settings.waterTargetBottles + ' bottles',
    study: studyStatus,
  };
}

function buildClaudeSummary(){
  const todayIso = isoDate(new Date());
  const e = entries[todayIso] || {};
  const streak = computeStreak(todayIso);
  const workoutOk = dayComplete(todayIso);
  const dow = weekdayIndex(todayIso);
  const taskList = getTasksForDow(dow);
  const tasksDone = taskList.filter(t => e.tasks && e.tasks[t.id]).length;

  const subjectLines = subjects.flatMap(s=>{
    const idx = s.index || 0;
    const doneToday = !!(e.study && e.study[s.id]);
    const current = idx < s.curriculum.length ? s.curriculum[idx].label : 'curriculum complete';
    const pct = s.curriculum.length ? Math.round((idx/s.curriculum.length)*100) : 0;
    return [
      ``,
      `${s.name}: session ${idx} of ${s.curriculum.length} (${pct}%)`,
      `  Current: ${current}${doneToday?' \u2014 marked done today':' \u2014 not done today'}`,
    ];
  });

  return [
    `Daily Rhythm check-in \u2014 ${todayIso}`,
    ``,
    `Workout streak: ${streak} day${streak===1?'':'s'}`,
    `Today's workout: ${e.noWorkout ? 'marked as no-workout day' : tasksDone+'/'+taskList.length+' tasks done'}, sleep ${e.sleep||0}h, protein ${e.protein||0}g, water ${e.water||0}/${settings.waterTargetBottles} bottles${workoutOk?' \u2014 day complete':''}`,
    ...subjectLines,
  ].join('\n');
}

    ? `<rect x="4" y="10" width="2" height="1" fill="var(--buddy-ink)"/><rect x="6" y="11" width="4" height="1" fill="var(--buddy-ink)"/><rect x="10" y="10" width="2" height="1" fill="var(--buddy-ink)"/>`
    : state==='progress'
    ? `<rect x="5" y="10" width="6" height="1" fill="var(--buddy-ink)"/>`
    : `<rect x="4" y="11" width="2" height="1" fill="var(--buddy-ink)"/><rect x="6" y="10" width="4" height="1" fill="var(--buddy-ink)"/><rect x="10" y="11" width="2" height="1" fill="var(--buddy-ink)"/>`;

  return `<svg class="mascot-face pixel-buddy" viewBox="0 0 16 16" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">
    <rect width="16" height="16" rx="3" fill="${faceColor}"/>
    <g class="pbuddy-eye pbuddy-eye-l"><rect x="4" y="6" width="2" height="2" fill="var(--buddy-ink)"/></g>
    <g class="pbuddy-eye pbuddy-eye-r"><rect x="10" y="6" width="2" height="2" fill="var(--buddy-ink)"/></g>
    <g class="pbuddy-mouth">${mouthRects}</g>
  </svg>`;
}

function renderMascot(todayIso){
  const workoutOk = dayComplete(todayIso);
  const e = entries[todayIso] || {};
  const subjectsDoneCount = subjects.filter(s => !!(e.study && e.study[s.id])).length;
  const total = 1 + subjects.length; // workout + each subject
  const count = (workoutOk?1:0) + subjectsDoneCount;
  const state = total>0 && count===total ? 'complete' : count>0 ? 'progress' : 'neutral';
  const names = subjects.length ? subjects.map(s=>s.name).join(', ') : 'your subjects';
  let msg;
  if(total===1) msg = workoutOk ? '<b>Workout done today.</b>' : "<b>Nothing logged yet today.</b> Workout \u2014 pick it up when ready.";
  else if(state==='complete') msg = `<b>Everything landed today.</b> Workout, ${names} \u2014 done.`;
  else if(count>0) msg = `<b>${count} of ${total} today.</b> Keep the rest moving.`;
  else msg = `<b>Nothing logged yet today.</b> Workout, ${names} \u2014 pick one and start.`;

  // once the buddy has an AI-written line for today, it takes over from the deterministic one
  if(aiSummaryCache.date === todayIso && aiSummaryCache.text) msg = aiSummaryCache.text;
  if(aiMascotBusy) msg += ' <span class="water-sub" style="margin:0;">(thinking\u2026)</span>';

  return `<div class="mascot-row"><button class="buddy-btn" data-action="buddy" aria-label="Talk to your buddy">${mascotSVG(state)}</button><div class="mascot-bubble">${msg}</div></div>`;
}

function renderHome(){
  const todayIso = isoDate(new Date());
  const streak = computeStreak(todayIso);
  const e = entries[todayIso] || {tasks:{}};
  const dow = weekdayIndex(todayIso);
  const taskList = getTasksForDow(dow);
  const noWorkout = !!e.noWorkout;

  // red MAX-style banner: anything still outstanding today, pulled from every tracker
  let missed = [];
  subjects.forEach(s=>{
    const finished = (s.index||0) >= s.curriculum.length;
    if(finished) return;
    const backlogCount = subjectBacklogCount(s);
    if(backlogCount !== null){
      if(backlogCount > 0) missed.push(`${s.name}: ${backlogCount} overdue topic${backlogCount>1?'s':''}`);
    } else {
      const doneToday = !!(e.study && e.study[s.id]);

function getSubject(id){ return subjects.find(s => s.id === id); }

// Real backlog definition: an item only counts as backlog once its scheduled date has
// actually passed while still unreached — never just "not done yet today". Subjects with
// no dated items at all (like undated AI/Quantum) have no concept of backlog by date, so
// callers should fall back to the old "done today" check when this returns null.
function subjectBacklogCount(subj){
  const hasDates = subj.curriculum.some(it => it.scheduledDate);
  if(!hasDates) return null;
  const todayIso = isoDate(new Date());
  return subj.curriculum.filter((it, i) => it.scheduledDate && it.scheduledDate < todayIso && i >= (subj.index||0)).length;
}

async function loadSubjects(){
  const raw = await storageGet('tracker:subjects');
  if(raw){ subjects = JSON.parse(raw); return; }
  // No subjects saved yet. If this looks like an existing v1 install (real prior AI/Quantum
  // progress), migrate that progress in silently. Otherwise leave it empty — that's what
  // triggers the setup wizard for a genuinely new user.
  const hasPriorProgress = Object.values(entries).some(e => e.study && (e.study.ai || e.study.quantum));
  if(hasPriorProgress){
    subjects = [
      {id:'ai', name:'AI', curriculum:[...AI_CURRICULUM], index: (settings.aiIndex || 0)},
      {id:'quantum', name:'Quantum', curriculum:[...QUANTUM_CURRICULUM], index: (settings.quantumIndex || 0)},
    ];
  } else {
    subjects = [];
  }
  await saveSubjects();
}
async function saveSubjects(){ await storageSet('tracker:subjects', JSON.stringify(subjects)); }
async function loadAiSummaryCache(){
  const raw = await storageGet('tracker:aisummary');
  aiSummaryCache = raw ? JSON.parse(raw) : { date: null, text: '', lastRefreshAt: 0 };
}
async function saveAiSummaryCache(){ await storageSet('tracker:aisummary', JSON.stringify(aiSummaryCache)); }

// Throttle, not a timer/poll: called after real user actions. Only actually fires a request
// if at least AI_REFRESH_MIN_GAP_MS has passed since the last one \u2014 no background loop running.
function maybeRefreshAi(){
  const now = Date.now();
  if(now - (aiSummaryCache.lastRefreshAt || 0) < AI_REFRESH_MIN_GAP_MS) return;
  aiSummaryCache.lastRefreshAt = now; // set immediately so rapid-fire actions can't sneak past the gate before the fetch resolves
  saveAiSummaryCache();
  runAiRefresh();
}
async function runAiRefresh(){
  aiMascotBusy = true; render();
  try{
    await trackAiCall();
    const res = await fetch(WORKER_URL + '/summary', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({data: buildTodaySnapshot()}),
    });
    const data = await res.json();
    if(!res.ok || data.error) throw new Error(data.error || 'Summary failed');
    aiSummaryCache.date = isoDate(new Date());
    aiSummaryCache.text = data.summary || '';
    await saveAiSummaryCache();
  } catch(e){
    console.warn('AI summary refresh failed (staying on the last known line):', e.message);
  } finally {
    aiMascotBusy = false; render();
  }
}

// Shared photo-scan flow: opens the camera/file picker, sends the image to the Worker, returns parsed items.
function fileToBase64(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=> resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
function macroNumber(value){
  if(typeof value === 'number' && Number.isFinite(value)) return value;
  if(value === null || value === undefined || value === '') return 0;
  const n = parseFloat(String(value).replace(/,/g,''));
  return Number.isFinite(n) ? n : 0;
}
function normalizeFoodItem(item){
  const x = item || {};
  const macros = x.macros || x.nutrition || {};
  return {
    ...x,
    name: String(x.name || x.food || x.item || 'Scanned food').trim(),
    calories: macroNumber(x.calories ?? x.kcal ?? x.energy ?? macros.calories ?? macros.kcal),
    protein: macroNumber(x.protein ?? x.protein_g ?? x.proteinGrams ?? macros.protein ?? macros.protein_g),
    carbs: macroNumber(x.carbs ?? x.carbohydrates ?? x.carbs_g ?? x.carbohydrate_g ?? x.carbohydrates_g ?? macros.carbs ?? macros.carbohydrates ?? macros.carbs_g ?? macros.carbohydrates_g),
    fat: macroNumber(x.fat ?? x.fats ?? x.fat_g ?? x.fats_g ?? x.total_fat ?? macros.fat ?? macros.fats ?? macros.fat_g ?? macros.fats_g),
  };
}
function normalizeFoodItems(items){ return (Array.isArray(items) ? items : []).map(normalizeFoodItem); }
function recalcFoodTotals(e){
  const log = e.foodLog || [];
  e.calories = log.reduce((s,i)=> s + macroNumber(i.calories), 0);
  e.protein  = log.reduce((s,i)=> s + macroNumber(i.protein), 0);
  e.carbs    = log.reduce((s,i)=> s + macroNumber(i.carbs), 0);
  e.fat      = log.reduce((s,i)=> s + macroNumber(i.fat), 0);
}
function foodBar(label, used, target, unit){
  const pct = target>0 ? Math.min(100, Math.round((used/target)*100)) : 0;
  return `<div class="food-progress">
    <div class="food-progress-head">
      <span class="food-progress-label">${label}</span>
      <span class="food-progress-value">${Math.round(used)} / ${target}${unit}</span>
    </div>
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%;"></div></div>
  </div>`;
}
function renderFoodLogCard(iso){
  const e = entries[iso] || {};
  const log = e.foodLog || [];
  const bars = foodBar('Calories', e.calories||0, settings.caloriesTarget, '')

    + foodBar('Carbs', e.carbs||0, settings.carbsTarget, 'g')
    + foodBar('Fat', e.fat||0, settings.fatTarget, 'g');

  const rows = log.length ? `<div class="food-log-list">${log.map(item=>{

    return `<div class="food-log-item">

function fileToDataUrl(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=> resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// Sends one or more photos to the Worker and merges the returned items into one list.
// Each item may carry a `day` field (from a multi-day photo like "[FRIDAY]...") for the caller to route.
function scanPhoto(mode, onSuccess){
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.multiple = true; // lets a multi-day plan be scanned as several photos in one go
  // no `capture` attribute on purpose — lets the picker offer Camera, Gallery, and Files, not just a forced live camera
  input.addEventListener('change', async ()=>{
    const files = Array.from(input.files || []);
    if(!files.length) return;
    scanBusy = true; render();
    try{
      let allItems = [];
      for(const file of files){
        const base64 = await fileToBase64(file);
        await trackAiCall();
        const res = await fetch(WORKER_URL + '/analyze', {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({mode, image: base64, mimeType: file.type}),
        });
        const data = await res.json();
        if(!res.ok || data.error){
          const rawSnippet = data.raw ? data.raw.slice(0, 2000) : '(no raw output returned)';
          console.warn('Scan failed for', file.name, data.raw || data.error);
          throw new Error(`${data.error || 'Scan failed'}${files.length>1 ? ` (on photo: ${file.name})` : ''}\n\n--- What the model actually said ---\n${rawSnippet}`);
        }
        allItems = allItems.concat(data.items || []);
      }
      onSuccess(allItems);
    } catch(e){
      alert('Could not read that photo:\n\n' + e.message);
    } finally {
      scanBusy = false; render();
    }
  });
  input.click();
}

function normalizeTopicLabel(s){
  return (s||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
}
function isDuplicateTopicLabel(label, existingNormLabels){
  const norm = normalizeTopicLabel(label);
  if(!norm) return false;
  const words = new Set(norm.split(' ').filter(Boolean));
  return existingNormLabels.some(ex=>{
    if(ex === norm) return true;
    // word-overlap similarity, not substring containment \u2014 containment wrongly flagged
    // "Waves" as a duplicate of "Standing waves" just because one contains the other.
    // Requiring most of the WORDS to actually match avoids that false positive while still
    // catching real near-duplicates like "Superposition of waves" vs "Waves: superposition".
    const exWords = new Set(ex.split(' ').filter(Boolean));
    if(words.size===0 || exWords.size===0) return false;
    let shared = 0;
    words.forEach(w=>{ if(exWords.has(w)) shared++; });
    const union = new Set([...words, ...exWords]).size;
    return (shared/union) >= 0.8;
  });
}
// Shared entry point for adding new topics from ANY source (photo scan, pasted syllabus text,
// scanning the same list twice by accident, two photos that each cover overlapping/partial
// content of one real list). Dedupes against what's already there AND within the new batch
// itself, then re-sorts only the still-pending portion by difficulty \u2014 completed topics
// never get reshuffled.
function addTopicsToSubject(subj, rawItems){
  const existingNorm = subj.curriculum.map(t=>normalizeTopicLabel(t.label));
  const newOnes = [];
  let skipped = 0;
  rawItems.forEach(it=>{
    const label = (it.label || 'Untitled topic').trim();
    const seenSoFar = existingNorm.concat(newOnes.map(n=>normalizeTopicLabel(n.label)));
    if(isDuplicateTopicLabel(label, seenSoFar)){ skipped++; return; }
    newOnes.push({ id: makeTopicId(), phase: it.phase || '', label, difficulty: it.difficulty || null, order: 0 });
  });
  subj.curriculum = subj.curriculum.concat(newOnes);
  const doneCount = subj.index || 0;
  const done = subj.curriculum.slice(0, doneCount);
  const pending = smartOrderCurriculum(subj.curriculum.slice(doneCount));
  pending.forEach((item,i)=>{ item.order = doneCount + i; });
  subj.curriculum = done.concat(pending);
  return { added: newOnes.length, skipped };
}

function normalizeCurriculumData(){
  let changed = false;
  subjects.forEach(subj=>{
    (subj.curriculum||[]).forEach((item,i)=>{
      if(!item.id){ item.id = makeTopicId(); changed = true; }
      if(item.difficulty == null){ item.difficulty = null; changed = true; }
      if(item.order == null){ item.order = i; changed = true; }
    });
  });
  return changed;
}

function noteKeyFor(subjectId, item, idx){
  const stable = item && item.id ? item.id : idx;
  const legacy = `${subjectId}-${idx}`;
  const next = `${subjectId}::${stable}`;
  if(studyNotes[legacy] && studyNotes[next] == null){
    studyNotes[next] = studyNotes[legacy];
    delete studyNotes[legacy];
    saveStudyNotesDebounced();
  }
  return next;
}

function topicNeedScore(item, idx){
  const t = ((item.phase||'')+' '+(item.label||'')).toLowerCase();
  let score = idx * 0.02;
  const basics = ['basic','introduction','unit','measurement','sets','definition','notation','fundamental','mole concept','atomic models','cell theory','vectors','functions','algebra'];
  const advanced = ['application','derivation','advanced','integration','differential','eigen','gradient','mechanism','equilibrium','reaction','organic','rotation','electromagnetic','quantum','transformer','transistor','neural','transformer'];
  basics.forEach(k=>{ if(t.includes(k)) score -= 5; });
  advanced.forEach(k=>{ if(t.includes(k)) score += 1.5; });
  if(item.difficulty === 'hard') score -= 2.0; // harder topics move earlier so foundations can be reinforced sooner
  if(item.difficulty === 'easy') score += 0.8;
  return score;
}

function smartOrderCurriculum(curriculum){
  return curriculum
    .map((item,i)=>({item, i, score:topicNeedScore(item,i)}))
    .sort((a,b)=>a.score-b.score)
    .map(x=>x.item);
}

function distributePlan(items, startDate, dailyMinutes){
  const result = [];
  const mins = Math.max(15, Number(dailyMinutes)||60);
  let day = startDate || isoDate(new Date());
  let used = 0;
  items.forEach((item, i)=>{
    const est = Math.max(20, Number(item.learningMinutes)||30);
    if(used + est > mins && used > 0){ day = addDays(day,1); used = 0; }
    item.learningMinutes = est;
    item.scheduledDate = day;
    used += est;
    result.push(item);
  });
  return result;
}

function localSmartPlan(subj, opts){
  const completed = (subj.curriculum||[]).slice(0, subj.index||0);
  const pending = (subj.curriculum||[]).slice(subj.index||0);
  const ordered = smartOrderCurriculum(pending);
  const planned = distributePlan(ordered, opts.targetDate < isoDate(new Date()) ? isoDate(new Date()) : (opts.startDate||isoDate(new Date())), opts.minutes);
  // Keep completed items untouched; replace pending region with the computed order.
  subj.curriculum = completed.concat(planned);
  subj.index = Math.min(subj.index||0, subj.curriculum.length);
  subj.planSource = 'smart-local';
  subj.planUpdatedAt = new Date().toISOString();
  return {count:planned.length, source:'smart-local'};
}

async function aiPlanSubject(subj, opts){
  const payload = {
    subject: subj.name,
    goal: opts.goal || `Learn ${subj.name}`,
    targetDate: opts.targetDate || '',
    dailyMinutes: Number(opts.minutes)||60,
    currentLevel: opts.level || 'starting',
    completedCount: subj.index||0,
    curriculum: (subj.curriculum||[]).slice(subj.index||0).map((x,i)=>({id:x.id||String(i),phase:x.phase||'',label:x.label||'',difficulty:x.difficulty||null}))
  };
  try{
    await trackAiCall();
    const res = await fetch(WORKER_URL + '/plan', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(payload)
    });
    const data = await res.json();
    if(!res.ok || data.error || !Array.isArray(data.items)) throw new Error(data.error || 'AI planner unavailable');
    const byId = new Map(subj.curriculum.map(x=>[x.id,x]));
    const completed = subj.curriculum.slice(0, subj.index||0);
    const ordered = [];
    data.items.forEach((it, i)=>{
      const original = byId.get(it.id);
      if(!original) return;
      original.learningMinutes = Number(it.learningMinutes)||original.learningMinutes||30;
      original.practiceMinutes = Number(it.practiceMinutes)||original.practiceMinutes||0;
      original.scheduledDate = it.scheduledDate || original.scheduledDate;
      if(it.prerequisiteIds) original.prerequisiteIds = it.prerequisiteIds;
      ordered.push(original);
    });
    const missing = subj.curriculum.slice(subj.index||0).filter(x=>!ordered.includes(x));
    subj.curriculum = completed.concat(ordered.concat(missing));
    subj.planSource = 'ai';
    subj.planUpdatedAt = new Date().toISOString();
    return {count:ordered.length || missing.length, source:'ai'};
  }catch(err){
    console.warn('AI planner failed; using local dependency planner:', err.message);
    return localSmartPlan(subj, opts);
  }
}

function renderStudy(){
  const todayIso = isoDate(new Date());
  const e = entries[todayIso] || {};

  if(subjects.length === 0){
    return `<p class="note" style="text-align:center;padding:20px 10px;">No subjects set up yet.</p>
      <input class="edit-input" style="width:100%;margin-bottom:8px;" type="text" id="newSubjectName" placeholder="Subject name, e.g. Anatomy">
      <button class="btn-primary" style="width:100%;" data-action="subject-create">+ Add subject</button>`;
  }

  if(!studySubject || !getSubject(studySubject)) studySubject = subjects[0].id;

  // backlog coloring: red if today's session for that subject isn't done yet (and curriculum isn't finished), green if clear
  function chipStatus(subj){
    const finished = (subj.index||0) >= subj.curriculum.length;
    if(finished) return '';
    const backlogCount = subjectBacklogCount(subj);
    if(backlogCount !== null) return backlogCount > 0 ? 'backlog' : 'clear';
    const doneToday = !!(e.study && e.study[subj.id]);
    return doneToday ? 'clear' : 'backlog';

  const subject = getSubject(studySubject);
  if(!subject) return '';
  const isEditingSubject = editingSubjectId === studySubject;
  const nextTopic = subject.curriculum?.[subject.index||0];
  const pendingCount = Math.max(0, (subject.curriculum?.length||0) - (subject.index||0));
  const plannedCount = (subject.curriculum||[]).filter(x => x.scheduledDate && !(subject.curriculum.indexOf(x) < (subject.index||0))).length;
  const notesCount = (subject.curriculum||[]).filter((x,i)=>!!(studyNotes[noteKeyFor(subject.id,x,i)||'']?.trim())).length;

  const editToggleRow = isEditingSubject ? `

function renderDayDetail(iso){
  const todayIso = isoDate(new Date());
  const e = entries[iso] || {};
  const dateObj = new Date(iso+'T00:00:00');
  const dateLabel = dateObj.toLocaleDateString('en-US', {weekday:'long', month:'long', day:'numeric'});

  const workoutCard = renderDayCard(iso, iso===todayIso); // reuses the same card, so past-day locking applies automatically

  const subjectRows = subjects.map((s,i)=>{
    const done = !!(e.study && e.study[s.id]);
    const extra = (e.studyExtra && e.studyExtra[s.id]) || 0;
    return `<div class="task-row" ${i===subjects.length-1?'style="border-bottom:none;"':''}>
      <div class="checkbox ${done?'checked':''}"></div>
      <div class="task-label ${done?'done':''}">${s.name} session${extra?` (+${extra} extra)`:''}</div>
    </div>`;
  }).join('');
  const extraStudy = e.extraStudy || [];

  let extraStudyRows = extraStudy.length
    ? extraStudy.map(x=>`<div class="task-row"><div class="checkbox ${x.done?'checked':''}"></div><div class="task-label ${x.done?'done':''}">${x.label}</div></div>`).join('')
    : '<p class="note" style="margin:6px 0 0;">No extra items logged this day.</p>';

  const dailyNote = e.dailyNote || '';
  const studyNotePreview = subjects.map((s)=>{
    const noteCount = (s.curriculum||[]).reduce((n,it,i)=> n + ((studyNotes[noteKeyFor(s.id,it,i)]||'').trim()?1:0), 0);
    return `<div class="task-row"><div class="task-label">${s.name}<span class="set-info">${noteCount} saved note set${noteCount===1?'':'s'}</span></div><button class="btn-secondary" style="padding:6px 9px;" data-action="calendar-open-notes" data-subject="${s.id}">Open</button></div>`;
  }).join('');
  const studyCard = `
    <div class="day-card">
      <div class="day-head"><span class="day-name">Study</span><span class="smart-badge">Notes</span></div>
      ${subjectRows || '<p class="note">No subjects set up.</p>'}
      ${extraStudyRows}
    </div>`;
  const notesCard = `
    <div class="day-card cal-note">
      <div class="day-head"><span class="day-name">Daily note</span><span class="notebook-meta">Saved to ${dateLabel}</span></div>
      <textarea class="notes-textarea" data-action="daily-note" data-date="${iso}" placeholder="What did you learn, finish, miss, or want to remember?">${dailyNote.replace(/</g,'&lt;')}</textarea>
      <div class="day-head" style="margin-top:14px;margin-bottom:6px;"><span class="day-name" style="font-size:.86rem;">Subject notebooks</span></div>
      ${studyNotePreview || '<p class="note">No subjects yet.</p>'}
    </div>`;

  return `
    <div class="cal-detail-head">
      <button class="icon-btn" data-action="calback" title="Back to calendar">\u2190</button>
      <div class="cal-detail-date">${dateLabel}</div>
    </div>
    ${notesCard}
    ${workoutCard}
    ${studyCard}
    <p class="note" style="text-align:center;">Calendar now holds the daily memory too — not just completion dots.</p>`;
}

function renderCalendar(){
  const todayIso = isoDate(new Date());
  if(selectedCalDate) return renderDayDetail(selectedCalDate);

  const year = calMonth.getFullYear(), month = calMonth.getMonth();
  const first = new Date(year, month, 1);
  const startOffset = (first.getDay()+6)%7;
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const monthName = calMonth.toLocaleString('default',{month:'long', year:'numeric'});

  let grid = '<div class="cal-grid">';
  ['Mo','Tu','We','Th','Fr','Sa','Su'].forEach(d=> grid += `<div class="cal-dow">${d}</div>`);
  for(let i=0;i<startOffset;i++) grid += '<div class="cal-cell empty"></div>';
  for(let day=1; day<=daysInMonth; day++){
    const iso = isoDate(new Date(year, month, day));
    const complete = dayComplete(iso);
    const isToday = iso===todayIso;
    const hasNote = !!(entries[iso] && entries[iso].dailyNote && entries[iso].dailyNote.trim());
    grid += `<div class="cal-cell ${complete?'complete':''} ${isToday?'istoday':''} ${hasNote?'hasnote':''}" data-action="calday" data-date="${iso}">${day}</div>`;
  }
  grid += '</div>';

  const header = `<div class="cal-header">
    <button data-action="calprev">\u2039</button>
    <div class="cal-title">${monthName}</div>
    <button data-action="calnext">\u203A</button>
  </div>`;

  return `${header}${grid}<p class="note">Tap a date to view or log that day.</p>`;
}

async function render(){
  const direction = window.__tabSwipeDirection || null;
  window.__tabSwipeDirection = null;
  if(direction) document.documentElement.dataset.swipeDir = direction;
  else delete document.documentElement.dataset.swipeDir; // don't let a stale direction leak into an unrelated render
  if(document.startViewTransition){
    const transition = document.startViewTransition(() => performRender());
    try{ await transition.finished; }catch(e){}
  } else {
    await performRender();
  }
}

function goToDay(delta){
  currentSwipeDate = addDays(currentSwipeDate, delta);
  render();
  transitioning = false;
}

// Lightweight updates for frequent taps. These deliberately mutate only the
// affected controls instead of rebuilding the active tab and losing its state.
function patchEntryUI(date){
  const entry=entries[date]||{tasks:{}};
  document.querySelectorAll(`[data-action="task"][data-date="${date}"]`).forEach(el=>{
    const done=!!(entry.tasks&&entry.tasks[el.dataset.taskid]);
    const box=el.classList.contains('checkbox')?el:el.querySelector('.checkbox');
    const label=el.classList.contains('task-label')?el:el.querySelector('.task-label');
    if(box) box.classList.toggle('checked',done);
    if(label) label.classList.toggle('done',done);
  });
  document.querySelectorAll(`[data-action="water-plus"][data-date="${date}"],[data-action="water-minus"][data-date="${date}"]`).forEach(el=>{
    const root=el.closest('.wellness')||el.parentElement;
    const value=root&&root.querySelector('.water-value');
    if(value) value.textContent=entry.water||0;
  });
  refreshBuddy();
}
function patchStudyUI(subjectId){
  const done=!!(entries[isoDate(new Date())]?.study?.[subjectId]);
  document.querySelectorAll(`[data-action="studydone"][data-subject="${subjectId}"]`).forEach(el=>{
    const box=el.classList.contains('checkbox')?el:el.querySelector('.checkbox');
    const label=el.classList.contains('task-label')?el:el.querySelector('.task-label');
    if(box) box.classList.toggle('checked',done);
    if(label) label.classList.toggle('done',done);
  });
  refreshBuddy();
}
function buildBuddyStatusLine(){
  const todayIso = isoDate(new Date());
  const e = entries[todayIso] || {};
  const dow = weekdayIndex(todayIso);
  const taskList = getTasksForDow(dow);
  const workoutLeft = (!e.noWorkout && settings.workoutEnabled!==false) ? taskList.filter(t=>!(e.tasks && e.tasks[t.id])).length : 0;
  const subjectsLeft = subjects.filter(s=>{
    const finished = (s.index||0) >= s.curriculum.length;
    return !finished && !(e.study && e.study[s.id]);
  }).map(s=>s.name);
  const openItems = [];
  if(workoutLeft>0) openItems.push(`${workoutLeft} workout exercise${workoutLeft>1?'s':''}`);
  if(subjectsLeft.length) openItems.push(subjectsLeft.join(', '));
  return openItems.length===0 ? 'Everything on your list is done for today. Nice.' : `Still open: ${openItems.join(' \u00b7 ')}.`;
}
function refreshBuddy(){

  const studiesDone=Object.values(e.study||{}).filter(Boolean).length;
  const actions=tasksDone+studiesDone+(e.water||0)+(e.sleep?1:0)+(e.protein?1:0);
  const state=dayComplete(todayIso)?'complete':actions>0?'progress':'neutral';
  const button=document.querySelector('.buddy-btn');
  if(button) button.innerHTML=mascotSVG(state);
  const bubble=document.querySelector('.mascot-bubble');
  const recentlyNudged = (Date.now() - buddyNudgedAt) < 20000; // give a tapped message ~20s before auto-refresh can overwrite it
  if(bubble && actions>0 && !recentlyNudged){
    bubble.textContent = buildBuddyStatusLine(); // PA-style status, not generic praise
    bubble.animate([{transform:'scale(.97)'},{transform:'scale(1.03)'},{transform:'scale(1)'}],{duration:420,easing:'cubic-bezier(.16,1,.3,1)'});
  }
}

  document.querySelectorAll('[data-action="scan-workout"]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const currentDow = parseInt(el.dataset.dow);
      scanPhoto('workout', async (items)=>{
        if(!items.length){ alert('No exercises found in that photo.'); return; }

        // Diagnostic: show exactly what day the model detected per exercise, since this
        // is the second time day-splitting hasn't worked and I can't run the model myself
        // to see what it's actually returning. This makes the real cause visible on your end.
        const debugLines = items.map(it => `${it.label || '?'} \u2192 day: "${it.day || '(empty)'}"`).join('\n');
        console.log('Workout scan raw items:', items);
        if(!confirm(`Detected days (tap OK to apply, Cancel to abort):\n\n${debugLines}`)) return;

        // group items by weekday name if the model found one (e.g. "[FRIDAY]" headers);
        // anything with no day found falls back onto whichever day you were editing
        const byDow = {};
        items.forEach(it=>{
          const dayName = (it.day || '').trim().toLowerCase();
          // "contains" match, not exact-equal — the model may return "Friday - Full-Body Strength"
          // instead of a bare "friday", and exact match was silently failing on that, dumping
          // everything onto the currently-edited day instead of actually splitting by day.
          const matchIdx = DAY_META.findIndex(d => dayName.includes(d.name.toLowerCase()));
          const targetDow = matchIdx !== -1 ? matchIdx : currentDow;
          if(!byDow[targetDow]) byDow[targetDow] = [];
          byDow[targetDow].push(it);
        });

        Object.keys(byDow).forEach(dowKey=>{
          const dow = parseInt(dowKey);
          taskOverrides[dow] = byDow[dowKey].map((it,i)=>({id:'scan-'+Date.now()+'-'+dow+'-'+i, label: it.label || 'Untitled', sets: it.sets || '', seconds: 45}));
        });
        await saveTaskOverrides();

        const updatedDays = Object.keys(byDow).map(k=>DAY_META[parseInt(k)].name).join(', ');
        alert(`Updated: ${updatedDays}`);
        render();
      });
    });

  document.querySelectorAll('[data-action="scan-study"]').forEach(el=>{

      });

  const copyBtn = document.getElementById('copySummary');

      console.log('Wizard workout scan raw items:', items);

      const byDow = {};

        const dayName = (it.day || '').trim().toLowerCase();

      const preset = el.dataset.preset;

        if(!subjects.find(s=>s.id===id)) subjects.push({id, name, curriculum:[...curriculum], index:0});

      if(preset === 'jee'){
        ensure('physics', 'Physics', JEE_NEET_PHYSICS_CURRICULUM);

        ensure('jee-maths', 'Maths', JEE_MATHS_CURRICULUM);

  /* real swipe gesture via touch events only \u2014 avoids ghost mouse-event duplication,
     and preventDefault on horizontal drags stops Android's edge-swipe-back gesture from hijacking it */
  const viewport = document.getElementById('swipeViewport');
  if(viewport){
    let startX = 0, startY = 0, dragging = false, horizontalLock = false;
    const track = document.getElementById('swipeTrack');
    viewport.addEventListener('touchstart', (e)=>{
      if(transitioning) return;
      const t = e.touches[0];
      startX = t.clientX; startY = t.clientY; dragging = true; horizontalLock = false;
      track.style.transition = 'none';
    }, {passive:true});
    viewport.addEventListener('touchmove', (e)=>{
      if(!dragging) return;
      const t = e.touches[0];
      const dx = t.clientX - startX; const dy = t.clientY - startY;
      if(!horizontalLock && Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy)) horizontalLock = true;
      if(horizontalLock){
        e.preventDefault();
        track.style.transform = `translateX(${dx}px)`;
      }
    }, {passive:false});
    const finishSwipe = (e)=>{
      if(!dragging) return;
      dragging = false;
      const t = e.changedTouches[0];
      const dx = t.clientX - startX;
      track.style.transition = 'transform 0.28s cubic-bezier(.2,.8,.2,1)';
      if(dx < -60 && !transitioning){
        transitioning = true;
        track.style.transform='translateX(-100%)';
        setTimeout(()=>goToDay(1), 160);
      } else if(dx > 60 && !transitioning){
        transitioning = true;
        track.style.transform='translateX(100%)';
        setTimeout(()=>goToDay(-1), 160);
      } else {
        track.style.transform='translateX(0)';
      }
    };
    viewport.addEventListener('touchend', finishSwipe);
    viewport.addEventListener('touchcancel', finishSwipe);
  }

  // Buddy's AI line refreshes on real progress actions, throttled by maybeRefreshAi()
  // (not on config/editing actions like adding exercises or scanning photos)
  document.querySelectorAll(
    '[data-action="task"],[data-action="noworkout"],[data-action="water-plus"],[data-action="water-minus"],' +

  });

let lastFiredDate = null;
function scheduleReminderCheck(){
  setInterval(async ()=>{
    const r = await loadReminder();
    if(!r || !r.enabled) return;
    const now = new Date();
    const hh = now.getHours().toString().padStart(2,'0');
    const mm = now.getMinutes().toString().padStart(2,'0');
    const current = `${hh}:${mm}`;
    const todayIso = isoDate(now);
    if(current === r.time && lastFiredDate !== todayIso){
      lastFiredDate = todayIso;
      if('Notification' in window && Notification.permission === 'granted'){
        new Notification('Daily Rhythm', { body: "Time to train \u2014 today's list is waiting.", icon: 'icon.svg' });
      }
    }
  }, 20000);
}

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}

function initTabSwipe(){
  const app = document.getElementById('app');
  if(!app) return;
  let startX=0, startY=0, startTarget=null;
  app.addEventListener('touchstart', (e)=>{
    if(e.touches.length!==1) return;
    startX=e.touches[0].clientX; startY=e.touches[0].clientY; startTarget=e.target;
  }, {passive:true});
  app.addEventListener('touchend', (e)=>{
    if(!startTarget) return;
    const target = startTarget; startTarget=null;
    // don't hijack the Workout day-swipe-deck's own gesture, and don't switch tabs while any overlay is open
    if(target.closest && target.closest('.swipe-viewport')) return;
    if(settingsOpen || wizardStep || studyOverlay) return;
    const dx = e.changedTouches[0].clientX - startX;
    const dy = e.changedTouches[0].clientY - startY;
    if(Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy)*1.5) return; // require a real horizontal swipe, not a vertical scroll
    const order = ['home', settings.workoutEnabled!==false ? 'workout' : null, 'study', 'calendar', 'plus'].filter(Boolean);
    const idx = order.indexOf(activeTab);
    if(idx===-1) return;
    if(dx < 0 && idx < order.length-1){
      window.__tabSwipeDirection = 'left';
      activeTab = order[idx+1];
      render();
    } else if(dx > 0 && idx > 0){
      window.__tabSwipeDirection = 'right';
      activeTab = order[idx-1];
      render();
    }
  }, {passive:true});
}

(async ()=>{
  await loadEntries(); await loadTaskOverrides(); await loadCustomTrackers();
  await loadSettings(); await loadSubjects(); await loadAiSummaryCache(); await loadAiUsage(); await loadStudyNotes();
  const normalizedChanged = normalizeCurriculumData();
  if(normalizedChanged) await saveSubjects();
  if(!settings.wizardDone && subjects.length === 0) wizardStep = 'intro'; // truly new user — auto-show; otherwise it only opens via Settings
  await render();
  initTabSwipe();
  setTimeout(()=>document.getElementById('launch')?.classList.add('out'), 900);
  scheduleReminderCheck();
})();
