<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15171b">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>Daily Rhythm</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap');
:root{
  --bg:#121418; --surface:#1b1e24; --surface-2:#232730; --text:#f0ede6; --muted:#8b8780;
  --strength:#c05e37; --cardio:#3f8a76; --recovery:#6d7280; --gold:#e0aa4a; --line: rgba(240,237,230,0.08);
}
*{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
body{margin:0;background:var(--bg);color:var(--text);font-family:'IBM Plex Sans', sans-serif;padding:22px 16px 60px;min-height:100vh;overscroll-behavior-y:contain;}
.wrap{max-width:520px;margin:0 auto;}
h1{font-family:'Space Grotesk', sans-serif;font-weight:700;font-size:1.4rem;letter-spacing:-0.01em;margin:0 0 2px;}
.sub{color:var(--muted);font-size:0.85rem;margin:0 0 20px;}

/* bottom icon nav — replaces the old top pill-tabs, matches the paper wireframes */
body{padding-bottom:78px;}
.bottom-nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  display:flex;justify-content:space-around;align-items:center;padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:40;}
.nav-btn{background:none;border:none;color:var(--muted);font-size:1.3rem;cursor:pointer;width:44px;height:44px;
  border-radius:12px;display:flex;align-items:center;justify-content:center;transition:background 0.15s, color 0.15s;font-family:inherit;}
.nav-btn.active{color:var(--gold);background:var(--surface-2);}
.nav-btn:active{transform:scale(0.92);}
.nav-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}

/* top-right settings icon, replacing the old Reminders tab */
.top-bar{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:2px;}
.settings-btn{background:var(--surface);border:1px solid var(--line);color:var(--muted);width:36px;height:36px;
  border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1rem;cursor:pointer;flex-shrink:0;}
.settings-btn:active{transform:scale(0.92);}

.tabpane{display:none;} .tabpane.active{display:block;animation:fadein 0.25s ease;}
@keyframes fadein{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

.rhythm{display:flex;align-items:flex-end;gap:8px;height:80px;margin-bottom:8px;}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end;cursor:pointer;}
.bar{width:100%;border-radius:5px 5px 3px 3px;transition:opacity 0.2s, transform 0.15s;}
.bar-col:active .bar{transform:scaleY(0.94);}
.bar.today{box-shadow:0 0 0 2px var(--gold);animation:pulse 2.2s ease-in-out infinite;}
.bar.selected{box-shadow:0 0 0 2px var(--text);}
@keyframes pulse{0%,100%{filter:brightness(1);}50%{filter:brightness(1.4);}}
.daylabel{font-size:0.64rem;color:var(--muted);}
.daylabel.today{color:var(--gold);font-weight:600;}

.streak-card{background:linear-gradient(145deg, var(--surface), var(--surface-2));border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;margin:16px 0 18px;}
.streak-num{font-family:'Space Grotesk';font-size:1.7rem;font-weight:700;color:var(--gold);line-height:1;}
.streak-label{font-size:0.7rem;color:var(--muted);margin-top:2px;}
.streak-note{font-size:0.74rem;color:var(--muted);max-width:170px;text-align:right;}

/* swipe deck */
.swipe-hint{text-align:center;font-size:0.68rem;color:var(--muted);margin-bottom:10px;}
.swipe-viewport{overflow:hidden;position:relative;border-radius:16px;touch-action:pan-y;}
.swipe-track{display:flex;transition:transform 0.28s cubic-bezier(.2,.8,.2,1);}
.dots{display:flex;justify-content:center;gap:6px;margin-top:14px;}
.dot-nav{width:6px;height:6px;border-radius:50%;background:var(--line);transition:all 0.2s;}
.dot-nav.active{background:var(--gold);width:16px;border-radius:4px;}

/* mascot */
.mascot-row{display:flex;align-items:center;gap:12px;margin:2px 0 18px;}
.mascot-face{width:52px;height:52px;flex-shrink:0;}
.mascot-bubble{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 13px;font-size:0.76rem;color:var(--text);flex:1;line-height:1.35;}
.mascot-bubble b{color:var(--gold);}

/* study tab: subject chips + progress */
.chip-row{display:flex;gap:8px;margin-bottom:16px;}
.chip{flex:1;background:var(--surface);border:1px solid var(--line);color:var(--muted);padding:9px 0;border-radius:10px;font-size:0.78rem;font-weight:600;text-align:center;cursor:pointer;font-family:inherit;}
.chip.active{background:var(--surface-2);color:var(--gold);border-color:var(--gold);}
.chip.backlog{border-color:var(--strength);}
.chip.backlog::after{content:'\25CF';color:var(--strength);font-size:0.55rem;margin-left:5px;vertical-align:middle;}
.chip.clear::after{content:'\25CF';color:var(--cardio);font-size:0.55rem;margin-left:5px;vertical-align:middle;}
.progress-track{background:var(--surface-2);border-radius:20px;height:8px;overflow:hidden;margin:6px 0 4px;}
.progress-fill{height:100%;background:var(--gold);border-radius:20px;transition:width 0.3s ease;}
.progress-label{font-size:0.68rem;color:var(--muted);display:flex;justify-content:space-between;margin-bottom:16px;}
.study-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:17px;margin-bottom:14px;}
.study-phase-tag{font-size:0.62rem;text-transform:uppercase;letter-spacing:0.07em;color:var(--gold);font-weight:700;margin-bottom:6px;}
.study-title{font-family:'Space Grotesk';font-weight:700;font-size:1rem;margin-bottom:14px;line-height:1.3;}
.study-title.finished{color:var(--muted);font-family:inherit;font-weight:400;font-size:0.85rem;}
.study-actions-row{display:flex;gap:8px;margin-bottom:14px;}
.notes-wrap{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);}
.notes-label{font-size:0.68rem;text-transform:uppercase;letter-spacing:0.07em;color:var(--muted);margin-bottom:8px;}
.notes-textarea{width:100%;min-height:90px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;color:var(--text);font-family:'IBM Plex Sans';font-size:0.82rem;line-height:1.5;resize:vertical;outline:none;}
.notes-textarea:focus{border-color:var(--gold);}
.study-done-row{display:flex;align-items:center;gap:10px;}
.study-done-row .task-label{font-size:0.82rem;}
.upnext{font-size:0.72rem;color:var(--muted);margin-top:4px;}
.upnext-item{padding:5px 0;border-top:1px solid var(--line);}

.section-label{font-size:0.7rem;text-transform:uppercase;letter-spacing:0.08em;color:var(--muted);margin:0 0 10px;}
.day-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 17px;flex-shrink:0;width:100%;box-shadow:0 4px 20px rgba(0,0,0,0.2);}
.day-card.today{border-color:var(--gold);}
.day-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.day-name{font-weight:700;font-size:1rem;font-family:'Space Grotesk';}
.type-tag{font-size:0.63rem;padding:3px 9px;border-radius:20px;font-weight:600;}

.task-row{display:flex;align-items:center;gap:8px;padding:9px 2px;border-bottom:1px solid var(--line);}
.task-row:last-of-type{border-bottom:none;}
.checkbox{width:19px;height:19px;border-radius:6px;border:1.5px solid var(--muted);flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform 0.1s;}
.checkbox:active{transform:scale(0.85);}
.checkbox.checked{background:var(--gold);border-color:var(--gold);}
.checkbox.checked::after{content:'\2713';font-size:11px;color:var(--bg);font-weight:700;}
.task-label{font-size:0.8rem;flex:1;cursor:pointer;}
.task-label .set-info{color:var(--muted);font-size:0.71rem;display:block;}
.task-label.done{color:var(--muted);text-decoration:line-through;}
.task-actions{display:flex;gap:4px;flex-shrink:0;}
.icon-btn{background:var(--surface-2);border:none;color:var(--muted);width:28px;height:28px;border-radius:8px;font-size:0.8rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform 0.1s;}
.icon-btn:active{background:var(--gold);color:var(--bg);transform:scale(0.9);}

.wellness{display:flex;gap:10px;margin-top:14px;}
.wellness-field{flex:1;background:var(--surface-2);border-radius:10px;padding:10px 12px;}
.wellness-field label{display:block;font-size:0.66rem;color:var(--muted);margin-bottom:4px;}
.wellness-field .input-row{display:flex;align-items:baseline;gap:4px;}
.wellness-field input{background:none;border:none;color:var(--text);font-family:'Space Grotesk';font-size:1.15rem;font-weight:700;width:100%;outline:none;}
.wellness-field .unit{font-size:0.68rem;color:var(--muted);}
.wellness-field.hit{outline:1px solid var(--gold);}
.water-controls{display:flex;align-items:center;justify-content:space-between;gap:6px;}
.water-controls .icon-btn{width:26px;height:26px;font-size:0.95rem;flex-shrink:0;}
.water-value{font-family:'Space Grotesk';font-size:1.05rem;font-weight:700;text-align:center;flex:1;}
.water-sub{font-size:0.6rem;color:var(--muted);text-align:center;margin-top:2px;}

.noworkout-row{display:flex;align-items:center;gap:9px;margin:2px 0 12px;cursor:pointer;}
.noworkout-row .task-label{font-size:0.78rem;color:var(--muted);}
.noworkout-note{font-size:0.78rem;color:var(--muted);padding:10px 2px;font-style:italic;}
.locked-content{opacity:0.5;pointer-events:none;user-select:none;}
.locked-banner{font-size:0.7rem;color:var(--muted);background:var(--surface-2);border-radius:8px;padding:7px 10px;margin-bottom:10px;text-align:center;}
.edit-row{gap:6px;align-items:center;}
.edit-input{background:var(--surface-2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:7px 9px;font-family:inherit;font-size:0.8rem;outline:none;}
.edit-input:focus{border-color:var(--gold);}
.edit-label{flex:2;min-width:0;}
.edit-sets{flex:1.2;min-width:0;}

/* calendar */
.cal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.cal-detail-head{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
.cal-detail-date{font-family:'Space Grotesk';font-size:1.05rem;font-weight:700;}
.cal-header button{background:var(--surface);border:1px solid var(--line);color:var(--text);width:32px;height:32px;border-radius:9px;cursor:pointer;font-size:0.9rem;}
.cal-title{font-family:'Space Grotesk';font-weight:700;font-size:1rem;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:20px;}
.cal-dow{text-align:center;font-size:0.62rem;color:var(--muted);padding-bottom:4px;}
.cal-cell{aspect-ratio:1;border-radius:9px;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:0.75rem;cursor:pointer;border:1px solid transparent;color:var(--text);transition:transform 0.1s;}
.cal-cell:active{transform:scale(0.92);}
.cal-cell.empty{background:none;cursor:default;}
.cal-cell.complete{background:rgba(224,170,74,0.18);border-color:var(--gold);color:var(--gold);font-weight:700;}
.cal-cell.selected{border-color:var(--text);}
.cal-cell.istoday{box-shadow:0 0 0 1px var(--gold) inset;}

.reminder-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px;}
.reminder-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.reminder-row input[type=time], .reminder-row input[type=number]{background:var(--surface-2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:6px 10px;font-family:inherit;width:90px;}
.reminder-row label{font-size:0.8rem;flex:1;}
.btn-primary{background:var(--gold);color:var(--bg);border:none;padding:9px 16px;border-radius:9px;font-weight:600;font-size:0.78rem;cursor:pointer;font-family:inherit;}
.btn-secondary{background:var(--surface-2);color:var(--text);border:1px solid var(--line);padding:9px 16px;border-radius:9px;font-size:0.78rem;cursor:pointer;font-family:inherit;}
.note{font-size:0.72rem;color:var(--muted);margin-top:8px;line-height:1.5;}
.status-ok{color:var(--gold);}

.reset{display:block;margin:24px auto 0;background:none;border:1px solid var(--line);color:var(--muted);font-size:0.7rem;padding:8px 14px;border-radius:9px;cursor:pointer;}

.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.75);align-items:center;justify-content:center;z-index:50;padding:20px;backdrop-filter:blur(3px);}
.modal-overlay.open{display:flex;}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:26px;max-width:320px;width:100%;text-align:center;}
.modal h3{font-family:'Space Grotesk';margin:0 0 4px;font-size:1.05rem;}
.modal .sets{color:var(--muted);font-size:0.78rem;margin-bottom:18px;}
.timer-display{font-family:'Space Grotesk';font-size:2.6rem;font-weight:700;color:var(--gold);margin:10px 0 18px;}
.timer-controls{display:flex;gap:8px;justify-content:center;margin-bottom:10px;}
.modal-close{margin-top:14px;background:none;border:none;color:var(--muted);font-size:0.75rem;cursor:pointer;}
.adjust-row{display:flex;gap:8px;justify-content:center;margin-bottom:14px;}
.adjust-row button{width:34px;height:34px;border-radius:9px;background:var(--surface-2);border:none;color:var(--text);font-size:1rem;cursor:pointer;}

.loading{text-align:center;color:var(--muted);padding:40px 0;font-size:0.85rem;}

.settings-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:60;padding:20px;
  backdrop-filter:blur(3px);overflow-y:auto;}
.settings-overlay.open{display:block;}
.settings-panel{max-width:480px;margin:30px auto 0;}
.settings-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;}
.settings-head h2{font-family:'Space Grotesk';font-size:1.15rem;margin:0;}
.settings-close{background:var(--surface-2);border:none;color:var(--text);width:30px;height:30px;border-radius:9px;
  font-size:1rem;cursor:pointer;}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="loading">Loading your week...</div></div>

<div class="modal-overlay" id="timerModal">
  <div class="modal">
    <h3 id="timerTitle">Exercise</h3>
    <div class="sets" id="timerSets"></div>
    <div class="timer-display" id="timerDisplay">00:00</div>
    <div class="adjust-row" id="adjustRow">
      <button id="minus10">-10s</button>
      <button id="plus10">+10s</button>
    </div>
    <div class="timer-controls">
      <button class="btn-primary" id="timerStart">Start</button>
      <button class="btn-secondary" id="timerReset">Reset</button>
    </div>
    <button class="modal-close" id="timerClose">Close</button>
  </div>
</div>

<script>

    {id:'full_stretch', label:'Full body stretch routine', sets:'10 min', seconds:600},
    {id:'reflect_plan', label:'Reflect & plan next week', sets:'2 min', seconds:120},
  ],
];

const COLORS = {strength:'var(--strength)', cardio:'var(--cardio)', recovery:'var(--recovery)'};
const HEIGHTS = {strength:'100%', cardio:'62%', recovery:'34%'};
const SLEEP_TARGET = 7;

/* AI curriculum — sequential, not weekday-bound. One item = one sitting.
   Advance a pointer (settings.aiIndex) one step each time a session is marked done. */
const AI_CURRICULUM = [
  {phase:'Math', label:'Vectors & vector operations'},

function isoDate(d){
  const y = d.getFullYear();
  const m = (d.getMonth()+1).toString().padStart(2,'0');
  const day = d.getDate().toString().padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function addDays(iso, n){
  const d = new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n); return isoDate(d);
}
function getWeekDates(){
  const today = new Date();
  const dow = (today.getDay()+6)%7;
  const monday = new Date(today);
  monday.setDate(today.getDate()-dow);
  const dates=[];
  for(let i=0;i<7;i++){ const d=new Date(monday); d.setDate(monday.getDate()+i); dates.push(isoDate(d)); }
  return {dates, todayIso: isoDate(today)};
}
function weekdayIndex(iso){
  const d = new Date(iso+'T00:00:00');
  return (d.getDay()+6)%7;
}

/* storage: works both inside Claude artifact preview (window.storage)
   and on a real hosted site like GitHub Pages (localStorage fallback) */
async function storageGet(key){
  try{
    if(window.storage){ const r = await window.storage.get(key, false); return r ? r.value : null; }
  }catch(e){}
  try{ return localStorage.getItem(key); }catch(e){ return null; }
}
async function storageSet(key, value){
  try{
    if(window.storage){ await window.storage.set(key, value, false); return; }
  }catch(e){}
  try{ localStorage.setItem(key, value); }catch(e){}
}

function periodKeyFor(reset, d){
  const date = d || new Date();
  if(reset === 'daily') return isoDate(date);
  if(reset === 'weekly'){
    const dow = (date.getDay()+6)%7; // Monday = 0
    const monday = new Date(date); monday.setDate(date.getDate()-dow);
    return isoDate(monday);
  }
  if(reset === 'monthly') return date.getFullYear()+'-'+String(date.getMonth()+1).padStart(2,'0');
  return 'never';
}
// auto-resets a tracker's progress when its reset period has rolled over since it was last touched
function applyAutoReset(tracker){
  if(tracker.reset === 'never') return tracker;
  const currentKey = periodKeyFor(tracker.reset);
  if(tracker.lastResetKey !== currentKey){
    if(tracker.type === 'counter') tracker.value = 0;
    if(tracker.type === 'checklist') (tracker.items||[]).forEach(i=>{ i.done = false; });
    tracker.lastResetKey = currentKey;
  }
  return tracker;
}
function applyAllAutoResets(){
  let anyReset = false;
  customTrackers.forEach(t=>{
    const before = t.lastResetKey;
    applyAutoReset(t);
    if(t.lastResetKey !== before) anyReset = true;
  });
  if(anyReset) saveCustomTrackers();
}

function dayComplete(iso){
  const e = entries[iso]; if(!e) return false;
  const taskList = getTasksForDow(weekdayIndex(iso));
  const allTasksDone = e.noWorkout || taskList.every(t => e.tasks && e.tasks[t.id]);
  const sleepOk = (e.sleep || 0) >= SLEEP_TARGET;
  const proteinOk = (e.protein || 0) >= settings.proteinTarget;
  return allTasksDone && sleepOk && proteinOk;
}
function computeStreak(todayIso){
  let streak=0; let cursor = todayIso;
  while(dayComplete(cursor)){ streak++; cursor = addDays(cursor, -1); }
  return streak;
}

function fmtTime(sec){
  const m = Math.floor(sec/60).toString().padStart(2,'0');
  const s = Math.floor(sec%60).toString().padStart(2,'0');
  return m+':'+s;
}

  document.getElementById('timerTitle').textContent = label;
  document.getElementById('timerSets').textContent = 'Tap start when ready';
  document.getElementById('timerDisplay').textContent = fmtTime(seconds);

  document.getElementById('timerModal').classList.add('open');
}
function closeTimer(){ clearInterval(timerState.interval); document.getElementById('timerModal').classList.remove('open'); }
function beep(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const o = ctx.createOscillator(); const g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = 880; g.gain.value = 0.15;
    o.start(); setTimeout(()=>{o.stop(); ctx.close();}, 400);
  }catch(e){}
  if(navigator.vibrate) navigator.vibrate([200,100,200]);
}
function toggleTimerStart(){
  if(timerState.running){
    clearInterval(timerState.interval); timerState.running = false;
    document.getElementById('timerStart').textContent = 'Resume';
  } else {
    timerState.running = true;
    document.getElementById('timerStart').textContent = 'Pause';
    timerState.interval = setInterval(()=>{
      timerState.remaining--;
      document.getElementById('timerDisplay').textContent = fmtTime(Math.max(0,timerState.remaining));
      if(timerState.remaining<=0){
        clearInterval(timerState.interval); timerState.running = false;
        document.getElementById('timerStart').textContent = 'Start';
        document.getElementById('timerSets').textContent = 'Done \u2014 nice work';
        beep();
      }
    }, 1000);
  }
}
function adjustTimer(delta){
  if(timerState.running) return;
  timerState.remaining = Math.max(0, timerState.remaining + delta);
  timerState.seconds = timerState.remaining;
  document.getElementById('timerDisplay').textContent = fmtTime(timerState.remaining);
}
function resetTimer(){
  clearInterval(timerState.interval); timerState.running = false;
  timerState.remaining = timerState.seconds;
  document.getElementById('timerDisplay').textContent = fmtTime(timerState.remaining);
  document.getElementById('timerStart').textContent = 'Start';
}

function buildTodaySnapshot(){
  const todayIso = isoDate(new Date());
  const e = entries[todayIso] || {tasks:{}};
  const dow = weekdayIndex(todayIso);
  const taskList = getTasksForDow(dow);
  const tasksDone = e.noWorkout ? 'n/a (no workout day)' : taskList.filter(t=>e.tasks && e.tasks[t.id]).length + '/' + taskList.length;
  const studyStatus = {};
  subjects.forEach(s => { studyStatus[s.name] = !!(e.study && e.study[s.id]); });
  return {
    streak: computeStreak(todayIso),
    workout: tasksDone,
    sleep: (e.sleep||0) + 'h',
    protein: (e.protein||0) + 'g (target ' + settings.proteinTarget + 'g)',
    water: (e.water||0) + '/' + settings.waterTargetBottles + ' bottles',
    study: studyStatus,
  };
}

function buildClaudeSummary(){
  const todayIso = isoDate(new Date());
  const e = entries[todayIso] || {};
  const streak = computeStreak(todayIso);
  const workoutOk = dayComplete(todayIso);
  const dow = weekdayIndex(todayIso);
  const taskList = getTasksForDow(dow);
  const tasksDone = taskList.filter(t => e.tasks && e.tasks[t.id]).length;

  const subjectLines = subjects.flatMap(s=>{
    const idx = s.index || 0;
    const doneToday = !!(e.study && e.study[s.id]);
    const current = idx < s.curriculum.length ? s.curriculum[idx].label : 'curriculum complete';
    const pct = s.curriculum.length ? Math.round((idx/s.curriculum.length)*100) : 0;
    return [
      ``,
      `${s.name}: session ${idx} of ${s.curriculum.length} (${pct}%)`,
      `  Current: ${current}${doneToday?' \u2014 marked done today':' \u2014 not done today'}`,
    ];
  });

  return [
    `Daily Rhythm check-in \u2014 ${todayIso}`,
    ``,
    `Workout streak: ${streak} day${streak===1?'':'s'}`,
    `Today's workout: ${e.noWorkout ? 'marked as no-workout day' : tasksDone+'/'+taskList.length+' tasks done'}, sleep ${e.sleep||0}h, protein ${e.protein||0}g, water ${e.water||0}/${settings.waterTargetBottles} bottles${workoutOk?' \u2014 day complete':''}`,
    ...subjectLines,
  ].join('\n');
}

function renderMascot(todayIso){
  const workoutOk = dayComplete(todayIso);
  const e = entries[todayIso] || {};
  const subjectsDoneCount = subjects.filter(s => !!(e.study && e.study[s.id])).length;
  const total = 1 + subjects.length; // workout + each subject
  const count = (workoutOk?1:0) + subjectsDoneCount;
  const state = total>0 && count===total ? 'complete' : count>0 ? 'progress' : 'neutral';
  const names = subjects.length ? subjects.map(s=>s.name).join(', ') : 'your subjects';
  let msg;
  if(total===1) msg = workoutOk ? '<b>Workout done today.</b>' : "<b>Nothing logged yet today.</b> Workout \u2014 pick it up when ready.";
  else if(state==='complete') msg = `<b>Everything landed today.</b> Workout, ${names} \u2014 done.`;
  else if(count>0) msg = `<b>${count} of ${total} today.</b> Keep the rest moving.`;
  else msg = `<b>Nothing logged yet today.</b> Workout, ${names} \u2014 pick one and start.`;

  // once the buddy has an AI-written line for today, it takes over from the deterministic one
  if(aiSummaryCache.date === todayIso && aiSummaryCache.text) msg = aiSummaryCache.text;
  if(aiMascotBusy) msg += ' <span class="water-sub" style="margin:0;">(thinking\u2026)</span>';

  return `<div class="mascot-row">${mascotSVG(state)}<div class="mascot-bubble">${msg}</div></div>`;
}

function getSubject(id){ return subjects.find(s => s.id === id); }

// Real backlog definition: an item only counts as backlog once its scheduled date has
// actually passed while still unreached — never just "not done yet today". Subjects with
// no dated items at all (like undated AI/Quantum) have no concept of backlog by date, so
// callers should fall back to the old "done today" check when this returns null.
function subjectBacklogCount(subj){
  const hasDates = subj.curriculum.some(it => it.scheduledDate);
  if(!hasDates) return null;
  const todayIso = isoDate(new Date());
  return subj.curriculum.filter((it, i) => it.scheduledDate && it.scheduledDate < todayIso && i >= (subj.index||0)).length;
}

async function loadSubjects(){
  const raw = await storageGet('tracker:subjects');
  if(raw){ subjects = JSON.parse(raw); return; }
  // No subjects saved yet. If this looks like an existing v1 install (real prior AI/Quantum
  // progress), migrate that progress in silently. Otherwise leave it empty — that's what
  // triggers the setup wizard for a genuinely new user.
  const hasPriorProgress = Object.values(entries).some(e => e.study && (e.study.ai || e.study.quantum));
  if(hasPriorProgress){
    subjects = [
      {id:'ai', name:'AI', curriculum:[...AI_CURRICULUM], index: (settings.aiIndex || 0)},
      {id:'quantum', name:'Quantum', curriculum:[...QUANTUM_CURRICULUM], index: (settings.quantumIndex || 0)},
    ];
  } else {
    subjects = [];
  }
  await saveSubjects();
}
async function saveSubjects(){ await storageSet('tracker:subjects', JSON.stringify(subjects)); }
async function loadAiSummaryCache(){
  const raw = await storageGet('tracker:aisummary');
  aiSummaryCache = raw ? JSON.parse(raw) : { date: null, text: '', lastRefreshAt: 0 };
}
async function saveAiSummaryCache(){ await storageSet('tracker:aisummary', JSON.stringify(aiSummaryCache)); }

// Throttle, not a timer/poll: called after real user actions. Only actually fires a request
// if at least AI_REFRESH_MIN_GAP_MS has passed since the last one \u2014 no background loop running.
function maybeRefreshAi(){
  const now = Date.now();
  if(now - (aiSummaryCache.lastRefreshAt || 0) < AI_REFRESH_MIN_GAP_MS) return;
  aiSummaryCache.lastRefreshAt = now; // set immediately so rapid-fire actions can't sneak past the gate before the fetch resolves
  saveAiSummaryCache();
  runAiRefresh();
}
async function runAiRefresh(){
  aiMascotBusy = true; render();
  try{
    const res = await fetch(WORKER_URL + '/summary', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({data: buildTodaySnapshot()}),
    });
    const data = await res.json();
    if(!res.ok || data.error) throw new Error(data.error || 'Summary failed');
    aiSummaryCache.date = isoDate(new Date());
    aiSummaryCache.text = data.summary || '';
    await saveAiSummaryCache();
  } catch(e){
    console.warn('AI summary refresh failed (staying on the last known line):', e.message);
  } finally {
    aiMascotBusy = false; render();
  }
}

// Shared photo-scan flow: opens the camera/file picker, sends the image to the Worker, returns parsed items.
function fileToBase64(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=> resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// Sends one or more photos to the Worker and merges the returned items into one list.
// Each item may carry a `day` field (from a multi-day photo like "[FRIDAY]...") for the caller to route.
function scanPhoto(mode, onSuccess){
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.multiple = true; // lets a multi-day plan be scanned as several photos in one go
  // no `capture` attribute on purpose — lets the picker offer Camera, Gallery, and Files, not just a forced live camera
  input.addEventListener('change', async ()=>{
    const files = Array.from(input.files || []);
    if(!files.length) return;
    scanBusy = true; render();
    try{
      let allItems = [];
      for(const file of files){
        const base64 = await fileToBase64(file);
        const res = await fetch(WORKER_URL + '/analyze', {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({mode, image: base64, mimeType: file.type}),
        });
        const data = await res.json();
        if(!res.ok || data.error){
          const rawSnippet = data.raw ? data.raw.slice(0, 2000) : '(no raw output returned)';
          console.warn('Scan failed for', file.name, data.raw || data.error);
          throw new Error(`${data.error || 'Scan failed'}${files.length>1 ? ` (on photo: ${file.name})` : ''}\n\n--- What the model actually said ---\n${rawSnippet}`);
        }
        allItems = allItems.concat(data.items || []);
      }
      onSuccess(allItems);
    } catch(e){
      alert('Could not read that photo:\n\n' + e.message);
    } finally {
      scanBusy = false; render();
    }
  });
  input.click();
}

        <input class="edit-input" type="date" value="${item.scheduledDate||''}" data-action="set-item-date" data-subject="${studySubject}" data-idx="${idx}" style="flex:0 0 auto;width:150px;">
        ${item.scheduledDate ? `<button class="icon-btn" data-action="clear-item-date" data-subject="${studySubject}" data-idx="${idx}" title="Clear date">\u2715</button>` : ''}
      </div>
      <div class="study-actions-row">
        <button class="icon-btn" data-action="studysearch" data-label="${safeLabel}" title="Web search">\u{1F50D}</button>
        <button class="icon-btn" data-action="studyvideo" data-label="${safeLabel}" data-source="${item.source||''}" title="Video explainer">\u25B6</button>
      </div>
      <div class="study-done-row">
        <div class="checkbox ${doneToday?'checked':''}" data-action="studydone" data-subject="${studySubject}"></div>
        <div class="task-label ${doneToday?'done':''}" data-action="studydone" data-subject="${studySubject}">Mark today's session done</div>
      </div>
      ${doneToday ? `<button class="btn-secondary" style="width:100%;margin-top:8px;" data-action="studyextra" data-subject="${studySubject}">+ Have time \u2014 do this next one too</button>` : ''}
      ${extraToday ? `<div class="water-sub" style="margin-top:6px;">${1+extraToday} sessions done today</div>` : ''}
      <button class="btn-secondary" style="width:100%;margin-top:8px;" data-action="scan-study" data-subject="${studySubject}" ${scanBusy?'disabled':''}>${scanBusy?'Reading photo\u2026':'\u{1F4F7} Add topics from a photo'}</button>
      <div class="notes-wrap">
        <div class="notes-label">Notes</div>
        <textarea class="notes-textarea" data-action="studynote" data-key="${noteKey}" placeholder="Jot notes while you study...">${noteVal}</textarea>
      </div>
    </div>`;
  }

  let upcoming = '';
  const upcomingItems = curriculum.slice(idx+1, idx+4);
  if(upcomingItems.length){
    upcoming = '<div class="upnext">Up next</div>' + upcomingItems.map(u=>`<div class="upnext-item">${u.label}</div>`).join('');
  }

  const deleteSubjectRow = `<button class="reset" style="margin-top:20px;" data-action="subject-delete" data-id="${studySubject}">Delete "${subject.name}"</button>`;

  // one-off extras for today, separate from any subject's curriculum
  const extras = (e.extraStudy || []);
  let extrasHtml = '<div class="section-label" style="margin-top:20px;">Today \u2014 extra</div>';
  extras.forEach(x=>{
    extrasHtml += `
      <div class="task-row">
        <div class="checkbox ${x.done?'checked':''}" data-action="extra-toggle" data-id="${x.id}"></div>
        <div class="task-label ${x.done?'done':''}" data-action="extra-toggle" data-id="${x.id}">${x.label}</div>
        <button class="icon-btn" data-action="extra-remove" data-id="${x.id}" title="Remove">\u2715</button>
      </div>`;
  });
  extrasHtml += `
    <div class="task-row" style="border-bottom:none;">
      <input class="edit-input" style="flex:1;" type="text" id="extraStudyInput" placeholder="e.g. read a book for 5 min">
      <button class="icon-btn" data-action="extra-add" title="Add">+</button>
    </div>`;

  return `${chipsHtml}${addSubjectRow}${progressHtml}${cardHtml}${upcoming}${extrasHtml}${deleteSubjectRow}`;
}

function renderToday(){
  const {dates, todayIso} = getWeekDates();
  const streak = computeStreak(todayIso);

  let rhythmHtml = '<div class="rhythm">';
  dates.forEach((iso,i)=>{
    const meta = DAY_META[i]; const isToday = iso===todayIso; const isSel = iso===currentSwipeDate;
    rhythmHtml += `<div class="bar-col" data-action="jumpday" data-date="${iso}">
      <div class="bar ${isToday?'today':''} ${isSel && !isToday?'selected':''}" style="height:${HEIGHTS[meta.tag]};background:${COLORS[meta.tag]};"></div>
      <div class="daylabel ${isToday?'today':''}">${meta.name.slice(0,3)}</div>
    </div>`;
  });
  rhythmHtml += '</div>';

  const streakHtml = `<div class="streak-card">
    <div><div class="streak-num">${streak}</div><div class="streak-label">day streak &middot; full day complete</div></div>
    <div class="streak-note">${streak===0 ? "Complete every task, sleep, and protein to start one." : "Tasks, sleep, and protein \u2014 all landed."}</div>
  </div>`;

  const idx = dates.indexOf(currentSwipeDate);
  const safeIdx = idx === -1 ? 0 : idx;

  let dotsHtml = '<div class="dots">';
  dates.forEach((iso)=>{ dotsHtml += `<div class="dot-nav ${iso===currentSwipeDate?'active':''}"></div>`; });
  dotsHtml += '</div>';

  const cardHtml = renderDayCard(currentSwipeDate, currentSwipeDate===todayIso);

  return `
    ${rhythmHtml}
    ${streakHtml}
    <p class="swipe-hint">\u2190 swipe for previous / next day \u2192</p>
    <div class="swipe-viewport" id="swipeViewport">
      <div class="swipe-track" id="swipeTrack">${cardHtml}</div>
    </div>
    ${dotsHtml}
    <button class="reset" id="resetBtn">Reset this week</button>`;
}

function renderDayDetail(iso){
  const todayIso = isoDate(new Date());
  const e = entries[iso] || {};
  const dateObj = new Date(iso+'T00:00:00');
  const dateLabel = dateObj.toLocaleDateString('en-US', {weekday:'long', month:'long', day:'numeric'});

  const workoutCard = renderDayCard(iso, iso===todayIso); // reuses the same card, so past-day locking applies automatically

  const subjectRows = subjects.map((s,i)=>{
    const done = !!(e.study && e.study[s.id]);
    const extra = (e.studyExtra && e.studyExtra[s.id]) || 0;
    return `<div class="task-row" ${i===subjects.length-1?'style="border-bottom:none;"':''}>
      <div class="checkbox ${done?'checked':''}"></div>
      <div class="task-label ${done?'done':''}">${s.name} session${extra?` (+${extra} extra)`:''}</div>
    </div>`;
  }).join('');
  const extraStudy = e.extraStudy || [];

  let extraStudyRows = extraStudy.length
    ? extraStudy.map(x=>`<div class="task-row"><div class="checkbox ${x.done?'checked':''}"></div><div class="task-label ${x.done?'done':''}">${x.label}</div></div>`).join('')
    : '<p class="note" style="margin:6px 0 0;">No extra items logged this day.</p>';

  const studyCard = `
    <div class="day-card">
      <div class="day-head"><span class="day-name">Study</span></div>
      ${subjectRows || '<p class="note">No subjects set up.</p>'}
      ${extraStudyRows}
    </div>`;

  return `
    <div class="cal-detail-head">
      <button class="icon-btn" data-action="calback" title="Back to calendar">\u2190</button>
      <div class="cal-detail-date">${dateLabel}</div>
    </div>
    ${workoutCard}
    ${studyCard}
    <p class="note" style="text-align:center;">Custom trackers will show up here too, once that tab is built.</p>`;
}

function renderCalendar(){
  const todayIso = isoDate(new Date());
  if(selectedCalDate) return renderDayDetail(selectedCalDate);

  const year = calMonth.getFullYear(), month = calMonth.getMonth();
  const first = new Date(year, month, 1);
  const startOffset = (first.getDay()+6)%7;
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const monthName = calMonth.toLocaleString('default',{month:'long', year:'numeric'});

  let grid = '<div class="cal-grid">';
  ['Mo','Tu','We','Th','Fr','Sa','Su'].forEach(d=> grid += `<div class="cal-dow">${d}</div>`);
  for(let i=0;i<startOffset;i++) grid += '<div class="cal-cell empty"></div>';
  for(let day=1; day<=daysInMonth; day++){
    const iso = isoDate(new Date(year, month, day));
    const complete = dayComplete(iso);
    const isToday = iso===todayIso;
    grid += `<div class="cal-cell ${complete?'complete':''} ${isToday?'istoday':''}" data-action="calday" data-date="${iso}">${day}</div>`;
  }
  grid += '</div>';

  const header = `<div class="cal-header">
    <button data-action="calprev">\u2039</button>
    <div class="cal-title">${monthName}</div>
    <button data-action="calnext">\u203A</button>
  </div>`;

  return `${header}${grid}<p class="note">Tap a date to view or log that day.</p>`;
}

function goToDay(delta){
  currentSwipeDate = addDays(currentSwipeDate, delta);
  render();
  transitioning = false;
}

function attachHandlers(){
  document.querySelectorAll('.nav-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{ activeTab = btn.dataset.tab; render(); });
  });

  const openSettingsBtn = document.getElementById('openSettings');
  if(openSettingsBtn) openSettingsBtn.addEventListener('click', ()=>{ settingsOpen = true; render(); });
  const closeSettingsBtn = document.getElementById('closeSettings');
  if(closeSettingsBtn) closeSettingsBtn.addEventListener('click', ()=>{ settingsOpen = false; render(); });
  const settingsOverlayEl = document.getElementById('settingsOverlay');
  if(settingsOverlayEl) settingsOverlayEl.addEventListener('click', (e)=>{ if(e.target === settingsOverlayEl){ settingsOpen = false; render(); } });

  document.querySelectorAll('[data-action="task"]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const date = el.dataset.date, taskid = el.dataset.taskid;
      if(!entries[date]) entries[date] = {tasks:{}};
      if(!entries[date].tasks) entries[date].tasks = {};
      entries[date].tasks[taskid] = !entries[date].tasks[taskid];
      await saveEntries(); render();
    });
  });

  document.querySelectorAll('[data-action="sleep"]').forEach(el=>{
    el.addEventListener('change', async ()=>{
      const date = el.dataset.date;
      if(!entries[date]) entries[date] = {tasks:{}};
      entries[date].sleep = parseFloat(el.value) || 0;
      await saveEntries(); render();
    });
  });
  document.querySelectorAll('[data-action="protein"]').forEach(el=>{
    el.addEventListener('change', async ()=>{
      const date = el.dataset.date;
      if(!entries[date]) entries[date] = {tasks:{}};
      entries[date].protein = parseFloat(el.value) || 0;
      await saveEntries(); render();
    });
  });

  document.querySelectorAll('[data-action="studytab"]').forEach(el=>{
    el.addEventListener('click', ()=>{ studySubject = el.dataset.subject; render(); });
  });

  document.querySelectorAll('[data-action="studydone"]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const subjectId = el.dataset.subject;
      const subj = getSubject(subjectId);
      if(!subj) return;
      const todayIso = isoDate(new Date());
      if(!entries[todayIso]) entries[todayIso] = {tasks:{}};
      if(!entries[todayIso].study) entries[todayIso].study = {};
      if(!entries[todayIso].studyExtra) entries[todayIso].studyExtra = {};
      const wasDone = !!entries[todayIso].study[subjectId];
      const extra = entries[todayIso].studyExtra[subjectId] || 0;
      if(!wasDone){
        entries[todayIso].study[subjectId] = true;
        subj.index = (subj.index || 0) + 1;
      } else {
        // undo reverts everything done today for this subject, including any extra sessions
        entries[todayIso].study[subjectId] = false;
        subj.index = Math.max(0, (subj.index || 0) - 1 - extra);
        entries[todayIso].studyExtra[subjectId] = 0;
      }
      await saveEntries(); await saveSubjects(); render();
    });
  });
  document.querySelectorAll('[data-action="studyextra"]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const subjectId = el.dataset.subject;
      const subj = getSubject(subjectId);
      if(!subj) return;
      const todayIso = isoDate(new Date());
      if(!entries[todayIso]) entries[todayIso] = {tasks:{}};
      if(!entries[todayIso].studyExtra) entries[todayIso].studyExtra = {};
      if((subj.index||0) >= subj.curriculum.length) return; // curriculum already finished
      entries[todayIso].studyExtra[subjectId] = (entries[todayIso].studyExtra[subjectId] || 0) + 1;
      subj.index = (subj.index || 0) + 1;
      await saveEntries(); await saveSubjects(); render();
    });
  });
  document.querySelectorAll('[data-action="set-item-date"]').forEach(el=>{
    el.addEventListener('change', async ()=>{
      const subj = getSubject(el.dataset.subject);
      const idx = parseInt(el.dataset.idx);
      if(!subj || !subj.curriculum[idx]) return;
      subj.curriculum[idx].scheduledDate = el.value || undefined;
      await saveSubjects(); render();
    });
  });
  document.querySelectorAll('[data-action="clear-item-date"]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const subj = getSubject(el.dataset.subject);
      const idx = parseInt(el.dataset.idx);
      if(!subj || !subj.curriculum[idx]) return;
      delete subj.curriculum[idx].scheduledDate;
      await saveSubjects(); render();
    });
  });
  document.querySelectorAll('[data-action="subject-create"]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const input = document.getElementById('newSubjectName');
      const name = input ? input.value.trim() : '';
      if(!name) return;
      const newSubj = {id:'subj-'+Date.now(), name, curriculum:[], index:0};
      subjects.push(newSubj);
      studySubject = newSubj.id;
      await saveSubjects(); render();
    });
  });
  document.querySelectorAll('[data-action="subject-delete"]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      if(!confirm(`Delete this subject and its curriculum progress? This can't be undone.`)) return;
      subjects = subjects.filter(s=>s.id!==el.dataset.id);
      studySubject = subjects[0]?.id || null;
      await saveSubjects(); render();
    });
  });

  document.querySelectorAll('[data-action="studysearch"]').forEach(el=>{
    el.addEventListener('click', (ev)=>{ ev.stopPropagation(); studyWebSearch(el.dataset.label); });
  });
  document.querySelectorAll('[data-action="studyvideo"]').forEach(el=>{
    el.addEventListener('click', (ev)=>{ ev.stopPropagation(); studyVideoExplain(el.dataset.label, el.dataset.source); });
  });
  document.querySelectorAll('[data-action="studynote"]').forEach(el=>{
    // deliberately does NOT call render() on input — a full re-render would blow away
    // cursor position / focus while typing. Just update memory + debounce-save.
    el.addEventListener('input', ()=>{
      studyNotes[el.dataset.key] = el.value;
      saveStudyNotesDebounced();
    });
  });

  document.querySelectorAll('[data-action="extra-toggle"]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const todayIso = isoDate(new Date());
      if(!entries[todayIso]) entries[todayIso] = {tasks:{}};
      if(!entries[todayIso].extraStudy) entries[todayIso].extraStudy = [];
      const item = entries[todayIso].extraStudy.find(x=>x.id===el.dataset.id);
      if(item) item.done = !item.done;
      await saveEntries(); render();
    });
  });
  document.querySelectorAll('[data-action="extra-remove"]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const todayIso = isoDate(new Date());
      if(!entries[todayIso] || !entries[todayIso].extraStudy) return;
      entries[todayIso].extraStudy = entries[todayIso].extraStudy.filter(x=>x.id!==el.dataset.id);
      await saveEntries(); render();
    });
  });
  const extraAddBtn = document.querySelector('[data-action="extra-add"]');
  if(extraAddBtn) extraAddBtn.addEventListener('click', async ()=>{
    const input = document.getElementById('extraStudyInput');
    const val = input ? input.value.trim() : '';
    if(!val) return;
    const todayIso = isoDate(new Date());
    if(!entries[todayIso]) entries[todayIso] = {tasks:{}};
    if(!entries[todayIso].extraStudy) entries[todayIso].extraStudy = [];
    entries[todayIso].extraStudy.push({id:'extra-'+Date.now(), label:val, done:false});
    await saveEntries(); render();

  const trackerCancelBtn = document.querySelector('[data-action="tracker-cancel"]');

  const trackerCreateBtn = document.querySelector('[data-action="tracker-create"]');

  document.querySelectorAll('[data-action="tracker-delete"]').forEach(el=>{
    el.addEventListener('click', async ()=>{

  document.querySelectorAll('[data-action="tracker-counter-plus"]').forEach(el=>{
    el.addEventListener('click', async ()=>{

    });
  });
  document.querySelectorAll('[data-action="tracker-counter-minus"]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const t = customTrackers.find(x=>x.id===el.dataset.id);
      if(t){ t.value = Math.max(0, (t.value||0) - 1); await saveCustomTrackers(); render(); }

  document.querySelectorAll('[data-action="tracker-item-toggle"]').forEach(el=>{
    el.addEventListener('click', async ()=>{

  document.querySelectorAll('[data-action="tracker-item-remove"]').forEach(el=>{

  document.querySelectorAll('[data-action="tracker-item-add"]').forEach(el=>{

  const saveProteinBtn = document.getElementById('saveProteinTarget');
  if(saveProteinBtn) saveProteinBtn.addEventListener('click', async ()=>{

  const saveWaterBtn = document.getElementById('saveWaterSettings');

    el.addEventListener('click', async (ev)=>{

      if(!entries[date]) entries[date] = {tasks:{}};

      await saveEntries(); render();
    });

  document.querySelectorAll('[data-action="water-minus"]').forEach(el=>{
    el.addEventListener('click', async (ev)=>{
      ev.stopPropagation();
      const date = el.dataset.date;
      if(!entries[date]) entries[date] = {tasks:{}};
      entries[date].water = Math.max(0, Math.round(((entries[date].water || 0) - 0.5) * 2) / 2);
      await saveEntries(); render();

  document.querySelectorAll('[data-action="noworkout"]').forEach(el=>{
    el.addEventListener('click', async ()=>{

      if(!entries[date]) entries[date] = {tasks:{}};

      await saveEntries(); render();
    });

  document.querySelectorAll('[data-action="edit-day"]').forEach(el=>{
    el.addEventListener('click', ()=>{ editingDow = parseInt(el.dataset.dow); render(); });
  });
  document.querySelectorAll('[data-action="done-editing"]').forEach(el=>{
    el.addEventListener('click', ()=>{ editingDow = null; render(); });
  });

  document.querySelectorAll('[data-action="edit-tasklabel"]').forEach(el=>{
    el.addEventListener('change', async ()=>{
      const dow = parseInt(el.dataset.dow), taskid = el.dataset.taskid;
      const list = getTasksForDow(dow).map(t => t.id===taskid ? {...t, label: el.value} : t);
      taskOverrides[dow] = list;
      await saveTaskOverrides(); render();
    });
  });
  document.querySelectorAll('[data-action="edit-tasksets"]').forEach(el=>{
    el.addEventListener('change', async ()=>{
      const dow = parseInt(el.dataset.dow), taskid = el.dataset.taskid;
      const list = getTasksForDow(dow).map(t => t.id===taskid ? {...t, sets: el.value} : t);
      taskOverrides[dow] = list;
      await saveTaskOverrides(); render();
    });
  });
  document.querySelectorAll('[data-action="remove-task"]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const dow = parseInt(el.dataset.dow), taskid = el.dataset.taskid;
      taskOverrides[dow] = getTasksForDow(dow).filter(t => t.id !== taskid);
      await saveTaskOverrides(); render();
    });
  });
  document.querySelectorAll('[data-action="add-task"]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const dow = parseInt(el.dataset.dow);
      const newTask = {id:'custom-'+Date.now(), label:'New exercise', sets:'', seconds:45};
      taskOverrides[dow] = [...getTasksForDow(dow), newTask];
      await saveTaskOverrides(); render();
    });
  });

  document.querySelectorAll('[data-action="scan-workout"]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const currentDow = parseInt(el.dataset.dow);
      scanPhoto('workout', async (items)=>{
        if(!items.length){ alert('No exercises found in that photo.'); return; }

        // Diagnostic: show exactly what day the model detected per exercise, since this
        // is the second time day-splitting hasn't worked and I can't run the model myself
        // to see what it's actually returning. This makes the real cause visible on your end.
        const debugLines = items.map(it => `${it.label || '?'} \u2192 day: "${it.day || '(empty)'}"`).join('\n');
        console.log('Workout scan raw items:', items);
        if(!confirm(`Detected days (tap OK to apply, Cancel to abort):\n\n${debugLines}`)) return;

        // group items by weekday name if the model found one (e.g. "[FRIDAY]" headers);
        // anything with no day found falls back onto whichever day you were editing
        const byDow = {};
        items.forEach(it=>{
          const dayName = (it.day || '').trim().toLowerCase();
          // "contains" match, not exact-equal — the model may return "Friday - Full-Body Strength"
          // instead of a bare "friday", and exact match was silently failing on that, dumping
          // everything onto the currently-edited day instead of actually splitting by day.
          const matchIdx = DAY_META.findIndex(d => dayName.includes(d.name.toLowerCase()));
          const targetDow = matchIdx !== -1 ? matchIdx : currentDow;
          if(!byDow[targetDow]) byDow[targetDow] = [];
          byDow[targetDow].push(it);
        });

        Object.keys(byDow).forEach(dowKey=>{
          const dow = parseInt(dowKey);
          taskOverrides[dow] = byDow[dowKey].map((it,i)=>({id:'scan-'+Date.now()+'-'+dow+'-'+i, label: it.label || 'Untitled', sets: it.sets || '', seconds: 45}));
        });
        await saveTaskOverrides();

        const updatedDays = Object.keys(byDow).map(k=>DAY_META[parseInt(k)].name).join(', ');
        alert(`Updated: ${updatedDays}`);
        render();
      });
    });
  });
  document.querySelectorAll('[data-action="scan-study"]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const subjectId = el.dataset.subject;
      scanPhoto('study', async (items)=>{
        if(!items.length){ alert('No topics found in that photo.'); return; }
        const subj = getSubject(subjectId);
        if(!subj) return;
        const newItems = items.map(it=>({phase: it.phase || '', label: it.label || 'Untitled topic'}));
        subj.curriculum = [...subj.curriculum, ...newItems];
        await saveSubjects(); render();
      });
    });
  });


  const copyBtn = document.getElementById('copySummary');
  if(copyBtn) copyBtn.addEventListener('click', async ()=>{
    const text = buildClaudeSummary();
    const statusEl = document.getElementById('copyStatus');
    try{
      await navigator.clipboard.writeText(text);
      if(statusEl) statusEl.textContent = 'Copied \u2014 paste it into a Claude chat.';
    }catch(e){
      if(statusEl) statusEl.textContent = 'Couldn\u2019t auto-copy \u2014 select and copy the text below.';
      alert(text);
    }
  });

  document.querySelectorAll('[data-action="reset-subject"]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const subj = getSubject(el.dataset.id);
      if(!subj) return;
      if(!confirm(`Reset ${subj.name} progress back to session 1?`)) return;
      subj.index = 0; await saveSubjects(); render();
    });
  });
  const rerunWizardBtn = document.getElementById('rerunWizard');
  if(rerunWizardBtn) rerunWizardBtn.addEventListener('click', ()=>{
    settingsOpen = false;
    wizardWorkoutChoice = null;
    wizardStep = 'intro';
    render();
  });

  const wizToWorkoutBtn = document.querySelector('[data-action="wizard-to-workout"]');
  if(wizToWorkoutBtn) wizToWorkoutBtn.addEventListener('click', ()=>{ wizardStep = 'workout'; render(); });

  const wizYesBtn = document.querySelector('[data-action="wizard-workout-yes"]');
  if(wizYesBtn) wizYesBtn.addEventListener('click', async ()=>{
    wizardWorkoutChoice = 'yes';
    settings.workoutEnabled = true;
    await saveSettings(); render();
  });
  const wizNoBtn = document.querySelector('[data-action="wizard-workout-no"]');
  if(wizNoBtn) wizNoBtn.addEventListener('click', async ()=>{
    settings.workoutEnabled = false;
    await saveSettings();
    wizardStep = 'subjects'; render();
  });

  const wizScanWorkoutBtn = document.querySelector('[data-action="wizard-scan-workout"]');
  if(wizScanWorkoutBtn) wizScanWorkoutBtn.addEventListener('click', ()=>{
    scanPhoto('workout', async (items)=>{
      if(!items.length){ alert('No exercises found in that photo.'); return; }
      const debugLines = items.map(it => `${it.label || '?'} \u2192 day: "${it.day || '(empty)'}"`).join('\n');
      console.log('Wizard workout scan raw items:', items);
      if(!confirm(`Detected days (tap OK to apply, Cancel to abort):\n\n${debugLines}`)) return;
      const byDow = {};
      items.forEach(it=>{
        const dayName = (it.day || '').trim().toLowerCase();
        const matchIdx = DAY_META.findIndex(d => dayName.includes(d.name.toLowerCase()));
        const targetDow = matchIdx !== -1 ? matchIdx : 0; // no day being "currently edited" during the wizard — default Monday
        if(!byDow[targetDow]) byDow[targetDow] = [];
        byDow[targetDow].push(it);
      });
      Object.keys(byDow).forEach(dowKey=>{
        const dow = parseInt(dowKey);
        taskOverrides[dow] = byDow[dowKey].map((it,i)=>({id:'scan-'+Date.now()+'-'+dow+'-'+i, label: it.label || 'Untitled', sets: it.sets || '', seconds: 45}));
      });
      await saveTaskOverrides();
      wizardStep = 'subjects'; render();
    });
  });
  document.querySelectorAll('[data-action="wizard-workout-template"]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const templates = {
        beginner: WORKOUT_TEMPLATE_BEGINNER, veteran: WORKOUT_TEMPLATE_VETERAN,
        pro: WORKOUT_TEMPLATE_PRO, extreme: WORKOUT_TEMPLATE_EXTREME,
      };
      const week = templates[el.dataset.template];
      if(!week) return;
      week.forEach((dayExercises, dow)=>{
        taskOverrides[dow] = dayExercises.map((ex,i)=>({id:'tmpl-'+el.dataset.template+'-'+dow+'-'+i, label: ex.label, sets: ex.sets||'', seconds:45}));
      });
      settings.workoutEnabled = true;
      await saveTaskOverrides(); await saveSettings();
      wizardStep = 'subjects'; render();
    });
  });
  document.querySelectorAll('[data-action="subject-preset"]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      // Physics & Chemistry are shared between JEE and NEET, so they use fixed ids and are
      // never duplicated. Maths (JEE-only) and Biology (NEET-only) are mutually exclusive \u2014
      // picking one exam removes the other's exam-specific subject, since you can't be tracking
      // both Maths and Biology as "the same JEE/NEET setup" at once.
      const preset = el.dataset.preset;
      const ensure = (id, name, curriculum) => {
        if(!subjects.find(s=>s.id===id)) subjects.push({id, name, curriculum:[...curriculum], index:0});
      };
      if(preset === 'jee'){
        ensure('physics', 'Physics', JEE_NEET_PHYSICS_CURRICULUM);
        ensure('chem', 'Chemistry', JEE_NEET_CHEMISTRY_CURRICULUM);
        ensure('jee-maths', 'Maths', JEE_MATHS_CURRICULUM);
        subjects = subjects.filter(s => s.id !== 'neet-bio');
        studySubject = 'physics';
      } else if(preset === 'neet'){
        ensure('physics', 'Physics', JEE_NEET_PHYSICS_CURRICULUM);
        ensure('chem', 'Chemistry', JEE_NEET_CHEMISTRY_CURRICULUM);
        ensure('neet-bio', 'Biology', NEET_BIOLOGY_CURRICULUM);
        subjects = subjects.filter(s => s.id !== 'jee-maths');
        studySubject = 'physics';
      } else {
        return;
      }
      await saveSubjects(); render();
    });
  });

  const wizToSubjectsBtn = document.querySelector('[data-action="wizard-to-subjects"]');
  if(wizToSubjectsBtn) wizToSubjectsBtn.addEventListener('click', ()=>{ wizardStep = 'subjects'; render(); });

  const wizFinishBtn = document.querySelector('[data-action="wizard-finish"]');
  if(wizFinishBtn) wizFinishBtn.addEventListener('click', async ()=>{
    settings.wizardDone = true;
    await saveSettings();
    wizardStep = null; wizardWorkoutChoice = null;
    render();
  });

  document.getElementById('timerStart').onclick = toggleTimerStart;
  document.getElementById('timerReset').onclick = resetTimer;
  document.getElementById('timerClose').onclick = closeTimer;
  document.getElementById('minus10').onclick = ()=>adjustTimer(-10);
  document.getElementById('plus10').onclick = ()=>adjustTimer(10);

  /* real swipe gesture via touch events only \u2014 avoids ghost mouse-event duplication,
     and preventDefault on horizontal drags stops Android's edge-swipe-back gesture from hijacking it */
  const viewport = document.getElementById('swipeViewport');
  if(viewport){
    let startX = 0, startY = 0, dragging = false, horizontalLock = false;
    const track = document.getElementById('swipeTrack');
    viewport.addEventListener('touchstart', (e)=>{
      if(transitioning) return;
      const t = e.touches[0];
      startX = t.clientX; startY = t.clientY; dragging = true; horizontalLock = false;
      track.style.transition = 'none';
    }, {passive:true});
    viewport.addEventListener('touchmove', (e)=>{
      if(!dragging) return;
      const t = e.touches[0];
      const dx = t.clientX - startX; const dy = t.clientY - startY;
      if(!horizontalLock && Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy)) horizontalLock = true;
      if(horizontalLock){
        e.preventDefault();
        track.style.transform = `translateX(${dx}px)`;
      }
    }, {passive:false});
    const finishSwipe = (e)=>{
      if(!dragging) return;
      dragging = false;
      const t = e.changedTouches[0];
      const dx = t.clientX - startX;
      track.style.transition = 'transform 0.28s cubic-bezier(.2,.8,.2,1)';
      if(dx < -60 && !transitioning){
        transitioning = true;
        track.style.transform='translateX(-100%)';
        setTimeout(()=>goToDay(1), 160);
      } else if(dx > 60 && !transitioning){
        transitioning = true;
        track.style.transform='translateX(100%)';
        setTimeout(()=>goToDay(-1), 160);
      } else {
        track.style.transform='translateX(0)';
      }
    };
    viewport.addEventListener('touchend', finishSwipe);
    viewport.addEventListener('touchcancel', finishSwipe);
  }

  // Buddy's AI line refreshes on real progress actions, throttled by maybeRefreshAi()
  // (not on config/editing actions like adding exercises or scanning photos)
  document.querySelectorAll(
    '[data-action="task"],[data-action="noworkout"],[data-action="water-plus"],[data-action="water-minus"],' +
    '[data-action="studydone"],[data-action="studyextra"],[data-action="extra-toggle"],' +
    '[data-action="tracker-counter-plus"],[data-action="tracker-counter-minus"],[data-action="tracker-item-toggle"]'
  ).forEach(el=>{
    el.addEventListener('click', ()=> maybeRefreshAi());
  });
}

let lastFiredDate = null;
function scheduleReminderCheck(){
  setInterval(async ()=>{
    const r = await loadReminder();
    if(!r || !r.enabled) return;
    const now = new Date();
    const hh = now.getHours().toString().padStart(2,'0');
    const mm = now.getMinutes().toString().padStart(2,'0');
    const current = `${hh}:${mm}`;
    const todayIso = isoDate(now);
    if(current === r.time && lastFiredDate !== todayIso){
      lastFiredDate = todayIso;
      if('Notification' in window && Notification.permission === 'granted'){
        new Notification('Daily Rhythm', { body: "Time to train \u2014 today's list is waiting.", icon: 'icon.svg' });
      }
    }
  }, 20000);
}

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}

(async ()=>{
  await loadEntries(); await loadTaskOverrides(); await loadCustomTrackers();
  await loadSettings(); await loadSubjects(); await loadAiSummaryCache(); await loadStudyNotes();
  if(!settings.wizardDone && subjects.length === 0) wizardStep = 'intro'; // truly new user — auto-show; otherwise it only opens via Settings
  await render();
  scheduleReminderCheck();
})();
</script>
