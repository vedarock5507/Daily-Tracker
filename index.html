    </div>`;
  }

  if(studyPlannerMode === 'manual'){
    const useIndividualDueDates = !!(subject?.manualUseIndividualDueDates ?? studyPlannerDraft.individualDueDates);
    const rows = pendingTopics.map((item,i)=>{
      const mins = Math.max(15, Number(subject?.manualTopicMinutes?.[item.id]) || Number(item.remainingMinutes) || estimateTemplateMinutes(item));
      const due = subject?.manualTopicDueDates?.[item.id] || dateValue;
      return `<div class="day-card" style="padding:12px;margin-bottom:8px;">
        <div style="display:flex;align-items:center;gap:8px;">
          <div style="width:24px;text-align:center;font-weight:800;">${i+1}</div>
          <div style="flex:1;min-width:0;"><div style="font-weight:700;">${item.baseLabel||item.label}</div><div class="note" style="margin:2px 0 0;">${item.phase||'Topic'}</div></div>
          <input class="edit-input manual-topic-minutes" data-topic-id="${item.id}" type="number" min="15" max="10000" step="15" value="${mins}" style="width:82px;" aria-label="Minutes for ${item.baseLabel||item.label}">
        </div>
        ${useIndividualDueDates ? `<div class="manual-due-row"><label for="manual-due-${item.id}">Due date for this topic</label><input class="edit-input manual-topic-due-date" id="manual-due-${item.id}" data-topic-id="${item.id}" type="date" value="${due}" min="${isoDate(new Date())}"></div>` : ''}
        <div style="display:flex;gap:6px;margin-top:8px;justify-content:flex-end;">
          <button class="icon-btn" data-action="manual-topic-up" data-topic-id="${item.id}" ${i===0?'disabled':''}>↑</button>
          <button class="icon-btn" data-action="manual-topic-down" data-topic-id="${item.id}" ${i===pendingTopics.length-1?'disabled':''}>↓</button>
        </div>
      </div>`;
    }).join('');
    return `<div class="study-overlay open" id="studyOverlay">
      <div class="study-overlay-panel">
        <div class="study-overlay-head">
          <h2>I'll plan it myself</h2>
          <button class="settings-close" data-action="close-study-overlay">×</button>
        </div>
        <p class="note">Set the order and your own time estimate for each topic. Daily Rhythm won't decide what you should study — it will only split your plan into realistic sessions.</p>
        <div class="reminder-card" style="margin-top:12px;">
          <div class="reminder-row"><label>Set due dates individually</label><input id="manualIndividualDueDates" type="checkbox" ${useIndividualDueDates?'checked':''} style="width:20px;height:20px;accent-color:var(--gold);"></div>
          ${useIndividualDueDates
            ? `<p class="note" style="margin:0;">Choose a separate deadline for each topic below. The existing finish date is used as the starting value.</p>`
            : `<div class="reminder-row"><label>Finish by</label><input class="edit-input" id="planDate" type="date" value="${dateValue}"></div>`}
          <div class="reminder-row"><label>Study time/day</label><input class="edit-input" id="planMinutes" type="number" min="15" max="600" step="15" value="${minutesValue}"></div>
        </div>
        <div class="study-card" style="margin-top:10px;">
          <div class="study-title">Your topic plan</div>
          <div style="margin-top:8px;">${rows || '<p class="note">No remaining topics to plan.</p>'}</div>
        </div>
        <div class="study-action-grid">
          <button class="btn-primary" data-action="build-manual-study-plan">${studyPlanBusy?'Building…':'Build my sessions'}</button>
          <button class="btn-secondary" data-action="planner-back-choice">Back</button>
        </div>
        ${studyPlanStatus ? `<p class="note" style="margin-top:10px;color:var(--gold);">${studyPlanStatus}</p>` : ''}
      </div>
    </div>`;
  }

  return `<div class="study-overlay open" id="studyOverlay">
    <div class="study-overlay-panel">
      <div class="study-overlay-head">
        <h2>Plan it for me</h2>
        <button class="settings-close" data-action="close-study-overlay">×</button>
      </div>
      <p class="note">Daily Rhythm estimates each topic separately. If a topic takes 3 hours and you study 1 hour a day, it will split that topic across 3 separate 1-hour sessions instead of pretending the whole topic fits into one day.</p>
      <div class="reminder-card">
        <div class="reminder-row"><label>Goal</label><input class="edit-input" id="planGoal" type="text" value="${goalValue}" style="width:65%;"></div>
        <div class="reminder-row"><label>Finish by</label><input class="edit-input" id="planDate" type="date" value="${dateValue}"></div>
        <div class="reminder-row"><label>Study time/day</label><input class="edit-input" id="planMinutes" type="number" min="15" max="600" step="15" value="${minutesValue}"></div>
        <div class="reminder-row"><label>Starting level</label><select class="edit-input" id="planLevel" style="width:55%;"><option ${levelValue==='starting'?'selected':''}>starting</option><option ${levelValue==='familiar'?'selected':''}>familiar</option><option ${levelValue==='strong'?'selected':''}>strong</option></select></div>
        <div class="reminder-row"><label>Keep curriculum order</label><input id="planKeepOrder" type="checkbox" ${studyPlannerDraft.keepOrder?'checked':''} style="width:20px;height:20px;accent-color:var(--gold);"></div>
      </div>
      <div class="study-action-grid">
        <button class="btn-primary" data-action="build-study-plan">${studyPlanBusy?'Planning…':'Build plan'}</button>
        <button class="btn-secondary" data-action="planner-back-choice">Back</button>
      </div>
      ${studyPlanStatus ? `<p class="note" style="margin-top:10px;color:var(--gold);">${studyPlanStatus}</p>` : ''}
    </div>
  </div>`;
}

function renderStudy(){
  migrateMissionCurriculum();
  const todayIso = isoDate(new Date());
  const e = entries[todayIso] || {};

  if(subjects.length === 0){
    return `<p class="note" style="text-align:center;padding:20px 10px;">No subjects set up yet.</p>
      <input class="edit-input" style="width:100%;margin-bottom:8px;" type="text" id="newSubjectName" placeholder="Subject name, e.g. Anatomy">
      <button class="btn-primary" style="width:100%;" data-action="subject-create">+ Add subject</button>`;
  }

  if(!studySubject || !getSubject(studySubject)) studySubject = subjects[0].id;

  // backlog coloring: red if today's session for that subject isn't done yet (and curriculum isn't finished), green if clear
  function chipStatus(subj){
    const finished = (subj.index||0) >= subj.curriculum.length;
    if(finished) return '';
    const backlogCount = subjectBacklogCount(subj);
    if(backlogCount !== null) return backlogCount > 0 ? 'backlog' : 'clear';
    const doneToday = !!(e.study && e.study[subj.id]);
    return doneToday ? 'clear' : 'backlog';
  }
  const chipsHtml = `<div class="chip-row">
    ${subjects.map(s=>`<div class="chip ${studySubject===s.id?'active':''} ${chipStatus(s)}" data-action="studytab" data-subject="${s.id}">${s.name}</div>`).join('')}
  </div>`;
  const addSubjectRow = `
    <div class="water-row" style="margin-bottom:14px;">
      <input class="edit-input" style="flex:1;" type="text" id="newSubjectName" placeholder="New subject name...">
      <button class="icon-btn" data-action="subject-create">+</button>
    </div>`;

  const subject = getSubject(studySubject);
  if(!subject) return '';
  const isEditingSubject = editingSubjectId === studySubject;
  const nextTopic = subject.curriculum?.[subject.index||0];
  const pendingCount = Math.max(0, (subject.curriculum?.length||0) - (subject.index||0));
  const plannedCount = (subject.curriculum||[]).filter(x => x.scheduledDate && !(subject.curriculum.indexOf(x) < (subject.index||0))).length;
  const notesCount = (subject.curriculum||[]).filter((x,i)=>!!(studyNotes[noteKeyFor(subject.id,x,i)||'']?.trim())).length;
  const planSource = subject.planSource === 'ai' ? 'AI-organized' : subject.planSource === 'smart-local' ? 'Smart-organized' : 'Not planned yet';
  const commandHtml = `
    <div class="study-command">
      <div class="study-command-head">
        <div>
          <div class="study-command-title">Study engine</div>
          <div class="study-command-sub">${nextTopic ? `Next: <b>${nextTopic.label}</b>` : 'This subject is complete.'}</div>
        </div>
        <span class="smart-badge">${planSource}</span>
      </div>
      <div class="study-kpis">
        <div class="study-kpi"><b>${pendingCount}</b><span>topics left</span></div>
        <div class="study-kpi"><b>${plannedCount}</b><span>planned</span></div>
        <div class="study-kpi"><b>${notesCount}</b><span>note sets</span></div>
      </div>
      <div class="study-action-grid">
        <button class="btn-primary" data-action="open-study-planner">✦ Plan for me</button>
        <button class="btn-secondary" data-action="open-notebook">📓 Subject notes</button>
        <button class="btn-secondary" data-action="open-bulk-paste">Paste syllabus</button>
        <button class="btn-secondary" data-action="${isEditingSubject?'done-editing-subject':'edit-subject'}">${isEditingSubject?'✓ Done editing':'Quick edit'}</button>
      </div>
      ${planSource==='Not planned yet' && pendingCount ? `<p class="note" style="margin-bottom:0;">Stop entering dates one by one. Plan once, then the queue runs from here.</p>` : ''}
    </div>`;

  const editToggleRow = isEditingSubject ? `
    <div class="water-row" style="justify-content:flex-end;margin-bottom:10px;">
      <button class="btn-secondary" style="width:auto;padding:8px 14px;" data-action="done-editing-subject">✓ Done editing</button>
    </div>` : '';

  if(isEditingSubject){
    const rows = subject.curriculum.map((t,i)=>`
      <div class="topic-edit-card">
        <div class="topic-edit-head">
          <input class="edit-input topic-phase-input" type="text" value="${(t.phase||'').replace(/"/g,'&quot;')}" placeholder="Phase / chapter" data-action="edit-topic-phase" data-subject="${studySubject}" data-idx="${i}">
          <button class="icon-btn" data-action="remove-topic" data-subject="${studySubject}" data-idx="${i}" title="Remove">\u2715</button>
        </div>
        <input class="edit-input topic-label-input" type="text" value="${t.label.replace(/"/g,'&quot;')}" placeholder="Topic name" data-action="edit-topic-label" data-subject="${studySubject}" data-idx="${i}">
      </div>`).join('');
    const editorHtml = `<div class="study-card">
      ${rows || '<p class="note" style="margin:0 0 8px;">No topics yet \u2014 add one below.</p>'}
      <button class="btn-secondary" style="width:100%;margin-top:8px;" data-action="add-topic" data-subject="${studySubject}">+ Add topic</button>
    </div>`;
    return `${chipsHtml}${addSubjectRow}${commandHtml}${editToggleRow}${editorHtml}<button class="reset" style="margin-top:20px;" data-action="subject-delete" data-id="${studySubject}">Delete "${subject.name}"</button>${renderStudyOverlay()}`;
  }

  const curriculum = subject.curriculum;
  const idx = subject.index || 0;
  const total = curriculum.length;
  const pct = total ? Math.min(100, Math.round((idx/total)*100)) : 0;
  const doneToday = !!(e.study && e.study[studySubject]);
  const extraToday = (e.studyExtra && e.studyExtra[studySubject]) || 0;

  const progressHtml = `
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%;"></div></div>
    <div class="progress-label"><span>${idx} of ${total} sessions</span><span>${pct}%</span></div>`;

  let cardHtml;
  if(total === 0){
    cardHtml = `<div class="study-card">
      <div class="study-title finished">No curriculum yet for ${subject.name}.</div>
      <button class="btn-secondary" style="width:100%;margin-top:8px;" data-action="scan-study" data-subject="${studySubject}" ${scanBusy?'disabled':''}>${scanBusy?'Reading photo\u2026':'\u{1F4F7} Add topics from a photo'}</button>
    </div>`;
  } else if(idx >= total){
    cardHtml = `<div class="study-card">
      <div class="study-phase-tag">${subject.name} \u2014 curriculum complete</div>
      <div class="study-title finished">You've cleared everything queued up here.</div>
      <button class="btn-secondary" style="width:100%;margin-top:8px;" data-action="scan-study" data-subject="${studySubject}" ${scanBusy?'disabled':''}>${scanBusy?'Reading photo\u2026':'\u{1F4F7} Add more topics from a photo'}</button>
    </div>`;
  } else {
    const item = curriculum[idx];
    const safeLabel = item.label.replace(/"/g,'&quot;');
    const noteKey = noteKeyFor(studySubject, item, idx);
    const noteVal = (studyNotes[noteKey] || '').replace(/</g,'&lt;');
    cardHtml = `<div class="study-card">
      <div class="study-phase-tag">${item.phase||''}</div>
      <div class="study-title">${item.label}</div>
      ${item.isStudySession ? `<div class="water-sub" style="margin:4px 0 0;">${Number(item.sessionMinutes)||60} min session${item.sessionTotal>1?` · ${item.sessionNumber}/${item.sessionTotal}`:''}${item.scheduledDate?` · ${item.scheduledDate}`:''}</div>` : ''}
      ${normalizeMissionSubtasks(item).length ? `<div class="mission-subtasks" style="margin-top:10px;display:grid;gap:6px;">${normalizeMissionSubtasks(item).map(st=>`<div style="display:flex;align-items:center;gap:8px;"><div class="checkbox ${st.completed?'checked':''}" data-action="mission-subtask" data-subject="${studySubject}" data-topic-id="${item.parentTopicId||item.originalTopicId||item.id}" data-subtask-id="${st.id}"></div><div class="task-label ${st.completed?'done':''}" data-action="mission-subtask" data-subject="${studySubject}" data-topic-id="${item.parentTopicId||item.originalTopicId||item.id}" data-subtask-id="${st.id}"><span style="font-size:.65rem;opacity:.7;">${st.type}</span> ${st.title}${st.minutes?` · ${st.minutes}m`:''}</div></div>`).join('')}</div>` : ''}
      <div class="water-row" style="margin:8px 0 0;align-items:center;">
        <span class="water-sub" style="margin:0;">Due date (optional)</span>
        <input class="edit-input" type="date" value="${item.scheduledDate||''}" data-action="set-item-date" data-subject="${studySubject}" data-idx="${idx}" style="flex:0 0 auto;width:150px;">
        ${item.scheduledDate ? `<button class="icon-btn" data-action="clear-item-date" data-subject="${studySubject}" data-idx="${idx}" title="Clear date">\u2715</button>` : ''}
      </div>
      <div class="study-actions-row">
        <button class="icon-btn" data-action="studysearch" data-label="${safeLabel}" title="Web search">\u{1F50D}</button>
        <button class="icon-btn" data-action="studyvideo" data-label="${safeLabel}" data-source="${item.source||''}" title="Video explainer">\u25B6</button>
        ${item.isStudySession ? `<button class="icon-btn" data-action="study-session-timer" data-label="${safeLabel}" data-minutes="${Number(item.sessionMinutes)||60}" title="Start study timer">⏱</button>` : ''}
      </div>
      <div class="study-done-row">
        <div class="checkbox ${doneToday?'checked':''}" data-action="studydone" data-subject="${studySubject}"></div>
        <div class="task-label ${doneToday?'done':''}" data-action="studydone" data-subject="${studySubject}">Mark today's session done</div>
      </div>
      <div class="difficulty-row" title="This changes how the smart planner prioritizes the next topics.">
        <button class="${item.difficulty==='hard'?'active':''}" data-action="topic-difficulty" data-subject="${studySubject}" data-idx="${idx}" data-value="hard">Too hard</button>
        <button class="${item.difficulty==='okay'?'active':''}" data-action="topic-difficulty" data-subject="${studySubject}" data-idx="${idx}" data-value="okay">Good</button>
        <button class="${item.difficulty==='easy'?'active':''}" data-action="topic-difficulty" data-subject="${studySubject}" data-idx="${idx}" data-value="easy">Too easy</button>
      </div>
      ${doneToday ? `<button class="btn-secondary" style="width:100%;margin-top:8px;" data-action="studyextra" data-subject="${studySubject}">+ Have time \u2014 do this next one too</button>` : ''}
      ${extraToday ? `<div class="water-sub" style="margin-top:6px;">${1+extraToday} sessions done today</div>` : ''}
      <button class="btn-secondary" style="width:100%;margin-top:8px;" data-action="scan-study" data-subject="${studySubject}" ${scanBusy?'disabled':''}>${scanBusy?'Reading photo\u2026':'\u{1F4F7} Add topics from a photo'}</button>
      <div class="notes-wrap">
        <div class="notes-label">Notes</div>
        <textarea class="notes-textarea" data-action="studynote" data-key="${noteKey}" placeholder="Jot notes while you study...">${noteVal}</textarea>
      </div>
    </div>`;
  }

  let upcoming = '';
  const upcomingItems = curriculum.slice(idx+1, idx+4);
  if(upcomingItems.length){
    upcoming = '<div class="upnext">Up next</div>' + upcomingItems.map(u=>`<div class="upnext-item">${u.label}${u.scheduledDate?` <span class="notebook-meta">· ${u.scheduledDate}</span>`:''}</div>`).join('');
  }

  const deleteSubjectRow = `<button class="reset" style="margin-top:20px;" data-action="subject-delete" data-id="${studySubject}">Delete "${subject.name}"</button>`;

  // one-off extras for today, separate from any subject's curriculum
  const extras = (e.extraStudy || []);
  let extrasHtml = '<div class="section-label" style="margin-top:20px;">Today \u2014 extra</div>';
  extras.forEach(x=>{
    extrasHtml += `
      <div class="task-row">
        <div class="checkbox ${x.done?'checked':''}" data-action="extra-toggle" data-id="${x.id}"></div>
        <div class="task-label ${x.done?'done':''}" data-action="extra-toggle" data-id="${x.id}">${x.label}</div>
        <button class="icon-btn" data-action="extra-remove" data-id="${x.id}" title="Remove">\u2715</button>
      </div>`;
  });
  extrasHtml += `
    <div class="task-row" style="border-bottom:none;">
      <input class="edit-input" style="flex:1;" type="text" id="extraStudyInput" placeholder="e.g. read a book for 5 min">
      <button class="icon-btn" data-action="extra-add" title="Add">+</button>
    </div>`;

  return `${chipsHtml}${addSubjectRow}${commandHtml}${editToggleRow}${progressHtml}${cardHtml}${upcoming}${extrasHtml}${deleteSubjectRow}${renderStudyOverlay()}`;
}

function renderToday(){
  const {dates, todayIso} = getWeekDates();
  const streak = computeStreak(todayIso);

  let rhythmHtml = '<div class="rhythm">';
  dates.forEach((iso,i)=>{
    const meta = DAY_META[i]; const isToday = iso===todayIso; const isSel = iso===currentSwipeDate;
    rhythmHtml += `<div class="bar-col" data-action="jumpday" data-date="${iso}">
      <div class="bar ${isToday?'today':''} ${isSel && !isToday?'selected':''}" style="height:${HEIGHTS[meta.tag]};background:${COLORS[meta.tag]};"></div>
      <div class="daylabel ${isToday?'today':''}">${meta.name.slice(0,3)}</div>
    </div>`;
  });
  rhythmHtml += '</div>';

  const streakHtml = `<div class="streak-card">
    <div><div class="streak-num">${streak}</div><div class="streak-label">day streak · full day complete</div></div>
    <div class="streak-note">${streak===0 ? 'Complete your planned tracking to start one.' : 'Your daily tracking is moving.'}</div>
  </div>`;

  const idx = dates.indexOf(currentSwipeDate);
  const safeIdx = idx === -1 ? 0 : idx;
  let dotsHtml = '<div class="dots">';
  dates.forEach((iso)=>{ dotsHtml += `<div class="dot-nav ${iso===currentSwipeDate?'active':''}"></div>`; });
  dotsHtml += '</div>';

  const selectedIso=currentSwipeDate;
  const selectedEntry=entries[selectedIso]||{tasks:{}};
  const selectedDow=weekdayIndex(selectedIso);
  const taskList=getTasksForDow(selectedDow);
  const isPast=selectedIso < isoDate(new Date());
  const workoutActive=settings.workoutEnabled!==false && !selectedEntry.noWorkout;
  const isEditing=!isPast && editingDow===selectedDow;

  let taskRows='';
  if(!workoutActive){
    taskRows=`<div class="noworkout-note">No workout routine is active for this day. Sleep, water, and food tracking still work below.</div>`;
  }else if(isEditing){
    taskList.forEach(t=>{
      taskRows+=`<div class="task-row edit-row">
        <input class="edit-input edit-label" type="text" value="${t.label.replace(/"/g,'&quot;')}" data-action="edit-tasklabel" data-dow="${selectedDow}" data-taskid="${t.id}">
        <input class="edit-input edit-sets" type="text" value="${(t.sets||'').replace(/"/g,'&quot;')}" data-action="edit-tasksets" data-dow="${selectedDow}" data-taskid="${t.id}" placeholder="sets/reps">
        <button class="icon-btn" data-action="remove-task" data-dow="${selectedDow}" data-taskid="${t.id}" title="Remove">×</button>
      </div>`;
    });
    taskRows+=`<button class="btn-secondary" style="width:100%;margin-top:8px;" data-action="add-task" data-dow="${selectedDow}">+ Add exercise</button>
      <button class="btn-secondary" style="width:100%;margin-top:8px;" data-action="scan-workout" data-dow="${selectedDow}" ${scanBusy?'disabled':''}>${scanBusy?'Reading photo…':'📷 Scan a workout plan'}</button>`;
  }else{
    taskList.forEach(t=>{
      const done=!!(selectedEntry.tasks&&selectedEntry.tasks[t.id]);
      taskRows+=`<div class="task-row">
        <div class="checkbox ${done?'checked':''}" data-action="task" data-date="${selectedIso}" data-taskid="${t.id}"></div>
        <div class="task-label ${done?'done':''}" data-action="task" data-date="${selectedIso}" data-taskid="${t.id}">${t.label}<span class="set-info">${t.sets}</span></div>
        <div class="task-actions"><button class="icon-btn" data-action="timer" data-label="${t.label.replace(/"/g,'&quot;')}" data-seconds="${t.seconds}" title="Timer">⏱</button><button class="icon-btn" data-action="youtube" data-label="${t.label.replace(/"/g,'&quot;')}" title="YouTube">▶</button></div>
      </div>`;
    });
  }

  const workoutBlock=(settings.workoutEnabled!==false && !selectedEntry.noWorkout) ? `<div class="day-card workout-block">
    <div class="block-head">
      <div><div class="block-title">Workout</div><div class="block-sub">${workoutActive ? `${DAY_META[selectedDow].type} · ${taskList.length} planned exercise${taskList.length===1?'':'s'}` : 'No workout routine for this day'}</div></div>
      ${(!isPast && settings.workoutEnabled!==false) ? `<div style="display:flex;align-items:center;gap:7px;">
        <button class="add-exercise-btn" data-action="add-exercise-day" data-dow="${selectedDow}" title="Add exercise for this day"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg> Add exercise</button>
        <button class="icon-btn" data-action="${isEditing?'done-editing':'edit-day'}" data-dow="${selectedDow}" title="${isEditing?'Done editing':'Edit exercises'}">${isEditing?'✓':'✎'}</button>
      </div>` : ''}
    </div>
    ${isPast?'<div class="locked-banner">🔒 This day is in the past — locked.</div>':''}
    <div class="${isPast?'locked-content':''}">${taskRows}</div>
  </div>` : '';

  const sleepVal=selectedEntry.sleep||'';
  const waterVal=selectedEntry.water||0;
  const sleepHit=(selectedEntry.sleep||0)>=SLEEP_TARGET;
  const waterHit=waterVal>=settings.waterTargetBottles;
  const wellnessBlock=`<div class="day-card workout-block">
    <div class="block-head"><div><div class="block-title">Sleep &amp; Water</div><div class="block-sub">Keep the basics visible even on non-workout days.</div></div></div>
    ${isPast?'<div class="locked-banner">🔒 This day is in the past — locked.</div>':''}
    <div class="${isPast?'locked-content':''}"><div class="wellness">
      <div class="wellness-field ${sleepHit?'hit':''}"><label>Sleep</label><div class="input-row"><input type="number" min="0" max="14" step="0.5" placeholder="0" value="${sleepVal}" data-action="sleep" data-date="${selectedIso}"><span class="unit">hrs</span></div></div>
      <div class="wellness-field ${waterHit?'hit':''}"><label>Water (target ${settings.waterTargetBottles})</label><div class="water-controls"><button class="icon-btn" data-action="water-minus" data-date="${selectedIso}">−</button><span class="water-value">${waterVal}</span><button class="icon-btn" data-action="water-plus" data-date="${selectedIso}">+</button></div><div class="water-sub">${(waterVal*settings.waterBottleLiters).toFixed(1)}L · bottle = ${settings.waterBottleLiters}L</div></div>
    </div></div>
  </div>`;

}

function renderDayDetail(iso){
  const todayIso = isoDate(new Date());
  const e = entries[iso] || {};
  const dateObj = new Date(iso+'T00:00:00');
  const dateLabel = dateObj.toLocaleDateString('en-US', {weekday:'long', month:'long', day:'numeric'});

  const workoutCard = renderDayCard(iso, iso===todayIso); // reuses the same card, so past-day locking applies automatically

  const subjectRows = subjects.map((s,i)=>{
    const done = !!(e.study && e.study[s.id]);
    const extra = (e.studyExtra && e.studyExtra[s.id]) || 0;
    return `<div class="task-row" ${i===subjects.length-1?'style="border-bottom:none;"':''}>
      <div class="checkbox ${done?'checked':''}"></div>
      <div class="task-label ${done?'done':''}">${s.name} session${extra?` (+${extra} extra)`:''}</div>
    </div>`;
  }).join('');
  const extraStudy = e.extraStudy || [];

  let extraStudyRows = extraStudy.length
    ? extraStudy.map(x=>`<div class="task-row"><div class="checkbox ${x.done?'checked':''}"></div><div class="task-label ${x.done?'done':''}">${x.label}</div></div>`).join('')
    : '<p class="note" style="margin:6px 0 0;">No extra items logged this day.</p>';

  const dailyNote = e.dailyNote || '';
  const studyNotePreview = subjects.map((s)=>{
    const noteCount = (s.curriculum||[]).reduce((n,it,i)=> n + ((studyNotes[noteKeyFor(s.id,it,i)]||'').trim()?1:0), 0);
    return `<div class="task-row"><div class="task-label">${s.name}<span class="set-info">${noteCount} saved note set${noteCount===1?'':'s'}</span></div><button class="btn-secondary" style="padding:6px 9px;" data-action="calendar-open-notes" data-subject="${s.id}">Open</button></div>`;
  }).join('');
  const studyCard = `
    <div class="day-card">
      <div class="day-head"><span class="day-name">Study</span><span class="smart-badge">Notes</span></div>
      ${subjectRows || '<p class="note">No subjects set up.</p>'}
      ${extraStudyRows}
    </div>`;
  const isPastDay = iso < todayIso;
  const notesCard = `
    <div class="day-card cal-note">
      <div class="day-head"><span class="day-name">Daily note</span><span class="notebook-meta">Saved to ${dateLabel}</span></div>
      ${isPastDay?'<div class="locked-banner">🔒 This day is in the past — locked.</div>':''}
      <div class="${isPastDay?'locked-content':''}"><textarea class="notes-textarea" data-action="daily-note" data-date="${iso}" placeholder="What did you learn, finish, miss, or want to remember?">${dailyNote.replace(/</g,'&lt;')}</textarea>
      <div class="day-head" style="margin-top:14px;margin-bottom:6px;"><span class="day-name" style="font-size:.86rem;">Subject notebooks</span></div>
      ${studyNotePreview || '<p class="note">No subjects yet.</p>'}</div>
    </div>`;

  return `
    <div class="cal-detail-head">
      <button class="icon-btn" data-action="calback" title="Back to calendar">\u2190</button>
      <div class="cal-detail-date">${dateLabel}</div>
    </div>
    ${notesCard}
    ${workoutCard}
    ${studyCard}
    <p class="note" style="text-align:center;">Calendar now holds the daily memory too — not just completion dots.</p>`;
}

function renderCalendar(){
  const todayIso = isoDate(new Date());
  if(selectedCalDate) return renderDayDetail(selectedCalDate);

  const year = calMonth.getFullYear(), month = calMonth.getMonth();
  const first = new Date(year, month, 1);
  const startOffset = (first.getDay()+6)%7;
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const monthName = calMonth.toLocaleString('default',{month:'long', year:'numeric'});

  let grid = '<div class="cal-grid">';
  ['Mo','Tu','We','Th','Fr','Sa','Su'].forEach(d=> grid += `<div class="cal-dow">${d}</div>`);
  for(let i=0;i<startOffset;i++) grid += '<div class="cal-cell empty"></div>';
  for(let day=1; day<=daysInMonth; day++){
    const iso = isoDate(new Date(year, month, day));
    const complete = dayComplete(iso);
    const isToday = iso===todayIso;
    const hasNote = !!(entries[iso] && entries[iso].dailyNote && entries[iso].dailyNote.trim());
    grid += `<div class="cal-cell ${complete?'complete':''} ${isToday?'istoday':''} ${hasNote?'hasnote':''}" data-action="calday" data-date="${iso}">${day}</div>`;
  }
  grid += '</div>';

  const header = `<div class="cal-header">
    <button data-action="calprev">\u2039</button>
    <div class="cal-title">${monthName}</div>
    <button data-action="calnext">\u203A</button>
  </div>`;

  return `${header}${grid}<p class="note">Tap a date to view or log that day.</p>`;
}

async function render(){
  const direction = window.__tabSwipeDirection || null;
  window.__tabSwipeDirection = null;
  if(direction) document.documentElement.dataset.swipeDir = direction;
  else delete document.documentElement.dataset.swipeDir; // don't let a stale direction leak into an unrelated render
  if(document.startViewTransition){
    const transition = document.startViewTransition(() => performRender());
    try{ await transition.finished; }catch(e){}
  } else {
    await performRender();
  }
}

function goToDay(delta){
  currentSwipeDate = addDays(currentSwipeDate, delta);
  render();
  transitioning = false;
}

// Lightweight updates for frequent taps. These deliberately mutate only the
// affected controls instead of rebuilding the active tab and losing its state.
function patchEntryUI(date){
  const entry=entries[date]||{tasks:{}};
  document.querySelectorAll(`[data-action="task"][data-date="${date}"]`).forEach(el=>{
    const done=!!(entry.tasks&&entry.tasks[el.dataset.taskid]);
    const box=el.classList.contains('checkbox')?el:el.querySelector('.checkbox');
    const label=el.classList.contains('task-label')?el:el.querySelector('.task-label');
    if(box) box.classList.toggle('checked',done);
    if(label) label.classList.toggle('done',done);
  });
  document.querySelectorAll(`[data-action="water-plus"][data-date="${date}"],[data-action="water-minus"][data-date="${date}"]`).forEach(el=>{
    const root=el.closest('.wellness')||el.parentElement;
    const value=root&&root.querySelector('.water-value');
    if(value) value.textContent=entry.water||0;
  });
  refreshBuddy();
}
function patchStudyUI(subjectId){
  const done=!!(entries[isoDate(new Date())]?.study?.[subjectId]);
  document.querySelectorAll(`[data-action="studydone"][data-subject="${subjectId}"]`).forEach(el=>{
    const box=el.classList.contains('checkbox')?el:el.querySelector('.checkbox');
    const label=el.classList.contains('task-label')?el:el.querySelector('.task-label');
    if(box) box.classList.toggle('checked',done);
    if(label) label.classList.toggle('done',done);
  });
  refreshBuddy();
}
function buildBuddyStatusLine(){
  const todayIso = isoDate(new Date());
  const e = entries[todayIso] || {};
  const dow = weekdayIndex(todayIso);
  const taskList = getTasksForDow(dow);
  const workoutLeft = (!e.noWorkout && settings.workoutEnabled!==false) ? taskList.filter(t=>!(e.tasks && e.tasks[t.id])).length : 0;
  const subjectsLeft = subjects.filter(s=>{
    const finished = (s.index||0) >= s.curriculum.length;
    return !finished && !(e.study && e.study[s.id]);
  }).map(s=>s.name);
  const openItems = [];
  if(workoutLeft>0) openItems.push(`${workoutLeft} workout exercise${workoutLeft>1?'s':''}`);
  if(subjectsLeft.length) openItems.push(subjectsLeft.join(', '));
  return openItems.length===0 ? 'Everything on your list is done for today. Nice.' : `Still open: ${openItems.join(' \u00b7 ')}.`;
}
function refreshBuddy(){
  const todayIso=isoDate(new Date()), e=entries[todayIso]||{};
  const tasksDone=Object.values(e.tasks||{}).filter(Boolean).length;
  const studiesDone=Object.values(e.study||{}).filter(Boolean).length;
  const actions=tasksDone+studiesDone+(e.water||0)+(e.sleep?1:0)+(e.protein?1:0);
  const state=dayComplete(todayIso)?'complete':actions>0?'progress':'neutral';
  const button=document.querySelector('.buddy-btn');
  if(button) button.innerHTML=mascotSVG(state);
  const bubble=document.querySelector('.mascot-bubble');
  const recentlyNudged = (Date.now() - buddyNudgedAt) < 20000; // give a tapped message ~20s before auto-refresh can overwrite it
  if(bubble && actions>0 && !recentlyNudged){
    bubble.textContent = buildBuddyStatusLine(); // PA-style status, not generic praise
    bubble.animate([{transform:'scale(.97)'},{transform:'scale(1.03)'},{transform:'scale(1)'}],{duration:420,easing:'cubic-bezier(.16,1,.3,1)'});
  }
}

function buddyNudge(){
  // PA role, not a pep-talk bot: tapping the buddy should tell you exactly what's done
  // and what's still open today, like a status check-in \u2014 not a vague encouragement line.
  const bubble=document.querySelector('.mascot-bubble');
  if(bubble){
    buddyNudgedAt = Date.now();
    bubble.textContent=buildBuddyStatusLine();
    bubble.animate([{transform:'scale(.96)'},{transform:'scale(1.03)'},{transform:'scale(1)'}],{duration:360,easing:'ease-out'});
  }
  // a little wink payoff for tapping him, visually separate from the ambient idle loop
  const face=document.querySelector('.pixel-buddy .pbuddy-eye-r');
  if(face){
    face.style.animation='none';
    face.style.transform='scaleY(0.15)';
    setTimeout(()=>{ face.style.animation=''; face.style.transform=''; }, 260);
  }
}

        const debugLines = items.map(it => `${it.label || '?'} \u2192 day: "${it.day || '(empty)'}"`).join('\n');

      if(!items.length){ alert('No exercises found in that photo.'); return; }
      const debugLines = items.map(it => `${it.label || '?'} \u2192 day: "${it.day || '(empty)'}"`).join('\n');
      console.log('Wizard workout scan raw items:', items);
      if(!confirm(`Detected days (tap OK to apply, Cancel to abort):\n\n${debugLines}`)) return;
      const byDow = {};
      items.forEach(it=>{
        const dayName = (it.day || '').trim().toLowerCase();
        const matchIdx = DAY_META.findIndex(d => dayName.includes(d.name.toLowerCase()));
        const targetDow = matchIdx !== -1 ? matchIdx : 0; // no day being "currently edited" during the wizard — default Monday
        if(!byDow[targetDow]) byDow[targetDow] = [];
        byDow[targetDow].push(it);
      });
      Object.keys(byDow).forEach(dowKey=>{
        const dow = parseInt(dowKey);
        taskOverrides[dow] = byDow[dowKey].map((it,i)=>({id:'scan-'+Date.now()+'-'+dow+'-'+i, label: it.label || 'Untitled', sets: it.sets || '', seconds: 45}));
      });
      await saveTaskOverrides();
      wizardStep = 'subjects'; render();
    });
  });
  document.querySelectorAll('[data-action="wizard-workout-template"]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const templates = {
        beginner: WORKOUT_TEMPLATE_BEGINNER, veteran: WORKOUT_TEMPLATE_VETERAN,
        pro: WORKOUT_TEMPLATE_PRO, extreme: WORKOUT_TEMPLATE_EXTREME,
      };
      const week = templates[el.dataset.template];
      if(!week) return;
      week.forEach((dayExercises, dow)=>{
        taskOverrides[dow] = dayExercises.map((ex,i)=>({id:'tmpl-'+el.dataset.template+'-'+dow+'-'+i, label: ex.label, sets: ex.sets||'', seconds:45}));
      });
      settings.workoutEnabled = true;
      await saveTaskOverrides(); await saveSettings();
      wizardStep = 'subjects'; render();
    });
  });
  document.querySelectorAll('[data-action="subject-preset"]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const preset = el.dataset.preset;
      const ensure = (id, name, curriculum) => {
        const normalized = (curriculum||[]).map((item,i)=>({
          ...item,
          id:item.id || `${id}-${i+1}`,
          phase:item.phase||'',
          label:item.label||'Untitled topic'
        }));
        const existing = subjects.find(s=>s.id===id);
        if(existing){
          existing.curriculum=normalized;
          existing.index=0;
          return;
        }
        subjects.push({id, name, curriculum:normalized, index:0});
      };

      // Setup Wizard is additive. Never wipe the user's existing study plan.
      // Existing subjects remain untouched; only the subjects created by this
      // wizard selection are included in the new template planning pass.
      const existingIds = new Set(subjects.map(s=>s.id));

      if(preset === 'jee'){
        ensure('physics','Physics',JEE_NEET_PHYSICS_CURRICULUM);
        ensure('chem','Chemistry',JEE_NEET_CHEMISTRY_CURRICULUM);
        ensure('jee-maths','Maths',JEE_MATHS_CURRICULUM);
        wizardTemplate={label:'JEE', id:'jee'};
      } else if(preset === 'neet'){
        ensure('physics','Physics',JEE_NEET_PHYSICS_CURRICULUM);
        ensure('chem','Chemistry',JEE_NEET_CHEMISTRY_CURRICULUM);
        ensure('neet-bio','Biology',NEET_BIOLOGY_CURRICULUM);
        wizardTemplate={label:'NEET', id:'neet'};
      } else if(MBBS_TEMPLATES[preset]){
        MBBS_TEMPLATES[preset].subjects.forEach(s=>ensure(s.id,s.name,s.curriculum));
        wizardTemplate={label:MBBS_TEMPLATES[preset].label,id:preset};
      } else return;

      wizardTargetSubjectIds = subjects
        .filter(s=>!existingIds.has(s.id))
        .map(s=>s.id);
      studySubject=subjects.find(s=>wizardTargetSubjectIds.includes(s.id))?.id || subjects[0]?.id || null;
      studyPlannerDraft={
        goal:`Complete ${wizardTemplate.label}`,
        targetDate:addDays(isoDate(new Date()),30),
        minutes:60,
        level:'starting',
        keepOrder: false
      };
      wizardPlanStatus='';
      wizardPlanBusy=false;
      await saveSubjects();
      wizardStep='template-plan';
      render();
    });
  });

  const wizardPlanTemplateBtn=document.querySelector('[data-action="wizard-plan-template"]');
  if(wizardPlanTemplateBtn) wizardPlanTemplateBtn.addEventListener('click', async ()=>{
    if(wizardPlanBusy) return;

    const targetDate=document.getElementById('wizardPlanDate')?.value||'';
    const minutes=parseInt(document.getElementById('wizardPlanMinutes')?.value||'60',10);
    const level=document.getElementById('wizardPlanLevel')?.value||'starting';
    const goal=(document.getElementById('wizardPlanGoal')?.value||'').trim();

    if(!targetDate){
      wizardPlanStatus='Pick an end date first.';
      render();
      return;
    }
    if(targetDate < isoDate(new Date())){
      wizardPlanStatus='The end date needs to be today or later.';
      render();
      return;
    }

    studyPlannerDraft={goal,targetDate,minutes:Math.max(15,minutes),level};
    wizardPlanBusy=true;
    wizardPlanStatus='Estimating every topic and building your day-by-day sessions…';
    render();

    try{
      const wizardSubjects = subjects.filter(s=>wizardTargetSubjectIds.includes(s.id));
      if(!wizardSubjects.length){
        throw new Error('No new curriculum was selected for this setup.');
      }

      const result=await aiPlanTemplate(wizardSubjects,{
        ...studyPlannerDraft,
        startDate:isoDate(new Date())
      });

      const estimateItems=result.items||[];
      applyBundlePlan(wizardSubjects,estimateItems,{
        ...studyPlannerDraft,
        startDate:isoDate(new Date()),
        source:result.source
      });

      await saveSubjects();

      const lastDates=subjects.flatMap(s=>(s.curriculum||[]).map(x=>x.scheduledDate).filter(Boolean));
      const finish=lastDates.sort().pop();
      const missedDeadline=!!(finish && finish>targetDate);
      const deadlineNote=missedDeadline
        ? ` Your ${targetDate} deadline is tighter than the current daily-time budget; the plan currently finishes ${finish}. Increase daily study time or move the deadline if you want it to fit.`
        : ` It fits your ${targetDate} deadline.`;

      wizardPlanStatus=result.source==='ai'
        ? `Planned ${wizardSubjects.reduce((n,s)=>n+s.curriculum.length,0)} study sessions across ${wizardSubjects.length} subjects${finish?` through ${finish}`:''}.${deadlineNote}`
        : `AI was unavailable for part of the plan, so local estimates were used for those topics and split into sessions${finish?` through ${finish}`:''}.${deadlineNote}`;

      wizardStep='done';
    }catch(err){
      console.error('Setup planner failed unexpectedly:',err);
      wizardPlanStatus='The planner hit an unexpected error, so no plan was saved. You can try again or skip planning for now.';
    }finally{
      wizardPlanBusy=false;
      render();
    }
  });

  const wizardSkipPlanBtn=document.querySelector('[data-action="wizard-skip-template-plan"]');
  if(wizardSkipPlanBtn) wizardSkipPlanBtn.addEventListener('click', async ()=>{
    wizardPlanBusy=false;
    wizardPlanStatus='';
    await saveSubjects();
    wizardStep='done';
    render();
  });

  const wizToSubjectsBtn = document.querySelector('[data-action="wizard-to-subjects"]');
  if(wizToSubjectsBtn) wizToSubjectsBtn.addEventListener('click', ()=>{ wizardStep = 'subjects'; render(); });

  const wizToDoneBtn = document.querySelector('[data-action="wizard-to-done"]');
  if(wizToDoneBtn) wizToDoneBtn.addEventListener('click', ()=>{ wizardStep = 'done'; render(); });

  const wizFinishBtn = document.querySelector('[data-action="wizard-finish"]');
  if(wizFinishBtn) wizFinishBtn.addEventListener('click', async ()=>{
    settings.wizardDone = true;
    await saveSettings();
    wizardStep = null; wizardWorkoutChoice = null; wizardTargetSubjectIds = [];
    render();
  });

  document.getElementById('timerStart').onclick = toggleTimerStart;
  document.getElementById('timerReset').onclick = resetTimer;
  document.getElementById('timerClose').onclick = closeTimer;
  document.getElementById('minus10').onclick = ()=>adjustTimer(-10);
  document.getElementById('plus10').onclick = ()=>adjustTimer(10);

  /* real swipe gesture via touch events only \u2014 avoids ghost mouse-event duplication,
     and preventDefault on horizontal drags stops Android's edge-swipe-back gesture from hijacking it */
  const viewport = document.getElementById('swipeViewport');
  if(viewport){
    let startX = 0, startY = 0, dragging = false, horizontalLock = false;
    const track = document.getElementById('swipeTrack');
    viewport.addEventListener('touchstart', (e)=>{
      if(transitioning) return;
      const t = e.touches[0];
      startX = t.clientX; startY = t.clientY; dragging = true; horizontalLock = false;
      track.style.transition = 'none';
    }, {passive:true});
    viewport.addEventListener('touchmove', (e)=>{
      if(!dragging) return;
      const t = e.touches[0];
      const dx = t.clientX - startX; const dy = t.clientY - startY;
      if(!horizontalLock && Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy)) horizontalLock = true;
      if(horizontalLock){
        e.preventDefault();
        track.style.transform = `translateX(${dx}px)`;
      }
    }, {passive:false});
    const finishSwipe = (e)=>{
      if(!dragging) return;
      dragging = false;
      const t = e.changedTouches[0];
      const dx = t.clientX - startX;
      track.style.transition = 'transform 0.28s cubic-bezier(.2,.8,.2,1)';
      if(dx < -60 && !transitioning){
        transitioning = true;
        track.style.transform='translateX(-100%)';
        setTimeout(()=>goToDay(1), 160);
      } else if(dx > 60 && !transitioning){
        transitioning = true;
        track.style.transform='translateX(100%)';
        setTimeout(()=>goToDay(-1), 160);
      } else {
        track.style.transform='translateX(0)';
      }
    };
    viewport.addEventListener('touchend', finishSwipe);
    viewport.addEventListener('touchcancel', finishSwipe);
  }

  // Buddy's AI line refreshes on real progress actions, throttled by maybeRefreshAi()
  // (not on config/editing actions like adding exercises or scanning photos)
  document.querySelectorAll(
    '[data-action="task"],[data-action="noworkout"],[data-action="water-plus"],[data-action="water-minus"],' +
    '[data-action="studydone"],[data-action="studyextra"],[data-action="extra-toggle"],' +
    '[data-action="tracker-counter-plus"],[data-action="tracker-counter-minus"],[data-action="tracker-item-toggle"]'
  ).forEach(el=>{
    el.addEventListener('click', ()=> maybeRefreshAi());
  });
}

let lastFiredDate = null;
function scheduleReminderCheck(){
  setInterval(async ()=>{
    const r = await loadReminder();
    if(!r || !r.enabled) return;
    const now = new Date();
    const hh = now.getHours().toString().padStart(2,'0');
    const mm = now.getMinutes().toString().padStart(2,'0');
    const current = `${hh}:${mm}`;
    const todayIso = isoDate(now);
    if(current === r.time && lastFiredDate !== todayIso){
      lastFiredDate = todayIso;
      if('Notification' in window && Notification.permission === 'granted'){
        new Notification('Daily Rhythm', { body: "Time to train \u2014 today's list is waiting.", icon: 'icon.svg' });
      }
    }
  }, 20000);
}

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}

function initTabSwipe(){
  const app = document.getElementById('app');
  if(!app) return;
  let startX=0, startY=0, startTarget=null;
  app.addEventListener('touchstart', (e)=>{
    if(e.touches.length!==1) return;
    startX=e.touches[0].clientX; startY=e.touches[0].clientY; startTarget=e.target;
  }, {passive:true});
  app.addEventListener('touchend', (e)=>{
    if(!startTarget) return;
    const target = startTarget; startTarget=null;
    // don't hijack the Workout day-swipe-deck's own gesture, and don't switch tabs while any overlay is open
    if(target.closest && target.closest('.swipe-viewport')) return;
    if(settingsOpen || wizardStep || studyOverlay) return;
    const dx = e.changedTouches[0].clientX - startX;
    const dy = e.changedTouches[0].clientY - startY;
    if(Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy)*1.5) return; // require a real horizontal swipe, not a vertical scroll
    const order = ['home', 'workout', 'study', 'calendar', 'plus'];
    const idx = order.indexOf(activeTab);
    if(idx===-1) return;
    if(dx < 0 && idx < order.length-1){
      window.__tabSwipeDirection = 'left';
      activeTab = order[idx+1];
      render();
    } else if(dx > 0 && idx > 0){
      window.__tabSwipeDirection = 'right';
      activeTab = order[idx-1];
      render();
    }
  }, {passive:true});
}

(async ()=>{
  await loadEntries(); await loadTaskOverrides(); await loadCustomTrackers();
  await loadSettings(); await loadSavedMeals(); await loadSubjects(); await loadAiSummaryCache(); await loadAiUsage(); await loadStudyNotes();
  const normalizedChanged = normalizeCurriculumData();
  if(normalizedChanged) await saveSubjects();
  if(!settings.wizardDone && subjects.length === 0) wizardStep = 'intro'; // truly new user — auto-show; otherwise it only opens via Settings
  await render();
  initTabSwipe();
  setTimeout(()=>document.getElementById('launch')?.classList.add('out'), 900);
  scheduleReminderCheck();
})();
</script>
