<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Daily Rhythm">
<title>Daily Rhythm</title>
<style>
:root{
  --bg:#f5f6f8;
  --card:#ffffff;
  --text:#17191d;
  --muted:#6b7078;
  --line:#e6e8ec;
  --accent:#111318;
  --accent-soft:#eef0f3;
  --green:#1f9d55;
  --red:#d64545;
  --yellow:#e3a008;
  --blue:#3878e8;
  --shadow:0 8px 24px rgba(0,0,0,.06);
  --radius:18px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
body{overflow-x:hidden}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.app{min-height:100vh}
.topbar{
  position:sticky;
  top:0;
  z-index:50;
  height:64px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  background:rgba(245,246,248,.92);
  backdrop-filter:blur(18px);
  border-bottom:1px solid var(--line);
}
.brand{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:800;
  letter-spacing:-.4px;
}
.brand-mark{
  width:34px;
  height:34px;
  border-radius:11px;
  display:grid;
  place-items:center;
  background:#111318;
  color:#fff;
  font-size:17px;
}
.top-actions{display:flex;align-items:center;gap:8px}
.icon-btn{
  width:40px;
  height:40px;
  border:1px solid var(--line);
  background:var(--card);
  border-radius:12px;
  display:grid;
  place-items:center;
  color:var(--text);
}
.main{
  width:min(1120px,calc(100% - 28px));
  margin:0 auto;
  padding:24px 0 110px;
}
.page{display:none}
.page.active{display:block}
h1,h2,h3,p{margin-top:0}
h1{font-size:32px;line-height:1.1;margin-bottom:8px;letter-spacing:-1px}
h2{font-size:22px;line-height:1.2;margin-bottom:14px;letter-spacing:-.4px}
h3{font-size:16px;margin-bottom:8px}
.subtitle{color:var(--muted);font-size:14px;line-height:1.5}
.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
}
.section{margin-top:20px}
.section-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:12px;
}
.btn{
  border:0;
  border-radius:12px;
  padding:11px 15px;
  font-weight:700;
  transition:.18s ease;
}
.btn:active{transform:scale(.98)}
.btn-primary{background:#111318;color:#fff}
.btn-secondary{background:#eef0f3;color:#17191d}
.btn-danger{background:#fcecec;color:#b72f2f}
.btn-small{padding:8px 11px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
input,textarea,select{
  width:100%;
  border:1px solid var(--line);
  background:#fff;
  color:var(--text);
  border-radius:12px;
  padding:11px 12px;
  outline:none;
}
input:focus,textarea:focus,select:focus{border-color:#aeb3bb;box-shadow:0 0 0 3px rgba(17,19,24,.06)}
textarea{resize:vertical;min-height:90px}
label{font-size:13px;font-weight:700;display:block;margin-bottom:7px}
.field{margin-bottom:14px}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.empty{
  padding:28px 18px;
  text-align:center;
  color:var(--muted);
}
.muted{color:var(--muted)}
.badge{
  display:inline-flex;
  align-items:center;
  gap:5px;
  border-radius:999px;
  padding:5px 9px;
  font-size:11px;
  font-weight:800;
  background:#eef0f3;
}
.badge.green{background:#e8f7ee;color:#187a43}
.badge.red{background:#fcecec;color:#b72f2f}
.badge.blue{background:#eaf1ff;color:#2d64c8}
.badge.yellow{background:#fff5dc;color:#9b6a00}
.progress{
  height:8px;
  border-radius:999px;
  background:#eceef1;
  overflow:hidden;
}
.progress > div{
  height:100%;
  border-radius:inherit;
  background:#111318;
}
.stat-grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:12px;
}
.stat{
  padding:16px;
  border:1px solid var(--line);
  border-radius:16px;
  background:var(--card);
}
.stat-value{font-size:26px;font-weight:850;letter-spacing:-.8px}
.stat-label{font-size:12px;color:var(--muted);margin-top:3px}
.day-strip{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:4px 2px 8px;
  scrollbar-width:none;
}
.day-strip::-webkit-scrollbar{display:none}
.day{
  min-width:76px;
  border:1px solid var(--line);
  background:var(--card);
  border-radius:14px;
  padding:10px 8px;
  text-align:center;
}
.day.selected{background:#111318;color:#fff;border-color:#111318}
.day.locked{opacity:.55}
.day-name{font-size:11px;font-weight:800;text-transform:uppercase}
.day-date{font-size:18px;font-weight:850;margin-top:2px}
.day-dot{
  width:5px;height:5px;border-radius:50%;
  background:#bfc3ca;margin:5px auto 0;
}
.day.selected .day-dot{background:#fff}
.task-list{display:flex;flex-direction:column;gap:8px}
.task-row{
  display:flex;
  align-items:center;
  gap:12px;
  padding:13px;
  border:1px solid var(--line);
  border-radius:14px;
  background:#fff;
}
.checkbox{
  width:21px;height:21px;
  border-radius:7px;
  border:1.5px solid #c7cad0;
  flex:0 0 auto;
  display:grid;
  place-items:center;
}
.checkbox.checked{background:#111318;border-color:#111318;color:#fff}
.checkbox.checked:after{content:"✓";font-size:13px;font-weight:900}
.task-label{flex:1;min-width:0;font-size:14px;font-weight:650}
.task-meta{font-size:11px;color:var(--muted);margin-top:2px}
.task-actions{display:flex;gap:6px}
.icon-mini{
  width:32px;height:32px;border-radius:10px;
  border:1px solid var(--line);background:#fff;
  display:grid;place-items:center;
}
.lock-banner{
  display:flex;
  align-items:center;
  gap:8px;
  padding:10px 12px;
  background:#f1f2f4;
  border:1px solid var(--line);
  color:#6b7078;
  border-radius:12px;
  font-size:12px;
  margin-bottom:10px;
}
.locked-content{opacity:.62;pointer-events:none}
.hero{
  padding:24px;
  background:linear-gradient(145deg,#111318,#272a31);
  color:#fff;
  border-radius:24px;
  box-shadow:0 14px 32px rgba(0,0,0,.14);
}
.hero .subtitle{color:#c8cbd1}
.hero-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.hero .btn-secondary{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.12)}
.home-grid{
  display:grid;
  grid-template-columns:minmax(0,1.25fr) minmax(300px,.75fr);
  gap:16px;
}
.home-focus-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
  margin-top:16px;
}
.home-focus-box{
  min-height:126px;
  border:1px solid var(--line);
  background:var(--card);
  border-radius:20px;
  padding:17px;
  text-align:left;
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:12px;
  box-shadow:var(--shadow);
  transition:.18s ease;
}
.home-focus-box:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(0,0,0,.08)}
.home-focus-icon{font-size:25px;margin-bottom:8px}
.home-focus-title{font-size:17px;font-weight:850;letter-spacing:-.3px}
.home-focus-sub{font-size:12px;color:var(--muted);line-height:1.45;margin-top:4px}
.home-focus-arrow{
  width:34px;height:34px;border-radius:11px;
  background:#111318;color:#fff;
  display:grid;place-items:center;
  flex:0 0 auto;
}
.home-focus-box.workout .home-focus-arrow{background:#2b6de0}
.home-focus-box.study .home-focus-arrow{background:#111318}
.focus-overlay{
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(10,11,14,.58);
  backdrop-filter:blur(12px);
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
}
.focus-overlay.open{display:flex}
.focus-shell{
  width:min(520px,100%);
  max-height:calc(100vh - 36px);
  display:flex;
  flex-direction:column;
  gap:12px;
}
.focus-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  color:#fff;
}
.focus-mode{
  font-size:12px;
  font-weight:850;
  text-transform:uppercase;
  letter-spacing:.8px;
  opacity:.85;
}
.focus-clock{
  font-variant-numeric:tabular-nums;
  font-size:15px;
  font-weight:800;
}
.focus-close{
  width:38px;height:38px;border-radius:12px;
  border:1px solid rgba(255,255,255,.2);
  background:rgba(255,255,255,.1);
  color:#fff;
}
.focus-card{
  position:relative;
  overflow:hidden;
  min-height:330px;
  background:#fff;
  border-radius:28px;
  padding:28px;
  box-shadow:0 24px 70px rgba(0,0,0,.24);
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  touch-action:pan-y;
  user-select:none;
  transition:transform .16s ease,opacity .16s ease;
}
.focus-card.swipe-left{transform:translateX(-120%) rotate(-7deg);opacity:0}
.focus-card.swipe-right{transform:translateX(120%) rotate(7deg);opacity:0}
.focus-card-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.focus-card-label{
  font-size:29px;
  line-height:1.12;
  font-weight:900;
  letter-spacing:-1px;
  margin:30px 0 10px;
}
.focus-card-meta{font-size:13px;color:var(--muted)}
.focus-swipe-hint{
  text-align:center;
  color:#858a92;
  font-size:12px;
  margin-top:20px;
}
.focus-actions{
  display:grid;
  grid-template-columns:1fr 1.35fr;
  gap:10px;
  margin-top:18px;
}
.focus-skip{
  background:#f0f1f3;
  color:#34373d;
  border:1px solid #e1e3e7;
}
.focus-complete{
  background:#111318;
  color:#fff;
  border:1px solid #111318;
  font-weight:850;
  min-height:48px;
}
.focus-empty{
  min-height:280px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  background:#fff;
  border-radius:28px;
  padding:28px;
  box-shadow:0 24px 70px rgba(0,0,0,.24);
}
.focus-empty-icon{font-size:42px;margin-bottom:10px}
.focus-empty-title{font-size:25px;font-weight:900}
.focus-empty-sub{font-size:13px;color:var(--muted);margin-top:6px}
.session-summary{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:10px;
  margin-top:14px;
}
.session-summary-card{
  padding:13px;
  border:1px solid var(--line);
  border-radius:14px;
  background:#fff;
}
.session-summary-value{font-size:19px;font-weight:850}
.session-summary-label{font-size:11px;color:var(--muted);margin-top:3px}
.session-history-list{display:flex;flex-direction:column;gap:9px}
.session-history-item{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:13px 14px;
  border:1px solid var(--line);
  border-radius:14px;
  background:#fff;
}
.session-history-main{min-width:0}
.session-history-title{font-weight:800;font-size:14px}
.session-history-meta{font-size:11px;color:var(--muted);margin-top:3px}
.session-history-time{font-weight:850;font-variant-numeric:tabular-nums;white-space:nowrap}
.nav{
  position:fixed;
  left:0;right:0;bottom:0;
  z-index:60;
  display:flex;
  justify-content:center;
  background:rgba(255,255,255,.94);
  backdrop-filter:blur(18px);
  border-top:1px solid var(--line);
  padding:8px 8px calc(8px + env(safe-area-inset-bottom));
}
.nav-inner{
  width:min(700px,100%);
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:5px;
}
.nav-btn{
  border:0;
  background:transparent;
  color:#858a92;
  border-radius:12px;
  min-height:48px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
  font-size:10px;
  font-weight:750;
}
.nav-btn.active{color:#111318;background:#f0f1f3}
.nav-icon{font-size:18px;line-height:1}
.modal-backdrop{
  position:fixed;
  inset:0;
  z-index:90;
  background:rgba(10,11,14,.45);
  backdrop-filter:blur(8px);
  display:none;
  align-items:flex-end;
  justify-content:center;
  padding:12px;
}
.modal-backdrop.open{display:flex}
.modal{
  width:min(640px,100%);
  max-height:88vh;
  overflow:auto;
  background:#fff;
  border-radius:24px;
  padding:20px;
  box-shadow:0 24px 60px rgba(0,0,0,.22);
}
.modal-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:16px;
}
.modal-title{font-size:20px;font-weight:850}
.close-btn{
  width:36px;height:36px;border:1px solid var(--line);
  background:#fff;border-radius:11px;
}
.toast{
  position:fixed;
  left:50%;
  bottom:82px;
  transform:translateX(-50%) translateY(12px);
  z-index:150;
  opacity:0;
  pointer-events:none;
  background:#111318;
  color:#fff;
  border-radius:12px;
  padding:10px 14px;
  font-size:12px;
  font-weight:700;
  transition:.2s ease;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.calendar{
  border:1px solid var(--line);
  border-radius:18px;
  overflow:hidden;
  background:#fff;
}
.calendar-head{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  background:#f6f7f8;
  border-bottom:1px solid var(--line);
}
.calendar-head div{
  text-align:center;
  padding:10px 3px;
  font-size:11px;
  font-weight:800;
  color:var(--muted);
}
.calendar-grid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
}
.cal-day{
  min-height:92px;
  padding:8px;
  border-right:1px solid var(--line);
  border-bottom:1px solid var(--line);
  cursor:pointer;
  position:relative;
}
.cal-day:nth-child(7n){border-right:0}
.cal-day-num{font-size:12px;font-weight:800}
.cal-day.muted-day{opacity:.35}
.cal-day.today .cal-day-num{
  width:25px;height:25px;border-radius:50%;
  background:#111318;color:#fff;
  display:grid;place-items:center;
}
.cal-markers{display:flex;flex-direction:column;gap:3px;margin-top:6px}
.cal-marker{
  font-size:9px;
  padding:3px 4px;
  border-radius:5px;
  background:#eef0f3;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.settings-list{display:flex;flex-direction:column;gap:10px}
.settings-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:14px;
  border:1px solid var(--line);
  border-radius:14px;
}
.settings-label{font-weight:750;font-size:14px}
.settings-sub{font-size:11px;color:var(--muted);margin-top:3px}
.switch{
  width:48px;height:28px;border-radius:999px;
  border:0;background:#dfe2e6;padding:3px;
}
.switch:after{
  content:"";display:block;width:22px;height:22px;border-radius:50%;
  background:#fff;transition:.18s ease;box-shadow:0 1px 3px rgba(0,0,0,.16);
}
.switch.on{background:#111318}
.switch.on:after{transform:translateX(20px)}
.appearance-options{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:14px;
  margin-top:14px;
}
.appearance-option{
  min-width:0;
  padding:15px;
  border:1px solid var(--line);
  border-radius:16px;
  background:#fff;
  cursor:pointer;
}
.appearance-option.selected{border-color:#111318;box-shadow:0 0 0 2px rgba(17,19,24,.08)}
.appearance-preview{
  height:68px;
  border-radius:12px;
  margin-bottom:11px;
  border:1px solid var(--line);
}
.appearance-preview.light{background:#f5f6f8}
.appearance-preview.dark{background:#17191d}
.appearance-preview.system{background:linear-gradient(90deg,#f5f6f8 50%,#17191d 50%)}
.manual-due-row{
  display:flex;
  align-items:center;
  gap:9px;
  margin:8px 0 12px;
  padding:10px 11px;
  border:1px solid var(--line);
  border-radius:12px;
  background:#fafafa;
}
.manual-due-row input{width:auto;margin:0}
.manual-topic-due-date{margin-top:8px}
@media(max-width:760px){
  .main{width:min(100% - 20px,1120px);padding-top:18px}
  .home-grid{grid-template-columns:1fr}
  .stat-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid-3{grid-template-columns:1fr}
  .cal-day{min-height:72px;padding:6px}
  .cal-marker{display:none}
}
@media(max-width:520px){
  h1{font-size:28px}
  .topbar{padding:0 12px}
  .home-focus-grid{grid-template-columns:1fr}
  .focus-card{min-height:310px;padding:23px}
  .focus-card-label{font-size:25px}
  .session-summary{grid-template-columns:1fr}
  .grid-2{grid-template-columns:1fr}
  .appearance-options{grid-template-columns:1fr 1fr;gap:10px}
}
@media(max-width:390px){
  .appearance-options{grid-template-columns:1fr;gap:12px}
  .appearance-option{padding:14px}
  .appearance-preview{height:72px}
}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
  <div class="brand">
    <div class="brand-mark">R</div>
    <div>Daily Rhythm</div>
  </div>
  <div class="top-actions">
    <button class="icon-btn" data-action="open-settings" aria-label="Settings">⚙</button>
  </div>
</header>

<main class="main">
  <section id="page-home" class="page active"></section>
  <section id="page-study" class="page"></section>
  <section id="page-workout" class="page"></section>
  <section id="page-calendar" class="page"></section>
  <section id="page-settings" class="page"></section>
</main>

<nav class="nav">
  <div class="nav-inner">
    <button class="nav-btn active" data-nav="home"><span class="nav-icon">⌂</span><span>Home</span></button>
    <button class="nav-btn" data-nav="study"><span class="nav-icon">📚</span><span>Study</span></button>
    <button class="nav-btn" data-nav="workout"><span class="nav-icon">◉</span><span>Workout</span></button>
    <button class="nav-btn" data-nav="calendar"><span class="nav-icon">▦</span><span>Calendar</span></button>
    <button class="nav-btn" data-nav="settings"><span class="nav-icon">⚙</span><span>Settings</span></button>
  </div>
</nav>

<div id="focusOverlay" class="focus-overlay"></div>
<div id="modalBackdrop" class="modal-backdrop"></div>
<div id="toast" class="toast"></div>
</div>

<script>
'use strict';

const STORAGE_KEYS = {
  settings:'dailyRhythm.settings',
  entries:'dailyRhythm.entries',
  subjects:'dailyRhythm.subjects',
  workout:'dailyRhythm.workout',
  notes:'dailyRhythm.notes',
  app:'dailyRhythm.app'
};

const defaultSettings = {
  workoutEnabled:true,
  appearance:'system',
  startDay:1,
  weekStartsMonday:true
};

let settings = load(STORAGE_KEYS.settings, defaultSettings);
let entries = load(STORAGE_KEYS.entries, {});
let subjects = load(STORAGE_KEYS.subjects, []);
let workout = load(STORAGE_KEYS.workout, {
  tasks:[],
  weekPlan:{}
});
let notes = load(STORAGE_KEYS.notes, {});
let appState = load(STORAGE_KEYS.app, {
  currentPage:'home',
  selectedDate:isoDate(new Date()),
  calendarMonth:new Date().getMonth(),
  calendarYear:new Date().getFullYear()
});

let focusState = {
  mode:null,
  queue:[],
  current:null,
  startedAt:0,
  elapsed:0,
  running:false,
  interval:null,
  swipeBusy:false
};

function load(key,fallback){
  try{
    const raw=localStorage.getItem(key);
    return raw ? JSON.parse(raw) : structuredClone(fallback);
  }catch(e){
    return structuredClone(fallback);
  }
}

function save(key,value){
  localStorage.setItem(key,JSON.stringify(value));
}

function isoDate(date){
  const d=new Date(date);
  const y=d.getFullYear();
  const m=String(d.getMonth()+1).padStart(2,'0');
  const day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

function dateFromIso(iso){
  const [y,m,d]=String(iso).split('-').map(Number);
  return new Date(y,m-1,d);
}

function addDays(dateOrIso,amount){
  const d=typeof dateOrIso==='string'?dateFromIso(dateOrIso):new Date(dateOrIso);
  d.setDate(d.getDate()+amount);
  return isoDate(d);
}

function isPastDate(iso){
  return !!iso && iso < isoDate(new Date());
}

function fmtTime(seconds){
  seconds=Math.max(0,Math.floor(Number(seconds)||0));
  const h=Math.floor(seconds/3600);
  const m=Math.floor((seconds%3600)/60);
  const s=seconds%60;
  if(h) return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function fmtDate(iso){
  const d=dateFromIso(iso);
  return d.toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'});
}

function fmtShortDate(iso){
  const d=dateFromIso(iso);
  return d.toLocaleDateString(undefined,{day:'numeric',month:'short'});
}

function weekdayIndex(iso){
  return dateFromIso(iso).getDay();
}

function escapeHtml(value){
  return String(value??'')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');
}

function uid(prefix='id'){
  return prefix+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8);
}

function ensureTodayEntry(){
  const today=isoDate(new Date());
  if(!entries[today]) entries[today]={tasks:{}};
  if(!entries[today].tasks) entries[today].tasks={};
  return entries[today];
}

function getEntry(iso){
  return entries[iso]||{tasks:{}};
}

function getTasksForDow(dow){
  const ids=Array.isArray(workout.weekPlan?.[dow]) ? workout.weekPlan[dow] : [];
  const byId=new Map((workout.tasks||[]).map(t=>[t.id,t]));
  return ids.map(id=>byId.get(id)).filter(Boolean);
}

function getAllWorkoutTasks(){
  return Array.isArray(workout.tasks)?workout.tasks:[];
}

function getStudyMinutesForToday(){
  let total=0;
  const today=isoDate(new Date());
  subjects.forEach(subj=>{
    const curriculum=Array.isArray(subj.curriculum)?subj.curriculum:[];
    curriculum.forEach(item=>{
      if(item && item.scheduledDate===today && item.isStudySession){
        total+=Number(item.sessionMinutes)||0;
      }
    });
  });
  return total;
}

function getCompletedStudyCountToday(){
  const today=isoDate(new Date());
  let count=0;
  subjects.forEach(subj=>{
    (subj.curriculum||[]).forEach(item=>{
      if(item && item.focusDoneDates?.[today]) count++;
    });
  });
  return count;
}

function getTodayWorkoutCompletedCount(){
  const e=getEntry(isoDate(new Date()));
  return getTasksForDow(weekdayIndex(isoDate(new Date()))).filter(t=>e.tasks?.[t.id]).length;
}

function getTodayWorkoutTotal(){
  if(settings.workoutEnabled===false) return 0;
  const today=isoDate(new Date());
  const e=getEntry(today);
  if(e.noWorkout) return 0;
  return getTasksForDow(weekdayIndex(today)).length;
}

function getFocusWorkoutQueue(){
  const today=isoDate(new Date());
  const e=entries[today]||{};
  if(settings.workoutEnabled===false || e.noWorkout) return [];
  return getTasksForDow(weekdayIndex(today))
    .filter(t=>!(e.tasks&&e.tasks[t.id]))
    .map(t=>({
      type:'workout',
      id:t.id,
      label:t.label,
      meta:t.sets||'Workout task',
      taskId:t.id
    }));
}

function getFocusStudyQueue(){
  const today=isoDate(new Date());
  const queue=[];
  subjects.forEach(subj=>{
    const start=Math.max(0,Number(subj.index)||0);
    const curriculum=Array.isArray(subj.curriculum)?subj.curriculum:[];
    const pending=curriculum.slice(start);
    const todays=pending.filter(item=>item&&item.scheduledDate===today&&item.isStudySession&&!item.focusDoneDates?.[today]);
    const generated=pending.some(item=>item&&item.isStudySession);
    const source=todays.length
      ? todays
      : (!generated && pending[0] && !pending[0].focusDoneDates?.[today] ? [pending[0]] : []);
    source.forEach(item=>{
      queue.push({
        type:'study',
        id:item.id,
        label:item.baseLabel||item.label||'Study topic',
        meta:item.isStudySession
          ? `Session ${item.sessionNumber||1}/${item.sessionTotal||1} · ${Number(item.sessionMinutes)||0} min`
          : (item.phase||'Study topic'),
        subjectId:subj.id,
        curriculumId:item.id
      });
    });
  });
  return queue;
}

function getFocusQueue(mode){
  return mode==='study' ? getFocusStudyQueue() : getFocusWorkoutQueue();
}

function focusNow(){
  return Math.max(0,Math.floor((Date.now()-focusState.startedAt)/1000));
}

function focusUpdateClock(){
  if(!focusState.running) return;
  focusState.elapsed=focusNow();
  const el=document.getElementById('focusElapsed');
  if(el) el.textContent=fmtTime(focusState.elapsed);
}

function stopFocusClock(){
  clearInterval(focusState.interval);
  focusState.interval=null;
  if(focusState.running) focusState.elapsed=focusNow();
  focusState.running=false;
}

function startFocusClock(){
  if(focusState.running) return;
  focusState.startedAt=Date.now()-(focusState.elapsed*1000);
  focusState.running=true;
  focusUpdateClock();
  clearInterval(focusState.interval);
  focusState.interval=setInterval(focusUpdateClock,1000);
}

function beep(){
  try{
    const Ctx=window.AudioContext||window.webkitAudioContext;
    if(!Ctx) return;
    const ctx=new Ctx();
    const osc=ctx.createOscillator();
    const gain=ctx.createGain();
    osc.frequency.value=720;
    gain.gain.value=.045;
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime+.12);
  }catch(e){}
}

function beginFocus(mode){
  stopFocusClock();
  focusState={
    mode,
    queue:getFocusQueue(mode),
    current:null,
    startedAt:Date.now(),
    elapsed:0,
    running:false,
    interval:null,
    swipeBusy:false
  };
  focusState.current=focusState.queue.shift()||null;
  startFocusClock();
  render();
  refreshFocusOverlay();
}

function closeFocus(){
  stopFocusClock();
  focusState={
    mode:null,
    queue:[],
    current:null,
    startedAt:0,
    elapsed:0,
    running:false,
    interval:null,
    swipeBusy:false
  };
  const overlay=document.getElementById('focusOverlay');
  if(overlay) overlay.classList.remove('open');
  render();
}

function refreshFocusOverlay(){
  const overlay=document.getElementById('focusOverlay');
  if(!overlay) return;

  if(!focusState.mode){
    overlay.classList.remove('open');
    overlay.innerHTML='';
    return;
  }

  overlay.classList.add('open');

  if(!focusState.current){
    overlay.innerHTML=`
      <div class="focus-shell">
        <div class="focus-top">
          <div>
            <div class="focus-mode">${focusState.mode==='study'?'Study':'Workout'} session</div>
            <div class="focus-clock">${fmtTime(focusState.elapsed)}</div>
          </div>
          <button class="focus-close" data-action="close-focus">✕</button>
        </div>
        <div class="focus-empty">
          <div class="focus-empty-icon">✓</div>
          <div class="focus-empty-title">All done.</div>
          <div class="focus-empty-sub">Nothing else is pending in this session.</div>
          <button class="btn btn-primary" style="margin-top:18px" data-action="close-focus">Finish session</button>
        </div>
      </div>`;
    bindFocusEvents();
    return;
  }

  const item=focusState.current;
  overlay.innerHTML=`
    <div class="focus-shell">
      <div class="focus-top">
        <div>
          <div class="focus-mode">${focusState.mode==='study'?'Study':'Workout'} session</div>
          <div class="focus-clock" id="focusElapsed">${fmtTime(focusState.elapsed)}</div>
        </div>
        <button class="focus-close" data-action="close-focus">✕</button>
      </div>

      <div class="focus-card" id="focusCard">
        <div>
          <div class="focus-card-top">
            <span class="badge ${item.type==='study'?'blue':'green'}">${item.type==='study'?'Study':'Workout'}</span>
            <span class="badge">${focusState.queue.length+1} left</span>
          </div>

          <div class="focus-card-label">${escapeHtml(item.label)}</div>
          <div class="focus-card-meta">${escapeHtml(item.meta||'')}</div>
        </div>

        <div>
          <div class="focus-swipe-hint">← Swipe left to skip · Swipe right to complete →</div>
          <div class="focus-actions">
            <button class="btn focus-skip" data-action="focus-skip">Skip</button>
            <button class="btn focus-complete" data-action="focus-complete">✓ Complete</button>
          </div>
        </div>
      </div>
    </div>`;

  bindFocusEvents();
}

function bindFocusEvents(){
  document.querySelectorAll('[data-action="close-focus"]').forEach(el=>{
    el.addEventListener('click',closeFocus);
  });
  document.querySelectorAll('[data-action="focus-skip"]').forEach(el=>{
    el.addEventListener('click',focusSkipCurrent);
  });
  document.querySelectorAll('[data-action="focus-complete"]').forEach(el=>{
    el.addEventListener('click',focusFinishCurrent);
  });

  const card=document.getElementById('focusCard');
  if(!card) return;

  let startX=0;
  let startY=0;
  let dragging=false;

  card.addEventListener('touchstart',e=>{
    if(focusState.swipeBusy) return;
    const t=e.changedTouches[0];
    startX=t.clientX;
    startY=t.clientY;
    dragging=true;
  },{passive:true});

  card.addEventListener('touchend',e=>{
    if(!dragging || focusState.swipeBusy) return;
    dragging=false;
    const t=e.changedTouches[0];
    const dx=t.clientX-startX;
    const dy=t.clientY-startY;
    if(Math.abs(dx)>70 && Math.abs(dx)>Math.abs(dy)*1.2){
      if(dx<0) focusSkipCurrent();
      else focusFinishCurrent();
    }
  },{passive:true});

  card.addEventListener('pointerdown',e=>{
    if(e.pointerType==='touch' || focusState.swipeBusy) return;
    startX=e.clientX;
    startY=e.clientY;
    dragging=true;
  });
  card.addEventListener('pointerup',e=>{
    if(!dragging || focusState.swipeBusy) return;
    dragging=false;
    const dx=e.clientX-startX;
    const dy=e.clientY-startY;
    if(Math.abs(dx)>90 && Math.abs(dx)>Math.abs(dy)*1.2){
      if(dx<0) focusSkipCurrent();
      else focusFinishCurrent();
    }
  });
}

async function completeFocusItem(item){
  const today=isoDate(new Date());

  if(item.type==='workout'){
    if(!entries[today]) entries[today]={tasks:{}};
    if(!entries[today].tasks) entries[today].tasks={};
    entries[today].tasks[item.taskId]=true;
    await saveEntries();
    patchEntryUI(today);
    return;
  }

  const subj=subjects.find(s=>s.id===item.subjectId);
  if(!subj) return;

  const curriculum=Array.isArray(subj.curriculum)?subj.curriculum:[];
  const target=curriculum.find(x=>x.id===item.curriculumId);
  if(target){
    if(!target.focusDoneDates) target.focusDoneDates={};
    target.focusDoneDates[today]=true;
  }

  let idx=Math.max(0,Number(subj.index)||0);
  while(idx<curriculum.length && curriculum[idx]?.focusDoneDates?.[today]){
    idx++;
  }
  subj.index=idx;

  if(!entries[today]) entries[today]={tasks:{}};
  if(!entries[today].study) entries[today].study={};
  if(!entries[today].study[item.subjectId]) entries[today].study[item.subjectId]={};
  entries[today].study[item.subjectId][item.curriculumId]=true;

  await saveEntries();
  save(STORAGE_KEYS.subjects,subjects);
  patchStudyUI(item.subjectId);
}

async function focusFinishCurrent(){
  if(!focusState.current || focusState.swipeBusy) return;

  focusState.swipeBusy=true;
  const item=focusState.current;
  const card=document.getElementById('focusCard');
  if(card) card.classList.add('swipe-right');

  await new Promise(r=>setTimeout(r,160));
  await completeFocusItem(item);

  focusState.current=focusState.queue.shift()||null;
  focusState.swipeBusy=false;

  if(!focusState.current){
    stopFocusClock();
    beep();
  }

  refreshFocusOverlay();
}

async function focusSkipCurrent(){
  if(!focusState.current || focusState.swipeBusy) return;

  focusState.swipeBusy=true;
  const card=document.getElementById('focusCard');
  if(card) card.classList.add('swipe-left');

  const item=focusState.current;
  const today=isoDate(new Date());

  if(!entries[today]) entries[today]={tasks:{}};

  if(item.type==='workout'){
    if(!entries[today].focusSkippedWorkoutIds) entries[today].focusSkippedWorkoutIds=[];
    if(!entries[today].focusSkippedWorkoutIds.includes(item.taskId)){
      entries[today].focusSkippedWorkoutIds.push(item.taskId);
    }
  }else{
    if(!entries[today].focusSkippedStudyIds) entries[today].focusSkippedStudyIds=[];
    const marker={
      subjectId:item.subjectId,
      curriculumId:item.curriculumId
    };
    if(!entries[today].focusSkippedStudyIds.some(x=>
      x.subjectId===marker.subjectId &&
      x.curriculumId===marker.curriculumId
    )){
      entries[today].focusSkippedStudyIds.push(marker);
    }
  }

  if(!entries[today].focusUntitled) entries[today].focusUntitled=[];
  entries[today].focusUntitled.push({
    mode:item.type,
    subjectId:item.subjectId||null,
    curriculumId:item.curriculumId||null,
    taskId:item.taskId||null
  });

  await saveEntries();

  setTimeout(()=>{
    focusState.current=focusState.queue.shift()||null;
    focusState.swipeBusy=false;

    if(!focusState.current){
      stopFocusClock();
      beep();
    }

    refreshFocusOverlay();
    patchEntryUI(today);
  },160);
}

function recordFocusSession(){
  const duration=Math.max(0,Math.floor(Number(focusState.elapsed)||0));
  if(duration<1 || !focusState.mode) return;

  const now=new Date();
  const date=isoDate(now);
  const history=getSessionHistory();

  history.push({
    id:uid('session'),
    date,
    mode:focusState.mode,
    duration,
    startedAtLabel:new Date(Date.now()-duration*1000).toLocaleTimeString([],{
      hour:'numeric',
      minute:'2-digit'
    }),
    endedAtLabel:now.toLocaleTimeString([],{
      hour:'numeric',
      minute:'2-digit'
    })
  });

  saveSessionHistory(history);
}

function buildStudySessions(items,startDate,dailyMinutes,targetDate,useIndividualDueDates=false){
  const sessions=[];
  let cursor=startDate;
  let remainingMinutes=Math.max(1,Number(dailyMinutes)||1);

  items.forEach((item,itemIndex)=>{
    const topicMinutes=Math.max(
      15,
      Number(item.estimatedMinutes)||30
    );

    let remaining=topicMinutes;
    let sessionNumber=1;
    const sessionTotal=Math.max(1,Math.ceil(topicMinutes/dailyMinutes));

    while(remaining>0){
      const minutes=Math.min(remaining,dailyMinutes);
      const dueDate=useIndividualDueDates
        ? (items[itemIndex].manualDueDate||null)
        : targetDate;

      sessions.push({
        id:uid('studySession'),
        label:item.baseLabel||item.label||'Study topic',
        baseLabel:item.baseLabel||item.label||'Study topic',
        phase:item.phase||'Study',
        generatedPlannerSession:true,
        isStudySession:true,
        scheduledDate:cursor,
        sessionNumber,
        sessionTotal,
        sessionMinutes:minutes,
        dueDate,
        isOverDeadline:!!dueDate && cursor>dueDate,
        sourceTopicId:item.id,
        focusDoneDates:{}
      });

      remaining-=minutes;
      sessionNumber++;

      if(remaining>0){
        cursor=addDays(cursor,1);
        remainingMinutes=dailyMinutes;
      }else{
        remainingMinutes-=minutes;
        if(remainingMinutes<=0){
          cursor=addDays(cursor,1);
          remainingMinutes=dailyMinutes;
        }
      }
    }
  });

  return sessions;
}

function summarizeStudyPlan(subj){
  const curriculum=Array.isArray(subj.curriculum)?subj.curriculum:[];
  const sessions=curriculum.filter(x=>x?.isStudySession);
  if(!sessions.length) return 'No generated sessions.';

  const totalMinutes=sessions.reduce((a,x)=>a+(Number(x.sessionMinutes)||0),0);
  const dates=sessions.map(x=>x.scheduledDate).filter(Boolean).sort();
  const first=dates[0];
  const last=dates[dates.length-1];

  if(subj.planMeta?.individualDueDates){
    const deadlines=new Set(
      sessions.map(x=>x.dueDate).filter(Boolean)
    );
    return `${sessions.length} sessions · ${totalMinutes} min · ${deadlines.size} individual deadline${deadlines.size===1?'':'s'}`;
  }

  return `${sessions.length} sessions · ${totalMinutes} min · ${first?fmtShortDate(first):''}${last&&last!==first?' → '+fmtShortDate(last):''}`;
}

function renderDayStrip(selected){
  const base=dateFromIso(selected);
  const start=new Date(base);
  start.setDate(base.getDate()-3);

  return Array.from({length:7},(_,i)=>{
    const d=new Date(start);
    d.setDate(start.getDate()+i);
    const iso=isoDate(d);
    const selectedClass=iso===selected?'selected':'';
    const locked=isPastDate(iso)?'locked':'';

    return `
      <button class="day ${selectedClass} ${locked}" data-day="${iso}">
        <div class="day-name">${d.toLocaleDateString(undefined,{weekday:'short'})}</div>
        <div class="day-date">${d.getDate()}</div>
        <div class="day-dot"></div>
      </button>`;
  }).join('');
}

function toggleWorkoutTask(taskId,iso){
  if(isPastDate(iso)) return;
  if(!entries[iso]) entries[iso]={tasks:{}};
  if(!entries[iso].tasks) entries[iso].tasks={};
  entries[iso].tasks[taskId]=!entries[iso].tasks[taskId];
  saveEntries();
  renderWorkout();
  if(appState.currentPage==='home') renderHome();
}

function toggleNoWorkout(iso){
  if(isPastDate(iso)) return;
  if(!entries[iso]) entries[iso]={tasks:{}};
  entries[iso].noWorkout=!entries[iso].noWorkout;
  saveEntries();
  renderWorkout();
}

function renderCalendar(){
  const el=document.getElementById('page-calendar');
  const year=appState.calendarYear;
  const month=appState.calendarMonth;
  const first=new Date(year,month,1);
  const last=new Date(year,month+1,0);
  const startOffset=(first.getDay()+6)%7;
  const cells=Math.ceil((startOffset+last.getDate())/7)*7;

  const monthName=first.toLocaleDateString(undefined,{month:'long',year:'numeric'});
  const cellsHtml=[];

  for(let i=0;i<cells;i++){
    const dayNum=i-startOffset+1;
    if(dayNum<1 || dayNum>last.getDate()){
      cellsHtml.push('<div class="cal-day muted-day"></div>');
      continue;
    }

    const iso=isoDate(new Date(year,month,dayNum));
    const e=getEntry(iso);
    const tasks=getTasksForDow(weekdayIndex(iso));
    const done=tasks.filter(t=>e.tasks?.[t.id]).length;
    const isToday=iso===isoDate(new Date());

    cellsHtml.push(`
      <div class="cal-day ${isToday?'today':''}" data-cal-day="${iso}">
        <div class="cal-day-num">${dayNum}</div>
        <div class="cal-markers">
          ${done?`<div class="cal-marker">✓ ${done} workout</div>`:''}
          ${e.noWorkout?'<div class="cal-marker">Rest</div>':''}
          ${notes[iso]?'<div class="cal-marker">📝 Note</div>':''}
        </div>
      </div>`);
  }

  el.innerHTML=`
    <div>
      <h1>Calendar</h1>
      <div class="subtitle">See your rhythm across the month.</div>
    </div>

    <div class="section">
      <div class="card" style="padding:14px">
        <div class="section-head">
          <button class="btn btn-secondary btn-small" data-action="prev-month">←</button>
          <h2 style="margin:0">${escapeHtml(monthName)}</h2>
          <button class="btn btn-secondary btn-small" data-action="next-month">→</button>
        </div>

        <div class="calendar">
          <div class="calendar-head">
            <div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div><div>Sun</div>
          </div>
          <div class="calendar-grid">${cellsHtml.join('')}</div>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="card" style="padding:16px">
        <div class="section-head">
          <div>
            <h2 style="margin-bottom:3px">Daily note</h2>
            <div class="subtitle">${escapeHtml(fmtDate(appState.selectedDate))}</div>
          </div>
        </div>
        ${isPastDate(appState.selectedDate)?'<div class="lock-banner">🔒 Past days are locked.</div>':''}
        <div class="${isPastDate(appState.selectedDate)?'locked-content':''}">
          <textarea id="dailyNote" placeholder="Write a note for this day...">${escapeHtml(notes[appState.selectedDate]||'')}</textarea>
          ${!isPastDate(appState.selectedDate)?'<button class="btn btn-primary" style="margin-top:10px" data-action="save-note">Save note</button>':''}
        </div>
      </div>
    </div>
  `;

  el.querySelector('[data-action="prev-month"]').onclick=()=>{
    appState.calendarMonth--;
    if(appState.calendarMonth<0){
      appState.calendarMonth=11;
      appState.calendarYear--;
    }
    save(STORAGE_KEYS.app,appState);
    renderCalendar();
  };

  el.querySelector('[data-action="next-month"]').onclick=()=>{
    appState.calendarMonth++;
    if(appState.calendarMonth>11){
      appState.calendarMonth=0;
      appState.calendarYear++;
    }
    save(STORAGE_KEYS.app,appState);
    renderCalendar();
  };

  el.querySelectorAll('[data-cal-day]').forEach(day=>{
    day.onclick=()=>{
      appState.selectedDate=day.dataset.calDay;
      save(STORAGE_KEYS.app,appState);
      renderCalendar();
    };
  });

  el.querySelector('[data-action="save-note"]')?.addEventListener('click',()=>{
    const value=document.getElementById('dailyNote').value;
    notes[appState.selectedDate]=value;
    save(STORAGE_KEYS.notes,notes);
    showToast('Note saved.');
  });
}

            </div>
            <button class="btn btn-danger btn-small" data-action="clear-session-history">Clear</button>
          </div>
        </div>
      </div>
    </div>
  `;

  el.querySelector('[data-action="toggle-workout-setting"]').onclick=()=>{
    settings.workoutEnabled=!settings.workoutEnabled;
    save(STORAGE_KEYS.settings,settings);
    renderSettings();
  };

  el.querySelectorAll('[data-appearance]').forEach(card=>{
    card.onclick=()=>{
      settings.appearance=card.dataset.appearance;
      save(STORAGE_KEYS.settings,settings);
      applyAppearance();
      renderSettings();
    };
  });

  el.querySelector('[data-action="reset-week"]').onclick=resetWeek;
  el.querySelector('[data-action="clear-session-history"]').onclick=()=>{
    saveSessionHistory([]);
    renderSettings();
    showToast('Session history cleared.');
  };
}

function applyAppearance(){
  const mode=settings.appearance||'system';
  let dark=false;

  if(mode==='dark') dark=true;
  if(mode==='system'){
    dark=window.matchMedia?.('(prefers-color-scheme: dark)').matches||false;
  }

  if(dark){
    document.documentElement.style.setProperty('--bg','#111318');
    document.documentElement.style.setProperty('--card','#1a1c21');
    document.documentElement.style.setProperty('--text','#f2f3f5');
    document.documentElement.style.setProperty('--muted','#a2a7b0');
    document.documentElement.style.setProperty('--line','#2a2d34');
    document.documentElement.style.setProperty('--accent-soft','#272a30');
    document.body.style.background='#111318';
  }else{
    document.documentElement.style.setProperty('--bg','#f5f6f8');
    document.documentElement.style.setProperty('--card','#ffffff');
    document.documentElement.style.setProperty('--text','#17191d');
    document.documentElement.style.setProperty('--muted','#6b7078');
    document.documentElement.style.setProperty('--line','#e6e8ec');
    document.documentElement.style.setProperty('--accent-soft','#eef0f3');
    document.body.style.background='#f5f6f8';
  }
}

function resetWeek(){
  const today=new Date();
  const day=today.getDay();
  const mondayOffset=(day+6)%7;
  const monday=addDays(today,-mondayOffset);

  for(let i=0;i<7;i++){
    const iso=addDays(monday,i);
    if(entries[iso]){
      entries[iso].tasks={};
      entries[iso].noWorkout=false;
      entries[iso].focusSkippedWorkoutIds=[];
      entries[iso].focusSkippedStudyIds=[];
      entries[iso].focusUntitled=[];
    }
  }

  saveEntries();
  render();
  showToast('Week reset.');
}

function renderDaySelectionEvents(){
  document.querySelectorAll('[data-day]').forEach(btn=>{
    btn.onclick=()=>{
      appState.selectedDate=btn.dataset.day;
      save(STORAGE_KEYS.app,appState);
      if(appState.currentPage==='workout') renderWorkout();
      if(appState.currentPage==='home') renderHome();
    };
  });
}

const originalRenderWorkout=renderWorkout;
renderWorkout=function(){
  originalRenderWorkout();
  renderDaySelectionEvents();
};

window.addEventListener('storage',()=>{
  settings=load(STORAGE_KEYS.settings,defaultSettings);
  entries=load(STORAGE_KEYS.entries,{});
  subjects=load(STORAGE_KEYS.subjects,[]);
  workout=load(STORAGE_KEYS.workout,{tasks:[],weekPlan:{}});
  notes=load(STORAGE_KEYS.notes,{});
  render();
});

window.addEventListener('beforeunload',()=>{
  if(focusState.mode && focusState.elapsed>0){
    recordFocusSession();
  }
});

applyAppearance();
render();

</script>
</body>
</html>
